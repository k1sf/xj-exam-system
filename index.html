function selectQType(type, btn) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const optArea = document.getElementById('qOptionList');
  const optContainer = document.getElementById('qOptionsArea');
  if (type === 'judge') {
    optArea.innerHTML = '<div style="color:var(--text2);font-size:0.85rem">判断题自动生成：A.正确 / B.错误</div>';
    const addBtn = optContainer.querySelector('.btn-outline');
    if (addBtn) addBtn.style.display = 'none';
    document.getElementById('qAnswer').placeholder = 'A或B';
  } else {
    optArea.innerHTML = '';
    const letters = ['A','B','C','D'];
    letters.forEach(l => {
      optArea.innerHTML += `<div class="option-row"><span class="option-letter">${l}</span><input class="input opt-input" data-letter="${l}" placeholder="选项${l}的内容" style="flex:1"></div>`;
    });
    const addBtn = optContainer.querySelector('.btn-outline');
    if (addBtn) addBtn.style.display = '';
    document.getElementById('qAnswer').placeholder = type === 'multiple' ? '如A,C,D' : '如A';
  }
}

function addOptionRow() {
  const list = document.getElementById('qOptionList');
  const count = list.querySelectorAll('.option-row').length;
  if (count >= 8) { showToast('最多8个选项', 'info'); return; }
  const letter = String.fromCharCode(65 + count);
  const div = document.createElement('div');
  div.className = 'option-row';
  div.innerHTML = `<span class="option-letter">${letter}</span><input class="input opt-input" data-letter="${letter}" placeholder="选项${letter}的内容" style="flex:1"><button class="btn btn-sm btn-ghost" onclick="this.parentElement.remove()" style="color:var(--error)">✕</button>`;
  list.appendChild(div);
}

async function saveQuestion() {
  if (!requireAdmin()) return;
  const btn = document.getElementById('saveQuestionBtn');
  if (btn.disabled) return;
  const type = document.querySelector('.type-btn.active')?.dataset.qtype || 'single';
  const content = document.getElementById('qContent').value.trim();
  const answer = document.getElementById('qAnswer').value.trim().toUpperCase();
  const analysis = document.getElementById('qAnalysis').value.trim();
  const tagsStr = document.getElementById('qTags').value.trim();
  const cohort = document.getElementById('qCohort').value || null;
  const level = document.getElementById('qLevel').value || '初级';
  const tags = tagsStr ? tagsStr.split(/[,，]/).map(t => t.trim()).filter(Boolean) : [];

  if (!content) { showToast('请输入题干', 'error'); return; }
  if (!answer) { showToast('请输入正确答案', 'error'); return; }

  let options = [];
  if (type === 'judge') {
    options = [{ key: 'A', value: '正确' }, { key: 'B', value: '错误' }];
  } else {
    document.querySelectorAll('.opt-input').forEach(inp => {
      const text = inp.value.trim();
      if (text) options.push({ key: inp.dataset.letter, value: text });
    });
  }

  btn.disabled = true; btn.textContent = '处理中...';
  try {
    if (editingQuestionId) {
      await dbUpdate('questions', { type, content, options: JSON.stringify(options), answer, analysis, tags, cohort, level }, { id: editingQuestionId });
      showToast('题目已更新', 'success');
    } else {
      await dbInsert('questions', [{ type, content, options: JSON.stringify(options), answer, analysis, tags, cohort, level }]);
      showToast('题目已添加', 'success');
    }
    closeModal();
    renderAdminQuestions();
  } catch(e) { showToast('保存失败', 'error'); }
  finally { btn.disabled = false; btn.textContent = '保存'; }
}

function previewBatchImport() {
  const text = document.getElementById('batchImportText').value.trim();
  if (!text) { showToast('请输入导入数据', 'error'); return; }
  const importLevel = document.getElementById('batchImportLevel').value || '初级';
  const lines = text.split('\n').filter(l => l.trim());
  const rows = []; const errorLines = [];
  const typeNames = { single: '单选', multiple: '多选', judge: '判断' };
  lines.forEach((line, i) => {
    const parts = line.split('|').map(s => s.trim());
    if (parts.length < 7) { errorLines.push(`第${i+1}行：字段不足`); return; }
    const [type, content, optA, optB, optC, optD, answer, analysis, tagsStr] = parts;
    if (!['single','multiple','judge'].includes(type)) { errorLines.push(`第${i+1}行：题型错误`); return; }
    let options = [];
    if (type === 'judge') {
      options = [{ key: 'A', value: '正确' }, { key: 'B', value: '错误' }];
    } else {
      if (optA) options.push({ key: 'A', value: optA });
      if (optB) options.push({ key: 'B', value: optB });
      if (optC) options.push({ key: 'C', value: optC });
      if (optD) options.push({ key: 'D', value: optD });
    }
    const tags = tagsStr ? tagsStr.split(/[,\uff0c]/).map(t => t.trim()).filter(Boolean) : [];
    rows.push({ type, content, options: JSON.stringify(options), answer: answer.toUpperCase(), analysis: analysis || '', tags, level: importLevel });
  });
  let html = `<div style="font-size:0.85rem;margin-bottom:8px;color:var(--text2)">解析结果：<strong style="color:var(--success)">${rows.length}</strong> 题有效${errorLines.length > 0 ? `，<strong style="color:var(--danger)">${errorLines.length}</strong> 行错误` : ''}</div>`;
  if (errorLines.length > 0) {
    html += `<div style="background:#fef2f2;border-radius:var(--radius-s);padding:8px 12px;margin-bottom:8px;font-size:0.8rem;color:#dc2626">错误：${errorLines.join('、')}</div>`;
  }
  if (rows.length > 0) {
    html += '<div style="max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-s);padding:8px">';
    rows.forEach((r, i) => {
      html += `<div style="padding:6px 0;${i > 0 ? 'border-top:1px solid var(--border)' : ''}"><span style="color:var(--primary);font-weight:600">${i+1}.</span> <span style="color:var(--text2);font-size:0.78rem">[${typeNames[r.type]||r.type}]</span> ${escHtml(r.content.substring(0,60))}${r.content.length > 60 ? '...' : ''} <span style="color:var(--success);font-size:0.78rem">→ ${r.answer}</span></div>`;
    });
    html += '</div>';
    html += `<button class="btn btn-primary btn-full" style="margin-top:12px" id="confirmImportBtn" onclick="doBatchImportConfirm()">确认导入 ${rows.length} 题</button>`;
  }
  document.getElementById('batchImportResult').innerHTML = html;
  window._batchImportRows = rows;
  const importCohort = document.getElementById('batchImportCohort').value.trim() || null;
  window._batchImportRows.forEach(r => r.cohort = importCohort);
}

async function deleteQuestion(qId) {

  showConfirm('确定删除该题目？相关答题记录也会被删除，引用该题的考试也会自动移除该题。', async () => {
    try {
      await dbDelete('records', { question_id: qId });
      // Remove question from any exams that reference it
      const exams = await dbSelect('exams');
      for (const exam of exams) {
        const qids = exam.question_ids || [];
        if (qids.includes(qId)) {
          const newQids = qids.filter(id => id !== qId);
          await dbUpdate('exams', { question_ids: newQids }, { id: exam.id });

      }
      await dbDelete('questions', { id: qId });
      cacheClearTable('questions');

}

async function createExam() {
  if (!requireAdmin()) return;
  const btn = document.getElementById('createExamBtn');
  if (btn.disabled) return;
  const title = document.getElementById('examTitle').value.trim();
  const level = document.getElementById('examLevel').value;
  const cohort = document.getElementById('examCohort').value;
  const duration = parseInt(document.getElementById('examDuration').value);
  const startTime = document.getElementById('examStart').value;
  const endTime = document.getElementById('examEnd').value;
  if (!title || !duration || !startTime || !endTime) { showToast('请填写完整信息', 'error'); return; }

  // Filter questions by selected level
  const levelQuestions = allQuestions.filter(q => q.level === level);

  let questionIds = [];
  if (examPickMode === 'manual') {
    document.querySelectorAll('.exam-pick-q:checked').forEach(cb => questionIds.push(parseInt(cb.value)));
  } else {
    const count = parseInt(document.getElementById('smartCount')?.value) || 0;
    const type = document.getElementById('smartType')?.value;
    if (!count) { showToast('请输入抽题数量', 'error'); return; }
    let pool = type ? levelQuestions.filter(q => q.type === type) : [...levelQuestions];
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    questionIds = pool.slice(0, count).map(q => q.id);
  }
  if (!questionIds.length) { showToast('请选择至少1道题目', 'error'); return; }

  btn.disabled = true; btn.textContent = '处理中...';
  try {
    await dbInsert('exams', [{ title, level, cohort, question_ids: questionIds, duration, start_time: startTime.replace('T',' '), end_time: endTime.replace('T',' ') }]);
    showToast('考试已创建', 'success');
    closeModal();
    renderAdminExams();
  } catch(e) { showToast('创建失败', 'error'); }
  finally { btn.disabled = false; btn.textContent = '创建考试'; }
}

async function viewExamScores(examId) {
  const exam = allExams.find(e => e.id == examId);
  const examIdNum = Number(examId);
  // 使用 cacheBypass 确保获取最新成绩数据
  const records = await dbSelect('records', { eq: { exam_id: examIdNum }, cacheBypass: true });
  const students = await dbSelect('students', { cacheBypass: true });

  if (!records.length) {
    openModal('📊 考试成绩 - ' + escHtml(exam?.title || ''), '<div style="text-align:center;padding:30px;color:var(--text2)"><div>暂无成绩数据</div><div style="margin-top:8px;font-size:0.8rem;color:var(--text2)">提示：请确认学生已完成考试并交卷</div></div>');
    return;
  }

  const scoreMap = {};
  records.forEach(r => {
    if (!scoreMap[r.student_id]) scoreMap[r.student_id] = { correct: 0, total: 0 };
    scoreMap[r.student_id].total++;
    if (r.is_correct) scoreMap[r.student_id].correct++;
  });

  const studentIds = Object.keys(scoreMap);
  // Build guest_name map for quick exam
  const guestNameMap = {};
  records.forEach(r => { if (r.guest_name && r.student_id) guestNameMap[r.student_id] = r.guest_name; });
  const rows = studentIds.map(sid => {
    const s = scoreMap[sid] || { correct: 0, total: 0 };
    const student = students.find(st => st.username === sid);
    const displayName = student?.nickname || guestNameMap[sid] || sid;
    const pct = s.total > 0 ? Math.round(s.correct / s.total * 100) : 0;
    return `<tr>
      <td style="padding:8px;border-bottom:1px solid var(--border)">${escHtml(displayName)}</td>
      <td style="padding:8px;border-bottom:1px solid var(--border)">${s.correct}/${s.total}</td>
      <td style="padding:8px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="rank-bar" style="flex:1"><div class="rank-bar-fill" style="width:${pct}%;background:${gradientColor(pct)}"></div></div>
          <span style="font-weight:600;font-size:0.85rem">${pct}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  openModal('📊 考试成绩 - ' + escHtml(exam.title), `
    <div style="margin-bottom:12px;text-align:center;font-size:0.9rem;color:var(--text2)">共${studentIds.length}人参加</div>
    <table style="width:100%;border-collapse:collapse;font-size:0.88rem">
      <thead><tr><th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">学生</th><th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">正确/总数</th><th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">正确率</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--text2)">暂无成绩数据</td></tr>'}</tbody>
    </table>
    <button class="btn btn-outline btn-full" style="margin-top:16px" onclick="exportExamCSV(${examId})">📥 导出CSV</button>
  `);
}

function exportExamCSV(examId) {
  const exam = allExams.find(e => e.id == examId);
  if (!exam) return;
  const records = dbSelect('records', { eq: { exam_id: examId } });
  // Synchronous CSV from cached data
  const rows = [['学生','用户名','正确数','总题数','正确率']];
  // We already have the data in the modal, so use a simpler approach
  showToast('正在生成...', 'info');
  // Use setTimeout to allow the toast to show
  setTimeout(async () => {
    const recs = await dbSelect('records', { eq: { exam_id: Number(examId) } });
    const students = await dbSelect('students');
    const scoreMap = {};
    recs.forEach(r => {
      if (!scoreMap[r.student_id]) scoreMap[r.student_id] = { correct: 0, total: 0 };
      scoreMap[r.student_id].total++;
      if (r.is_correct) scoreMap[r.student_id].correct++;
    });
    Object.entries(scoreMap).forEach(([sid, s]) => {
      const st = students.find(x => x.username === sid);
      const pct = s.total > 0 ? Math.round(s.correct/s.total*100) : 0;
      rows.push([st?.nickname||sid, sid, s.correct, s.total, pct+'%']);
    });
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `${exam.title}_成绩.csv`; a.click();
    URL.revokeObjectURL(url);
    showToast('导出成功', 'success');
  }, 100);
}

async function createQuickExam() {
  if (!requireAdmin()) return;
  const btn = document.getElementById('createQeBtn');
  if (btn.disabled) return;
  const title = document.getElementById('qeTitle').value.trim();
  const level = document.getElementById('qeLevel').value;
  const duration = parseInt(document.getElementById('qeDuration').value);
  const passRate = parseInt(document.getElementById('qePassRate').value) || 60;
  const startTimeVal = document.getElementById('qeStartTime').value;
  const endTimeVal = document.getElementById('qeEndTime').value;
  if (!title || !duration) { showToast('请填写标题和时长', 'error'); return; }
  if (!startTimeVal || !endTimeVal) { showToast('请设置考试有效期', 'error'); return; }
  const startMs = new Date(startTimeVal).getTime();
  const endMs = new Date(endTimeVal).getTime();
  if (endMs <= startMs) { showToast('结束时间必须晚于开始时间', 'error'); return; }

  const levelQuestions = allQuestions.filter(q => q.level === level);
  let questionIds = [];
  if (qePickMode === 'manual') {
    document.querySelectorAll('.qe-pick-q:checked').forEach(cb => questionIds.push(parseInt(cb.value)));
  } else {
    const count = parseInt(document.getElementById('qeSmartCount')?.value) || 0;
    const type = document.getElementById('qeSmartType')?.value;
    if (!count) { showToast('请输入抽题数量', 'error'); return; }
    let pool = type ? levelQuestions.filter(q => q.type === type) : [...levelQuestions];
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    questionIds = pool.slice(0, count).map(q => q.id);
  }
  if (!questionIds.length) { showToast('请选择至少1道题目', 'error'); return; }

  // Use admin-configured start/end time
  const fmtDT = v => { const d=new Date(v); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'), h=String(d.getHours()).padStart(2,'0'), mi=String(d.getMinutes()).padStart(2,'0'), s=String(d.getSeconds()).padStart(2,'0'); return `${y}-${m}-${dd} ${h}:${mi}:${s}`; };

  btn.disabled = true; btn.textContent = '处理中...';
  try {
    await dbInsert('exams', [{
      title, level, cohort: '',
      question_ids: questionIds, duration,
      start_time: fmtDT(startTimeVal), end_time: fmtDT(endTimeVal),
      is_quick: true, pass_rate: passRate
    }]);
    showToast('快捷考试已创建', 'success');
    closeModal();
    renderQuickExam();
  } catch(e) { showToast('创建失败', 'error'); }
  finally { btn.disabled = false; btn.textContent = '创建快捷考试'; }
}

async function viewQuickExamScores(examId) {
  const exam = allExams.find(e => e.id == examId);
  const examIdNum = Number(examId);
  // 使用 cacheBypass 确保获取最新成绩数据
  const records = await dbSelect('records', { eq: { exam_id: examIdNum }, cacheBypass: true });

  if (!records.length) {
    openModal('📊 快捷考试成绩 - ' + escHtml(exam?.title || ''), '<div style="text-align:center;padding:30px;color:var(--text2)"><div>暂无成绩数据</div><div style="margin-top:8px;font-size:0.8rem;color:var(--text2)">等待考生扫码参加考试</div></div>');
    return;
  }

  // Group by student_id (phone number for quick exam guests)
  const scoreMap = {};
  records.forEach(r => {
    const key = r.student_id;
    if (!scoreMap[key]) scoreMap[key] = { correct: 0, total: 0, guestName: r.guest_name || '', phone: r.student_id };
    scoreMap[key].total++;
    if (r.is_correct) scoreMap[key].correct++;
  });

  // Sort by score descending
  const sorted = Object.values(scoreMap).sort((a, b) => {
    const pctA = a.total > 0 ? a.correct / a.total : 0;
    const pctB = b.total > 0 ? b.correct / b.total : 0;
    return pctB - pctA;
  });

  const passRate = exam?.pass_rate || 60;
  const rows = sorted.map((s, idx) => {
    const pct = s.total > 0 ? Math.round(s.correct / s.total * 100) : 0;
    const passed = pct >= passRate;
    const displayName = s.guestName || s.phone;
    return `<tr>
      <td style="padding:8px;border-bottom:1px solid var(--border);text-align:center;font-weight:600;${idx<3?'color:var(--primary)':''}">${idx + 1}</td>
      <td style="padding:8px;border-bottom:1px solid var(--border)">${escHtml(displayName)}<br><span style="font-size:0.75rem;color:var(--text2)">${escHtml(s.phone)}</span></td>
      <td style="padding:8px;border-bottom:1px solid var(--border)">${s.correct}/${s.total}</td>
      <td style="padding:8px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="rank-bar" style="flex:1"><div class="rank-bar-fill" style="width:${pct}%;background:${gradientColor(pct)}"></div></div>
          <span style="font-weight:600;font-size:0.85rem;color:${passed?'var(--success)':'var(--error)'}">${pct}%</span>
        </div>
      </td>
      <td style="padding:8px;border-bottom:1px solid var(--border);text-align:center">${passed ? '<span style="color:var(--success)">✓ 通过</span>' : '<span style="color:var(--error)">✗ 未通过</span>'}</td>
    </tr>`;
  }).join('');

  const totalParticipants = sorted.length;
  const passedCount = sorted.filter(s => { const pct = s.total > 0 ? Math.round(s.correct / s.total * 100) : 0; return pct >= passRate; }).length;

  openModal('📊 快捷考试成绩 - ' + escHtml(exam.title), `
    <div style="margin-bottom:12px;text-align:center;font-size:0.9rem;color:var(--text2)">共${totalParticipants}人参加，${passedCount}人通过（及格线${passRate}%）</div>
    <table style="width:100%;border-collapse:collapse;font-size:0.82rem">
      <thead><tr>
        <th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">排名</th>
        <th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">姓名/手机</th>
        <th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">正确/总数</th>
        <th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">正确率</th>
        <th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">结果</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text2)">暂无成绩数据</td></tr>'}</tbody>
    </table>
    <button class="btn btn-outline btn-full" style="margin-top:16px" onclick="exportQuickExamCSV(${examId})">📥 导出CSV</button>
  `);
}

function exportQuickExamCSV(examId) {
  const exam = allExams.find(e => e.id == examId);
  if (!exam) return;
  showToast('正在生成...', 'info');
  setTimeout(async () => {
    const recs = await dbSelect('records', { eq: { exam_id: examId } });
    const scoreMap = {};
    recs.forEach(r => {
      const key = r.student_id;
      if (!scoreMap[key]) scoreMap[key] = { correct: 0, total: 0, guestName: r.guest_name || '', phone: r.student_id };
      scoreMap[key].total++;
      if (r.is_correct) scoreMap[key].correct++;
    });
    const sorted = Object.values(scoreMap).sort((a, b) => {
      const pctA = a.total > 0 ? a.correct / a.total : 0;
      const pctB = b.total > 0 ? b.correct / b.total : 0;
      return pctB - pctA;
    });
    const rows = [['排名','姓名','手机号','正确数','总题数','正确率','是否通过']];
    const passRate = exam.pass_rate || 60;
    sorted.forEach((s, idx) => {
      const pct = s.total > 0 ? Math.round(s.correct / s.total * 100) : 0;
      rows.push([idx+1, s.guestName||'', s.phone, s.correct, s.total, pct+'%', pct>=passRate?'通过':'未通过']);
    });
    const csv = rows.map(r => r.join(',')).join('\n');
    const blob = new Blob(['\uFEFF'+csv], {type:'text/csv;charset=utf-8'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = `${exam.title}_成绩.csv`; a.click();
    URL.revokeObjectURL(url);
    showToast('导出成功', 'success');
  }, 100);
}

function switchLearningMode(mode) {
  learningMode = mode;
  _pg.learning = 1;
  document.getElementById('lmDay').className = `btn btn-sm ${mode==='day'?'btn-primary':'btn-outline'}`;
  document.getElementById('lmWeek').className = `btn btn-sm ${mode==='week'?'btn-primary':'btn-outline'}`;
  document.getElementById('lmMonth').className = `btn btn-sm ${mode==='month'?'btn-primary':'btn-outline'}`;
  loadLearningData();
}

function setLearningDate(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  learningDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  _pg.learning = 1;
  const inp = document.getElementById('learningDate');
  if (inp) inp.value = learningDate;
  loadLearningData();
}

function getLearningDateRange() {
  // Return {start, end} as Date objects for the selected mode
  const base = new Date(learningDate + 'T00:00:00');
  let start, end;
  if (learningMode === 'day') {
    start = new Date(base);
    end = new Date(base);
    end.setDate(end.getDate() + 1);
  } else if (learningMode === 'week') {
    // Week: Monday to Sunday containing the selected date
    const day = base.getDay() || 7; // Sunday = 7
    start = new Date(base);
    start.setDate(start.getDate() - day + 1);
    end = new Date(start);
    end.setDate(end.getDate() + 7);
  } else {
    // Month: first to last day of the month
    start = new Date(base.getFullYear(), base.getMonth(), 1);
    end = new Date(base.getFullYear(), base.getMonth() + 1, 1);
  }
  return { start, end };
}

function formatRangeLabel() {
  const { start, end } = getLearningDateRange();
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  if (learningMode === 'day') return `${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`;
  if (learningMode === 'week') return `${fmt(start)} - ${fmt(new Date(end.getTime()-1))}`;
  return `${start.getFullYear()}年${start.getMonth()+1}月`;
}

async function loadLearningData() {
  if (!_pg.learning) _pg.learning = 1;
  const statsEl = document.getElementById('learningStats');
  const rankEl = document.getElementById('learningRank');
  if (!statsEl || !rankEl) return;

  const { start, end } = getLearningDateRange();

  // Fetch records with date filter to avoid loading entire table
  // Use gte/lte on created_at for efficient server-side filtering
  // 使用 cacheBypass 确保获取最新数据
  const allRecords = await dbSelect('records', { order: ['created_at', false], gte: { created_at: start.toISOString() }, lt: { created_at: end.toISOString() }, cacheBypass: true });
  const students = learningCohort
    ? allStudents.filter(s => s.cohort === learningCohort)
    : allStudents;
  const studentIds = new Set(students.map(s => s.username));

  // Filter records by date range and cohort
  const records = allRecords.filter(r => {
    if (!studentIds.has(r.student_id)) return false;
    const t = new Date(r.created_at).getTime();
    return t >= start.getTime() && t < end.getTime();
  });

  // Aggregate per student
  const studentMap = {};
  students.forEach(s => {
    studentMap[s.username] = { username: s.username, nickname: s.nickname, cohort: s.cohort, level: s.level, study_level: s.study_level || levelFromXp(s.xp || 0), total: 0, correct: 0, streak: 0 };
  });
  records.forEach(r => {
    if (!studentMap[r.student_id]) return;
    studentMap[r.student_id].total++;
    if (r.is_correct) studentMap[r.student_id].correct++;
  });

  // Calculate streak (consecutive days with at least 1 answer up to today)
  // Only need recent 60 days for streak calculation, not entire history
  const today = new Date(); today.setHours(0,0,0,0);
  const streakStart = new Date(today); streakStart.setDate(streakStart.getDate() - 60);
  const streakRecords = await dbSelect('records', { gte: { created_at: streakStart.toISOString() }, select: ['student_id', 'created_at'], cacheBypass: true });
  const dayRecords = {};
  streakRecords.forEach(r => {
    if (!studentIds.has(r.student_id)) return;
    const _d = new Date(r.created_at); const day = `${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}`;
    if (!dayRecords[r.student_id]) dayRecords[r.student_id] = new Set();
    dayRecords[r.student_id].add(day);
  });
  Object.keys(studentMap).forEach(sid => {
    const days = dayRecords[sid];
    if (!days) { studentMap[sid].streak = 0; return; }
    let streak = 0;
    const d = new Date(today);
    while (true) {
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (days.has(key)) { streak++; d.setDate(d.getDate() - 1); }
      else break;
    }
    studentMap[sid].streak = streak;
  });

  // Sort by total questions descending (activity ranking)
  const sorted = Object.values(studentMap).sort((a, b) => {
    if (b.total !== a.total) return b.total - a.total;
    return b.correct - a.correct;
  });
  learningRankData = sorted;  // store for export

  // Stats summary
  const activeCount = sorted.filter(s => s.total > 0).length;
  const totalQuestions = sorted.reduce((sum, s) => sum + s.total, 0);
  const totalCorrect = sorted.reduce((sum, s) => sum + s.correct, 0);
  const avgRate = totalQuestions > 0 ? Math.round(totalCorrect / totalQuestions * 100) : 0;

  statsEl.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card blue"><div class="stat-icon">👥</div><div class="stat-value" data-target="${students.length}">0</div><div class="stat-label">总人数</div></div>
      <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-value" data-target="${activeCount}">0</div><div class="stat-label">活跃人数</div></div>
      <div class="stat-card orange"><div class="stat-icon">✍️</div><div class="stat-value" data-target="${totalQuestions}">0</div><div class="stat-label">答题总数</div></div>
      <div class="stat-card purple"><div class="stat-icon">🎯</div><div class="stat-value">${avgRate}%</div><div class="stat-label">平均正确率</div></div>
    </div>
  `;
  document.querySelectorAll('#learningStats .stat-value[data-target]').forEach(el => {
    animateNumber(el, parseInt(el.dataset.target));
  });

  // Rank table
  const rangeLabel = formatRangeLabel();
  const modeLabel = { day: '日', week: '周', month: '月' }[learningMode];
  const modeIcon = { day: '📅', week: '📆', month: '🗓️' }[learningMode];

  // Pagination for rank table
  _pageRenderers.learning = loadLearningData;
  const pgItems = pageSlice(sorted, _pg.learning);
  const rows = pgItems.map((s, idx) => {
    const realIdx = (_pg.learning - 1) * PER_PAGE + idx;
    const pct = s.total > 0 ? Math.round(s.correct / s.total * 100) : 0;
    const rankClass = realIdx === 0 ? 'gold' : realIdx === 1 ? 'silver' : realIdx === 2 ? 'bronze' : '';
    const medal = realIdx < 3 ? ['🥇','🥈','🥉'][realIdx] : (realIdx + 1);
    const streakHtml = s.streak > 0 ? `<span style="color:#f59e0b;font-size:0.75rem">🔥${s.streak}天</span>` : '';
    const levelHtml = s.level ? `<span class="tag tag-blue" style="font-size:0.6rem;padding:1px 4px">${LEVEL_ICONS[s.level]||''} ${escHtml(s.level)}</span>` : '';
    const sLv = s.study_level || 1;
    const lvBadge = `<span class="tag" style="background:var(--tag-orange-bg,#fef3c7);color:var(--tag-orange-text,#92400e);font-size:0.6rem;padding:1px 4px">${studyLevelIcon(sLv)} Lv.${sLv}</span>`;
    return `<tr>
      <td style="padding:8px 6px;border-bottom:1px solid var(--border);text-align:center;font-weight:600;width:36px"><span class="rank-num ${rankClass}">${medal}</span></td>
      <td style="padding:8px 6px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:6px">
          <div class="student-avatar" style="background:${hashColor(s.nickname)};width:28px;height:28px;font-size:0.75rem;flex-shrink:0">${escHtml(s.nickname.charAt(0))}</div>

function renderLearningTrend(allRecords, studentIds) {
  const trendEl = document.getElementById('learningTrend');
  if (!trendEl) return;

  // Last 7 days
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    d.setHours(0,0,0,0);
    days.push(d);
  }

  const dayData = days.map(d => {
    const next = new Date(d); next.setDate(next.getDate() + 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dayRecords = allRecords.filter(r => {
      if (!studentIds.has(r.student_id)) return false;
      const t = new Date(r.created_at).getTime();
      return t >= d.getTime() && t < next.getTime();
    });
    const activeStudents = new Set(dayRecords.map(r => r.student_id)).size;
    const totalQ = dayRecords.length;
    const correctQ = dayRecords.filter(r => r.is_correct).length;
    const pct = totalQ > 0 ? Math.round(correctQ / totalQ * 100) : 0;
    return { key, activeStudents, totalQ, correctQ, pct };
  });

  const maxQ = Math.max(...dayData.map(d => d.totalQ), 1);
  const maxActive = Math.max(...dayData.map(d => d.activeStudents), 1);

  const bars = dayData.map(d => {
    const hPct = Math.round(d.totalQ / maxQ * 100);
    const barColor = d.totalQ > 0 ? 'var(--primary)' : '#e2e8f0';
    const weekday = ['日','一','二','三','四','五','六'][new Date(d.key).getDay()];
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">
      <div style="font-size:0.7rem;color:var(--text2)">${d.totalQ}</div>
      <div style="width:100%;max-width:28px;height:80px;background:#f1f5f9;border-radius:4px;display:flex;align-items:flex-end;overflow:hidden">
        <div style="width:100%;height:${Math.max(hPct, 4)}%;background:${barColor};border-radius:4px 4px 0 0;transition:height 0.3s"></div>
      </div>
      <div style="font-size:0.65rem;color:var(--text2)">${d.key.slice(5)}</div>
      <div style="font-size:0.6rem;color:var(--text2)">周${weekday}</div>
    </div>`;
  }).join('');

  const summaryRows = dayData.map(d => {
    return `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:0.82rem;border-bottom:1px solid var(--border)">
      <span style="color:var(--text2)">${d.key.slice(5)}</span>
      <span><strong>${d.activeStudents}</strong>人活跃 · <strong>${d.totalQ}</strong>题 · 正确率<strong>${d.pct}%</strong></span>
    </div>`;
  }).join('');

  trendEl.innerHTML = `
    <div style="display:flex;align-items:flex-end;gap:4px;padding:8px 0">${bars}</div>
    <div style="margin-top:8px">${summaryRows}</div>
  `;
}

// ===== Learning Export =====
function exportLearningCSV() {
  if (!learningRankData || learningRankData.length === 0) { showToast('暂无数据可导出', 'error'); return; }
  const header = '排名,昵称,班级,级别,答题数,正确数,正确率,连续天数\n';
  const rows = learningRankData.map((s, i) =>
    `${i+1},"${s.nickname}","${s.cohort||''}","${s.level||''}",${s.total},${s.correct},${s.total > 0 ? Math.round(s.correct/s.total*100) : 0}%,${s.streak}`
  ).join('\n');
  const bom = '\uFEFF';
  const blob = new Blob([bom + header + rows], { type: 'text/csv;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `学情排行_${learningDate || 'export'}.csv`;
  a.click(); URL.revokeObjectURL(url);
  showToast('导出成功', 'success');
}

      enqueueOperation({ type: 'update', table: 'students', data: { level }, match: { id: currentUser.id } });
    }
  }
  // Re-render current tab and update header
  const activeTab = document.querySelector('.student-tab.active')?.dataset.tab || 'practice';
  switchStudentTab(activeTab);
}

function switchStudentTab(tab) {
  // If we're on a result page (no studentContent), re-render student home first
  if (!document.getElementById('studentContent')) {
    renderStudent();
    setTimeout(() => switchStudentTab(tab), 60);
    return;
  }
  document.querySelectorAll('.student-tab').forEach(t => t.classList.toggle('active', t.dataset.tab === tab));
  switch(tab) {
    case 'practice': renderPractice(); break;
    case 'mock': renderMockExam(); break;
    case 'exam': renderStudentExam(); break;
    case 'wrong': renderWrongBook(); break;
    case 'profile': renderProfile(); break;
  }
}

// ===== Student Tab1: Practice =====
async function renderPractice() {
  // Try cache-only first (no cloud access for tab switches)
  let allQ = await dbSelect('questions', { eq: { level: currentLevel }, order: ['id', false], cacheOnly: true });
  let records = await dbSelect('records', { eq: { student_id: currentUser.username }, cacheOnly: true });

  if (!allQ || !records) {
    // Cache miss - show loading and fetch from cloud
    const content = document.getElementById('studentContent');
    content.innerHTML = `<div style="text-align:center;padding:40px"><div class="spinner-lg" style="margin:0 auto"></div><div style="margin-top:12px;color:var(--text2)">加载题目...</div></div>`;
    allQ = await dbSelect('questions', { eq: { level: currentLevel }, order: ['id', false] });
    records = await dbSelect('records', { eq: { student_id: currentUser.username }, cacheBypass: true });
  }

  practiceQuestions = allQ;
  practiceAnswered = {};
  practiceMultiSelected = {};
  practiceMode = 'all';

  // Pre-populate fav status (use latest record per question)
  const latestRecordByQ = {};
  records.forEach(r => {
    if (!latestRecordByQ[r.question_id] || new Date(r.created_at) > new Date(latestRecordByQ[r.question_id].created_at)) {
      latestRecordByQ[r.question_id] = r;
    }
  });
  Object.entries(latestRecordByQ).forEach(([qId, r]) => {
    if (r.is_fav) {
      practiceAnswered[qId] = practiceAnswered[qId] || {};
      practiceAnswered[qId].isFav = true;
    }
  });

  // Check for saved progress in "all" mode
  const saved = loadPracticeProgress();
  if (saved && saved.total === allQ.length && saved.firstQId === allQ[0]?.id && saved.index > 0) {
    renderPracticeUI();
    showContinueDialog(saved);
  } else {
    practiceIndex = 0;
    renderPracticeUI();
  }
}

function renderPracticeUI() {
  const modes = [
    { key: 'all', label: '全部', icon: '📝' },
    { key: 'wrong', label: '错题', icon: '❌' },
    { key: 'fav', label: '收藏', icon: '⭐' },
    { key: 'random', label: '随机', icon: '🎲' }
  ];
  const modeBtns = modes.map(m => `<button class="mode-btn ${practiceMode===m.key?'active':''}" onclick="switchPracticeMode('${m.key}')">${m.icon} ${m.label}</button>`).join('');
  document.getElementById('studentContent').innerHTML = `
    <div class="practice-modes">${modeBtns}</div>
    <div id="practiceCardArea"></div>
  `;
  renderPracticeCard();
}

async function switchPracticeMode(mode) {
  practiceMode = mode;
  practiceIndex = 0;
  practiceMultiSelected = {};

  const allQ = await dbSelect('questions', { eq: { level: currentLevel }, order: ['id', false] });
  // 使用 cacheBypass 确保获取最新的收藏状态
  const records = await dbSelect('records', { eq: { student_id: currentUser.username }, cacheBypass: true });

  switch(mode) {
    case 'wrong': {
      const wrongQIds = [...new Set(records.filter(r => !r.is_correct).map(r => r.question_id))];
      practiceQuestions = allQ.filter(q => wrongQIds.includes(q.id));
      break;
    }
    case 'fav': {
      const favQIds = [...new Set(records.filter(r => r.is_fav).map(r => r.question_id))];
      practiceQuestions = allQ.filter(q => favQIds.includes(q.id));
      break;
    }
    case 'random': {
      practiceQuestions = [...allQ].sort(() => Math.random() - 0.5);
      break;
    }
    default:
      practiceQuestions = allQ;
  }
  // Check for saved progress when switching back to 'all' mode
  if (mode === 'all') {
    const saved = loadPracticeProgress();
    if (saved && saved.total === allQ.length && saved.firstQId === allQ[0]?.id && saved.index > 0) {
      renderPracticeUI();
      showContinueDialog(saved);
      return;
    }
  }
  renderPracticeUI();
}

function renderPracticeCard() {
  const area = document.getElementById('practiceCardArea');
  if (!practiceQuestions.length) {
    area.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>暂无题目</p></div>';
    return;
  }
  if (practiceIndex >= practiceQuestions.length) {
    area.innerHTML = `<div style="text-align:center;padding:40px">
      <div style="font-size:64px;margin-bottom:16px">🎉</div>
      <div style="font-size:1.2rem;font-weight:600;margin-bottom:8px">恭喜完成！</div>
      <div style="color:var(--text2);margin-bottom:20px">你已完成所有题目</div>
      <button class="btn btn-primary" onclick="practiceIndex=0;practiceAnswered={};practiceMultiSelected={};clearPracticeProgress();renderPracticeCard()">重新开始</button>
    </div>`;
    showConfetti();
    return;
  }

  const q = practiceQuestions[practiceIndex];
  const answered = practiceAnswered[q.id];
  const progress = ((practiceIndex + 1) / practiceQuestions.length * 100).toFixed(1);

  // Normalize options
  let options = (q.options || []).map((o, i) => ({
    letter: o.key || o.label || String.fromCharCode(65 + i),
    text: o.value || o.text || ''
  }));
  if (q.type === 'judge' && options.length === 0) {
    options = [{ letter: 'A', text: '正确' }, { letter: 'B', text: '错误' }];
  }

  const typeMap = { single: ['单选', 'tag-blue'], multiple: ['多选', 'tag-purple'], judge: ['判断', 'tag-green'] };
  const [typeLabel, typeClass] = typeMap[q.type] || ['未知', 'tag-gray'];
  const isMulti = q.type === 'multiple';
  const multiSel = practiceMultiSelected[q.id] || {};

  const isAnswered = answered && answered.isCorrect !== undefined;
  const optHtml = options.map((opt, oi) => {
    let cls = 'opt-btn';
    let icon = '';
    if (isAnswered) {
      const userAns = answered.answer || '';
      const correctAns = q.answer || '';
      if (userAns.includes(opt.letter)) {
        cls += correctAns.includes(opt.letter) ? ' correct' : ' wrong';
        icon = correctAns.includes(opt.letter) ? '<span class="opt-icon">✓</span>' : '<span class="opt-icon">✗</span>';
      } else if (correctAns.includes(opt.letter) && !userAns.includes(opt.letter)) {
        cls += ' show-correct';
        icon = '<span class="opt-icon">✓</span>';
      }
    } else if (isMulti && multiSel[opt.letter]) {
      cls += ' selected';
    }
    return `<button class="${cls}" data-idx="${oi}" data-letter="${opt.letter}" onclick="answerPractice(${q.id},'${opt.letter}')">${icon}<span>${opt.letter}. ${escHtml(opt.text)}</span></button>`;
  }).join('');

  const favActive = answered?.isFav ? 'active' : '';
  const analysisHtml = isAnswered && q.analysis ? `
    <div class="analysis-box"><span class="analysis-icon">💡</span>${escHtml(q.analysis)}</div>
  ` : '';
  const multiConfirmHtml = isMulti && !isAnswered ? `<div class="confirm-submit-bar"><button class="multi-confirm-btn" onclick="confirmMultiAnswer(${q.id})">确认提交</button></div>` : '';

  area.innerHTML = `
    <div class="practice-card">
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-text">第${practiceIndex+1}/${practiceQuestions.length}题</div>
      <span class="tag ${typeClass} q-type-tag">${typeLabel}</span>
      <div class="q-content">${escHtml(q.content)}</div>
      <div id="optionsArea">${optHtml}</div>
      ${multiConfirmHtml}
      ${analysisHtml}
      <div class="practice-actions">
        <button class="btn btn-outline" onclick="practicePrev()" ${practiceIndex===0?'disabled':''}>上一题</button>
        <button class="btn fav-btn ${favActive}" onclick="toggleFav(${q.id})" aria-label="收藏">${answered?.isFav?'⭐':'☆'}</button>
        <button class="btn btn-primary" onclick="practiceNext()">下一题</button>
      </div>
    </div>
  `;
}

// 统一答案比较：多选题去除分隔符后排序比较
function checkAnswer(userAnswer, correctAnswer, questionType) {
  if (!userAnswer || !correctAnswer) return false;
  if (questionType === 'multiple') {
    const normalize = s => String(s).replace(/[,，、\s]/g, '').split('').sort().join('');
    return normalize(userAnswer) === normalize(correctAnswer);
  }
  return String(userAnswer) === String(correctAnswer);
}

function answerPractice(qId, letter) {
  const q = practiceQuestions.find(x => x.id === qId);
  if (!q) return;

  if (q.type === 'multiple') {
    // Multi-select: toggle selection - update DOM locally, no full re-render
    if (!practiceMultiSelected[qId]) practiceMultiSelected[qId] = {};
    practiceMultiSelected[qId][letter] = !practiceMultiSelected[qId][letter];
    // Update only the clicked option button's CSS class
    const btn = document.querySelector(`#optionsArea .opt-btn[data-letter="${letter}"]`);
    if (btn) {
      if (practiceMultiSelected[qId][letter]) {
        btn.classList.add('selected');
      } else {
        btn.classList.remove('selected');
      }
    }
    return;
  }

  // Single/Judge: immediate answer - full re-render to show result
  if (practiceAnswered[qId] && practiceAnswered[qId].isCorrect !== undefined) return;

  const isCorrect = checkAnswer(letter, q.answer, q.type);
  practiceAnswered[qId] = { answer: letter, isCorrect, isFav: practiceAnswered[qId]?.isFav || false };
  // Buffer record for batch insert
  bufferRecord({ student_id: currentUser.username, question_id: qId, is_correct: isCorrect, user_answer: letter, is_fav: false });
  addXp(isCorrect ? XP_REWARDS.correct : XP_REWARDS.wrong, isCorrect ? '答对' : '答题');
  renderPracticeCard();
  savePracticeProgress();
}

function confirmMultiAnswer(qId) {
  const q = practiceQuestions.find(x => x.id === qId);
  if (!q) return;
  const sel = practiceMultiSelected[qId] || {};
  const answer = Object.keys(sel).filter(k => sel[k]).sort().join(',');
  if (!answer) { showToast('请先选择答案', 'info'); return; }
  const isCorrect = checkAnswer(answer, q.answer, 'multiple');
  practiceAnswered[qId] = { answer, isCorrect, isFav: practiceAnswered[qId]?.isFav || false };
  delete practiceMultiSelected[qId];
  bufferRecord({ student_id: currentUser.username, question_id: qId, is_correct: isCorrect, user_answer: answer, is_fav: false });
  addXp(isCorrect ? XP_REWARDS.correct : XP_REWARDS.wrong, isCorrect ? '答对' : '答题');
  renderPracticeCard();
  savePracticeProgress();
}

async function toggleFav(qId) {
  // Check local buffer first, then DB
  const bufferedRecord = _recordBuffer.find(r => r.question_id === qId);
  let records = [];
  if (bufferedRecord) {
    records = [bufferedRecord];
  } else {
    records = await dbSelect('records', { eq: { student_id: currentUser.username, question_id: qId }, cacheBypass: true });
  }
  if (records.length > 0) {
    const latest = records.reduce((a, b) => new Date(a.created_at || 0) > new Date(b.created_at || 0) ? a : b);
    const isFav = !latest.is_fav;
    if (latest.id) {
      // 立即同步到数据库，不再延迟
      await flushFavUpdateNow(latest.id, isFav);
    } else {
      // Record is in buffer, update it locally
      latest.is_fav = isFav;
    }
    if (!practiceAnswered[qId]) practiceAnswered[qId] = {};
    practiceAnswered[qId].isFav = isFav;
    if (isFav) addXp(XP_REWARDS.fav, '收藏');
  } else {
    // 新建收藏记录，立即同步到数据库
    try {
      await dbInsert('records', [{ student_id: currentUser.username, question_id: qId, is_correct: false, user_answer: '', is_fav: true }]);
      // 清除缓存确保数据一致
      cacheRemoveAnywhere('records');
    } catch(e) {
      console.warn('创建收藏记录失败:', e);
    }
    if (!practiceAnswered[qId]) practiceAnswered[qId] = {};
    practiceAnswered[qId].isFav = true;
    addXp(XP_REWARDS.fav, '收藏');
  }
  // Local DOM update: only update the fav button, no full re-render
  const favBtn = document.querySelector('.fav-btn');
  if (favBtn) {
    const isFav = practiceAnswered[qId]?.isFav;
    favBtn.className = `btn fav-btn ${isFav ? 'active' : ''}`;
    favBtn.textContent = isFav ? '⭐' : '☆';
  }
}

// ===== Practice progress memory =====
function savePracticeProgress() {
  if (practiceMode !== 'all') return;
  const key = `practice_progress_${currentUser.username}_${currentLevel}`;
  localStorage.setItem(key, JSON.stringify({
    index: practiceIndex,
    total: practiceQuestions.length,
    firstQId: practiceQuestions[0]?.id || null,
    timestamp: Date.now()
  }));
}
function loadPracticeProgress() {
  const key = `practice_progress_${currentUser.username}_${currentLevel}`;
  const data = localStorage.getItem(key);
  if (!data) return null;
  try { return JSON.parse(data); } catch { return null; }
}
function clearPracticeProgress() {
  const key = `practice_progress_${currentUser.username}_${currentLevel}`;
  localStorage.removeItem(key);
}

function showContinueDialog(saved) {
  const idx = saved.index;
  const total = saved.total;
  const pct = ((idx / total) * 100).toFixed(0);
  const timeStr = saved.timestamp ? new Date(saved.timestamp).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  const overlay = document.createElement('div');
  overlay.id = 'continue-overlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `
    <div style="background:var(--card);border-radius:16px;padding:28px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2);position:relative">
      <button onclick="dismissContinueDialog()" style="position:absolute;top:12px;right:12px;background:none;border:none;font-size:1.2rem;color:var(--text3);cursor:pointer;padding:4px;line-height:1">✕</button>
      <div style="font-size:48px;margin-bottom:12px">📖</div>
      <div style="font-size:1.15rem;font-weight:700;margin-bottom:8px;color:var(--text1)">发现学习记录</div>
      <div style="color:var(--text2);font-size:.875rem;margin-bottom:6px">上次做到第 <b style="color:var(--primary)">${idx + 1}</b> / ${total} 题 (${pct}%)</div>
      ${timeStr ? `<div style="color:var(--text3);font-size:.75rem;margin-bottom:18px">${timeStr}</div>` : '<div style="margin-bottom:18px"></div>'}
      <div style="display:flex;gap:12px">
        <button onclick="continueFromStart()" style="flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text1);font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s">从头开始</button>
        <button onclick="continueFromSaved(${idx})" style="flex:1;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:0 4px 12px rgba(79,108,255,.3)">继续做题</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  // Allow clicking outside the dialog box to dismiss
  overlay.addEventListener('click', (e) => { if (e.target === overlay) dismissContinueDialog(); });
}
function dismissContinueDialog() {
  const overlay = document.getElementById('continue-overlay');
  if (overlay) overlay.remove();
  practiceIndex = 0;
  renderPracticeCard();
}
function continueFromStart() {
  document.getElementById('continue-overlay')?.remove();
  practiceIndex = 0;
  clearPracticeProgress();
  renderPracticeCard();
}
function continueFromSaved(idx) {
  document.getElementById('continue-overlay')?.remove();
  practiceIndex = idx;
  renderPracticeCard();
  savePracticeProgress();
}

function practicePrev() { if (practiceIndex > 0) { practiceIndex--; renderPracticeCard(); savePracticeProgress(); } }
function practiceNext() { if (practiceIndex < practiceQuestions.length - 1) { practiceIndex++; renderPracticeCard(); savePracticeProgress(); } else { practiceIndex = practiceQuestions.length; renderPracticeCard(); savePracticeProgress(); } }

async function startMockExam() {
  showLoading();

  // Fetch questions filtered by student's level
  const allQ = await dbSelect('questions', { eq: { level: currentLevel }, order: ['id', false] });
  const records = await dbSelect('records', { eq: { student_id: currentUser.username }, cacheBypass: true });

  // Filter by source
  let pool = [...allQ];
  switch (mockSettings.source) {
    case 'wrong': {
      const wrongQIds = [...new Set(records.filter(r => !r.is_correct).map(r => r.question_id))];
      pool = allQ.filter(q => wrongQIds.includes(q.id));
      break;
    }
    case 'fav': {
      const favQIds = [...new Set(records.filter(r => r.is_fav).map(r => r.question_id))];
      pool = allQ.filter(q => favQIds.includes(q.id));
      break;
    }
    case 'new': {
      const doneQIds = [...new Set(records.map(r => r.question_id))];
      pool = allQ.filter(q => !doneQIds.includes(q.id));
      break;
    }
  }

  // Filter by type
  if (mockSettings.types.length < 3) {
    pool = pool.filter(q => mockSettings.types.includes(q.type));
  }

  // Shuffle and pick
  pool = pool.sort(() => Math.random() - 0.5);
  const selected = pool.slice(0, mockSettings.count);

  hideLoading();

  if (selected.length === 0) {
    showToast('没有符合条件的题目，请调整设置', 'error');
    return;
  }
  if (selected.length < mockSettings.count) {
    showToast(`符合条件的题目只有${selected.length}题（不足${mockSettings.count}题）`, 'info');
  }

  showConfirm(`模拟考试：${selected.length}题 · ${mockSettings.duration}分钟\n开始后请勿切换页面，确认开始？`, async () => {
    // Set up exam state using mock exam data
    examData = {
      id: null,
      title: '模拟考试',
      isMock: true,
      duration: mockSettings.duration,
      passRate: mockSettings.passRate,
      question_ids: selected.map(q => q.id)
    };
    currentExamId = null;  // 模拟考试无exam_id
    currentExamIsMock = true;  // 模拟考试
    currentExamIsQuick = false;  // 非快捷考试
    currentExamPassRate = mockSettings.passRate;  // 模拟考试及格线
    examAnswers = {};
    fullscreenExitCount = 0;
    examRemaining = mockSettings.duration * 60;

    // Anti-cheat: disable right-click, text selection, and detect tab switching
    document.addEventListener('contextmenu', preventContextMenu);
    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';
    document.addEventListener('visibilitychange', handleVisibilityChange);

    practiceQuestions = selected;
    renderExamTaking();
  });
}

// ===== Student Tab2: Exam =====
let _filteredStudentExams = [];
let _takenExamIds = new Set();
async function renderStudentExam() {
  // Cache-only: no cloud access for tab switches
  let examsCache = await dbSelect('exams', { order: ['id', false], cacheOnly: true });
  allExams = examsCache || await dbSelect('exams', { order: ['id', false] });
  const now = Date.now();
  _filteredStudentExams = allExams.filter(e => {
    if (e.is_quick) return false; // 快捷考试不显示在学生考试Tab
    // Filter by student's level
    if (e.level && e.level !== currentLevel) return false;
    if (e.cohort && currentUser.cohort && e.cohort !== currentUser.cohort) return false;
    return true;
  });

  // Check which exams the student has already taken
  let myRecords = await dbSelect('records', { eq: { student_id: currentUser.username }, cacheOnly: true });
  if (!myRecords) myRecords = await dbSelect('records', { eq: { student_id: currentUser.username } });
  _takenExamIds = new Set();
  myRecords.forEach(r => { if (r.exam_id) _takenExamIds.add(Number(r.exam_id)); });

  _pg.studentExam = 1;
  _pageRenderers.studentExam = renderStudentExamPage;
  renderStudentExamPage();
}
function renderStudentExamPage() {
  const exams = _filteredStudentExams;
  const now = Date.now();
  const page = _pg.studentExam;
  const pageItems = pageSlice(exams, page);
  const list = pageItems.length ? pageItems.map(e => {
    const start = new Date(e.start_time).getTime();
    const end = new Date(e.end_time).getTime();
    const status = now < start ? 'upcoming' : now > end ? 'ended' : 'ongoing';
    const statusMap = { upcoming: ['未开始', 'tag-gray'], ongoing: ['进行中', 'tag-green'], ended: ['已结束', 'tag-red'] };
    const [label, cls] = statusMap[status];
    const qCount = (e.question_ids || []).length;
    const hasTaken = _takenExamIds.has(Number(e.id));
    let actionHtml = '';
    if (hasTaken) {
      actionHtml = '<button class="btn btn-full" style="margin-top:8px;background:var(--border);color:var(--text2);cursor:not-allowed;border:none" onclick="showToast(\'你已经参加过本次考试\',\'info\')">✅ 已参加</button>';
    } else if (status === 'ongoing') {
      actionHtml = '<button class="btn btn-primary btn-full" style="margin-top:8px" onclick="enterExam(' + e.id + ')">进入考试</button>';
    } else if (status === 'ended') {
      actionHtml = '<button class="btn btn-sm btn-outline" style="margin-top:8px" onclick="viewExamResult(' + e.id + ')">查看成绩</button>';
    }
    return '<div class="exam-list-card ' + status + '">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span class="exam-title" style="flex:1">' + escHtml(e.title) + '</span><span class="tag ' + cls + '">' + label + '</span></div>' +
      '<div class="exam-meta">📋 ' + qCount + '题 · ⏱️ ' + e.duration + '分钟</div>' +
      '<div class="exam-time">🕐 ' + formatTime(e.start_time) + ' → ' + formatTime(e.end_time) + '</div>' +
      actionHtml +
      '</div>';
  }).join('') : '<div class="empty-state"><div class="empty-icon">📋</div><p>暂无考试</p></div>';

  document.getElementById('studentContent').innerHTML = list + paginateHtml('studentExam', exams.length, page);
}

async function enterExam(examId) {
  const exam = allExams.find(e => e.id == examId);
  if (!exam) return;

  // Check if already submitted
  const existRecords = await dbSelect('records', { eq: { student_id: currentUser.username, exam_id: Number(examId) || examId } });
  if (existRecords.length > 0) {
    showToast('你已经参加过本次考试', 'info');
    viewExamResult(examId);
    return;
  }

  showConfirm('确认进入考试？考试期间请勿切换页面，切换2次将自动交卷。', async () => {
    examData = exam;
    currentExamId = exam.id ? Number(exam.id) : null;  // 独立保存考试ID
    currentExamIsMock = false;  // 正式考试
    currentExamIsQuick = false;  // 非快捷考试
    currentExamPassRate = 60;  // 正式考试默认及格线
    examAnswers = {};
    fullscreenExitCount = 0;
    examRemaining = exam.duration * 60;

    // Anti-cheat: disable right-click, text selection, and detect tab switching
    document.addEventListener('contextmenu', preventContextMenu);
    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';
    document.addEventListener('visibilitychange', handleVisibilityChange);

    // Load exam questions
    const allQ = await dbSelect('questions', { order: ['id', false] });
    practiceQuestions = (exam.question_ids || []).map(id => allQ.find(q => q.id == id)).filter(Boolean);

    renderExamTaking();
  });
}

function preventContextMenu(e) { e.preventDefault(); }

function handleVisibilityChange() {
  if (document.hidden && examData) {
    fullscreenExitCount++;
    if (fullscreenExitCount === 1) {
      const warn = document.getElementById('anti-cheat-warning');
      if (warn) { warn.innerHTML = `<div class="warn-icon">⚠️</div><h2>请勿切换页面！</h2><p>检测到你离开了考试页面，第1次警告，再次离开将自动交卷</p><button class="btn btn-primary" onclick="this.parentElement.style.display='none'" style="margin-top:12px">我知道了</button>`; warn.style.display = 'flex'; }
    } else if (fullscreenExitCount >= 2) {
      autoSubmitExam('多次切换页面，考试已自动提交');
    }
  }
}

function handleFullscreenChange() {
  // Fullscreen no longer enforced - kept for compatibility
}

async function reenterFullscreen() {
  const warn = document.getElementById('anti-cheat-warning');
  if (warn) warn.style.display = 'none';
}

async function autoSubmitExam(reason) {
  if (_examSubmitting) return;
  _examSubmitting = true;
  document.getElementById('anti-cheat-warning').style.display = 'none';
  exitExamMode();
  try {
    await submitExamAnswers();
  } catch(e) {
    console.error('Auto-submit failed:', e);
  }
  showToast(reason, 'error');
}

function exitExamMode() {
  if (examTimerInterval) { clearInterval(examTimerInterval); examTimerInterval = null; }
  document.removeEventListener('contextmenu', preventContextMenu);
  document.removeEventListener('visibilitychange', handleVisibilityChange);
  document.body.style.userSelect = '';
  document.body.style.webkitUserSelect = '';
  examData = null;
  // 注意：不在这里清空 currentExamId，因为 submitExamAnswers 在 exitExamMode 之后调用需要用到它
  // currentExamId 会在下次 enterExam 或 startMockExam 时重新赋值
}

function renderExamTaking() {
  const isMock = currentExamIsMock;
  const isQuick = currentExamIsQuick;
  const title = isMock ? `🎯 模拟考试` : isQuick ? `⚡ ${escHtml(examData.title)}` : escHtml(examData.title);
  const badge = isMock ? '<span class="mock-badge">模拟</span>' : isQuick ? '<span class="mock-badge" style="background:#f59e0b">快捷</span>' : '';
  document.getElementById('app').innerHTML = `
    <div class="exam-taking-header">
      <div class="exam-taking-title">${title}${badge}</div>
      <div class="exam-taking-timer" id="examTimer" aria-live="polite">${formatMmSs(examRemaining)}</div>
      <div class="exam-taking-count" id="examCount">0/${practiceQuestions.length}</div>
    </div>
    <div class="exam-taking-body" id="examBody" style="padding-top:56px"></div>
    <div class="exam-q-nav-wrap" id="examQNavWrap">
      <div class="exam-q-nav-header" onclick="toggleExamQNav()">
        <span>答题卡 (<em id="examNavAnswered">0</em>/${practiceQuestions.length})</span>
        <span class="toggle-icon" id="examNavToggle">▼</span>
      </div>
      <div class="exam-q-nav-body" id="examQNav"></div>
    </div>
    <div class="exam-bottom-bar" id="examBottomBar">
      <button class="exam-nav-btn prev" id="examPrevBtn" onclick="examGoPrev()">上一题</button>
      <button class="exam-confirm-btn" id="examConfirmBtn" onclick="examConfirmAndNext()">确认</button>
      <button class="exam-nav-btn next" id="examNextBtn" onclick="examGoNext()">下一题</button>
      <button class="exam-submit-mini" onclick="confirmSubmitExam()">交卷</button>
    </div>
  `;
  examCurrentQ = 0;
  renderExamQuestion();
  renderExamQNav();
  updateExamNavBtns();
  startExamTimer();
}

let examCurrentQ = 0;

function formatMmSs(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function startExamTimer() {
  if (examTimerInterval) clearInterval(examTimerInterval);
  examTimerInterval = setInterval(() => {
    examRemaining--;
    const el = document.getElementById('examTimer');
    if (el) {
      el.textContent = formatMmSs(examRemaining);
      el.classList.toggle('danger', examRemaining < 300);
    }
    if (examRemaining <= 0) {
      autoSubmitExam('考试时间到，已自动提交');
    }
  }, 1000);
}

function renderExamQuestion() {
  const q = practiceQuestions[examCurrentQ];
  if (!q) return;

  let options = (q.options || []).map((o, i) => ({
    letter: o.key || o.label || String.fromCharCode(65 + i),
    text: o.value || o.text || ''
  }));
  if (q.type === 'judge' && options.length === 0) {
    options = [{ letter: 'A', text: '正确' }, { letter: 'B', text: '错误' }];
  }

  const isMulti = q.type === 'multiple';
  const currentAns = examAnswers[q.id] || (isMulti ? {} : '');
  const isConfirmed = isMulti && currentAns._confirmed;

  const optHtml = options.map((opt, oi) => {
    let cls = 'opt-btn';
    if (isMulti) {
      if (currentAns[opt.letter]) cls += ' selected';
    } else {
      if (currentAns === opt.letter) cls += ' selected';
    }
    return `<button class="${cls}" data-idx="${oi}" data-letter="${opt.letter}" onclick="selectExamOption(${q.id},'${opt.letter}')">${opt.letter}. ${escHtml(opt.text)}</button>`;
  }).join('');

  const typeMap = { single: ['单选', 'tag-blue'], multiple: ['多选', 'tag-purple'], judge: ['判断', 'tag-green'] };
  const [typeLabel, typeClass] = typeMap[q.type] || ['', ''];

  const multiConfirmHtml = isMulti && !isConfirmed
    ? '<div style="text-align:center;color:var(--warning);font-size:0.82rem;padding:6px 0">⚠ 请选择后点击底部"确认"按钮</div>'
    : (isMulti && isConfirmed ? '<div style="text-align:center;color:var(--success);font-size:0.85rem;font-weight:600;padding:6px 0">✓ 已确认选择</div>' : '');

  document.getElementById('examBody').innerHTML = `
    <div class="practice-card" style="margin:0">
      <span class="tag ${typeClass} q-type-tag">${typeLabel}</span>
      <div class="q-content">${escHtml(q.content)}</div>
      <div>${optHtml}</div>
      ${multiConfirmHtml}
    </div>
  `;

  // Update count
  const answered = Object.values(examAnswers).filter(a => {
    if (typeof a === 'string') return a !== '';
    return Object.entries(a).some(([k, v]) => k !== '_confirmed' && v);
  }).length;
  document.getElementById('examCount').textContent = `${answered}/${practiceQuestions.length}`;
  updateExamNavBtns();
}

function selectExamOption(qId, letter) {
  const q = practiceQuestions.find(x => x.id === qId);
  if (!q) return;

  if (q.type === 'multiple') {
    if (!examAnswers[qId]) examAnswers[qId] = {};
    examAnswers[qId][letter] = !examAnswers[qId][letter];
    // Reset confirmed status when changing selection
    if (examAnswers[qId]._confirmed) {
      delete examAnswers[qId]._confirmed;
    }
    // Local DOM update only - no full re-render
    const btn = document.querySelector(`#examBody .opt-btn[data-letter="${letter}"]`);
    if (btn) {
      if (examAnswers[qId][letter]) {
        btn.classList.add('selected');
      } else {
        btn.classList.remove('selected');
      }
    }
    // Update answered count and nav
    const answered = Object.values(examAnswers).filter(a => {
      if (typeof a === 'string') return a !== '';
      return Object.entries(a).some(([k, v]) => k !== '_confirmed' && v);
    }).length;
    document.getElementById('examCount').textContent = `${answered}/${practiceQuestions.length}`;
    renderExamQNav();
    updateExamNavBtns();
  } else {
    examAnswers[qId] = letter;
    // Reset confirmed status when changing selection
    delete examAnswers[qId + '_confirmed'];
    // Local DOM update: remove selected from all, add to clicked
    const btns = document.querySelectorAll('#examBody .opt-btn');
    btns.forEach(b => {
      b.classList.remove('selected');
      if (b.dataset.letter === letter) b.classList.add('selected');
    });
    // Update answered count and nav
    const answered = Object.values(examAnswers).filter(a => {
      if (typeof a === 'string') return a !== '';
      return Object.entries(a).some(([k, v]) => k !== '_confirmed' && v);
    }).length;
    document.getElementById('examCount').textContent = `${answered}/${practiceQuestions.length}`;
    renderExamQNav();
    updateExamNavBtns();
  }
}

function confirmExamMulti(qId) {
  const sel = examAnswers[qId] || {};
  const answer = Object.keys(sel).filter(k => sel[k] && k !== '_confirmed').sort().join(',');
  if (!answer) { showToast('请先选择答案', 'info'); return; }
  // Mark as confirmed so student can see it's done
  examAnswers[qId] = { _confirmed: true, ...sel };
  showToast('已确认选择', 'success');
  // Auto advance to next question
  if (examCurrentQ < practiceQuestions.length - 1) {
    examCurrentQ++;
  }
  renderExamQuestion();
  renderExamQNav();
  updateExamNavBtns();
}

function renderExamQNav() {
  const nav = document.getElementById('examQNav');
  if (!nav) return;
  nav.innerHTML = practiceQuestions.map((q, i) => {
    const ans = examAnswers[q.id];
    let hasAns = false;
    if (ans) {
      if (typeof ans === 'string') hasAns = ans !== '';
      else {
        // Object (multi-select): check for any selected option (ignore _confirmed flag)
        hasAns = Object.entries(ans).some(([k, v]) => k !== '_confirmed' && v);
      }
    }
    let cls = 'exam-q-num';
    if (i === examCurrentQ) cls += ' current';
    else if (hasAns) cls += ' answered';
    return `<button class="${cls}" onclick="examCurrentQ=${i};renderExamQuestion();renderExamQNav();updateExamNavBtns()">${i+1}</button>`;
  }).join('');

  // Update answered count in header
  const answered = Object.values(examAnswers).filter(a => {
    if (typeof a === 'string') return a !== '';
    return Object.entries(a).some(([k, v]) => k !== '_confirmed' && v);
  }).length;
  const countEl = document.getElementById('examNavAnswered');
  if (countEl) countEl.textContent = answered;
}

function toggleExamQNav() {
  const body = document.getElementById('examQNav');
  const icon = document.getElementById('examNavToggle');
  if (!body) return;
  body.classList.toggle('collapsed');
  icon?.classList.toggle('collapsed');
}

function examGoPrev() {
  if (examCurrentQ > 0) {
    examCurrentQ--;
    renderExamQuestion();
    renderExamQNav();
    updateExamNavBtns();
  }
}

function examGoNext() {
  if (examCurrentQ < practiceQuestions.length - 1) {
    examCurrentQ++;
    renderExamQuestion();
    renderExamQNav();
    updateExamNavBtns();
  }
}

function updateExamNavBtns() {
  const prevBtn = document.getElementById('examPrevBtn');
  const nextBtn = document.getElementById('examNextBtn');
  const confirmBtn = document.getElementById('examConfirmBtn');
  if (prevBtn) prevBtn.disabled = examCurrentQ === 0;
  if (nextBtn) nextBtn.disabled = examCurrentQ >= practiceQuestions.length - 1;

  // Update confirm button state
  const q = practiceQuestions[examCurrentQ];
  if (confirmBtn && q) {
    const isMulti = q.type === 'multiple';
    const ans = examAnswers[q.id];
    if (isMulti) {
      const isConfirmed = ans?._confirmed;
      const hasSelection = ans && Object.entries(ans).some(([k, v]) => k !== '_confirmed' && v);
      if (isConfirmed) {
        confirmBtn.textContent = '已确认';
        confirmBtn.disabled = true;
      } else if (!hasSelection) {
        confirmBtn.textContent = '确认';
        confirmBtn.disabled = true;
      } else {
        confirmBtn.textContent = '确认';
        confirmBtn.disabled = false;
      }
    } else {
      // Single/judge: check confirmed state
      const hasAnswer = typeof ans === 'string' && ans !== '';
      const isConfirmed = examAnswers[q.id + '_confirmed'];
      if (isConfirmed) {
        confirmBtn.textContent = '已确认';
        confirmBtn.disabled = true;
      } else if (hasAnswer) {
        confirmBtn.textContent = '确认';
        confirmBtn.disabled = false;
      } else {
        confirmBtn.textContent = '确认';
        confirmBtn.disabled = true;
      }
    }
  }
}

function examConfirmAndNext() {
  const q = practiceQuestions[examCurrentQ];
  if (!q) return;

  if (q.type === 'multiple') {
    const sel = examAnswers[q.id] || {};
    const answer = Object.keys(sel).filter(k => sel[k] && k !== '_confirmed').sort().join(',');
    if (!answer) { showToast('请先选择答案', 'info'); return; }
    if (sel._confirmed) return; // already confirmed
    examAnswers[q.id] = { _confirmed: true, ...sel };
  } else {
    // Single/judge: check answer exists
    const ans = examAnswers[q.id];
    if (!ans || (typeof ans === 'string' && !ans)) { showToast('请先选择答案', 'info'); return; }
    // Mark as confirmed for single/judge too
    examAnswers[q.id + '_confirmed'] = true;
  }

  // Update confirm button to show confirmed state
  const confirmBtn = document.getElementById('examConfirmBtn');
  if (confirmBtn) {
    confirmBtn.textContent = '已确认';
    confirmBtn.disabled = true;
  }

  // Auto go to next question, or submit if last
  if (examCurrentQ < practiceQuestions.length - 1) {
    setTimeout(() => {
      examCurrentQ++;
      renderExamQuestion();
      renderExamQNav();
      updateExamNavBtns();
    }, 400); // Brief delay so user sees "已确认"
  } else {
    // Last question confirmed - auto submit after brief feedback
    setTimeout(() => {
      confirmSubmitExam();
    }, 600);
  }
}

function confirmSubmitExam() {
  if (_examSubmitting) return;  // Prevent double-submit
  // Count unanswered questions
  const unanswered = practiceQuestions.filter(q => {
    const a = examAnswers[q.id];
    if (!a) return true;
    if (typeof a === 'string') return a === '';
    return !Object.entries(a).some(([k, v]) => k !== '_confirmed' && v);
  }).length;

  const msg = unanswered > 0
    ? `还有${unanswered}题未作答，确定交卷？交卷后无法修改答案。`
    : '确定交卷？交卷后无法修改答案。';
  showConfirm(msg, async () => {
    _examSubmitting = true;
    exitExamMode();
    try {
      await submitExamAnswers();
    } catch(e) {
      console.error('Exam submit failed:', e);
      showToast('提交失败，请检查网络后重试', 'error');
      _examSubmitting = false;
    }
  });
}

async function submitExamAnswers() {
  const records = [];
  let correct = 0;
  // For quick exam guests, use phone as student_id
  const studentId = currentExamIsQuick && quickExamGuest ? quickExamGuest.phone : currentUser.username;
  const guestName = currentExamIsQuick && quickExamGuest ? quickExamGuest.name : null;
  practiceQuestions.forEach(q => {
    let userAnswer = '';
    if (q.type === 'multiple') {
      const sel = examAnswers[q.id] || {};
      userAnswer = Object.keys(sel).filter(k => sel[k] && k !== '_confirmed').sort().join(',');
    } else {
      userAnswer = examAnswers[q.id] || '';
    }
    const isCorrect = checkAnswer(userAnswer, q.answer, q.type);
    if (isCorrect) correct++;
    const rec = {
      student_id: studentId,
      question_id: q.id,
      is_correct: isCorrect,
      user_answer: userAnswer,
      is_fav: false,
      exam_id: currentExamId
    };
    if (guestName) rec.guest_name = guestName;
    records.push(rec);
  });
  await dbInsert('records', records);
  // Award XP for completing exam (not for quick exam guests)
  if (!currentExamIsQuick && currentUser) {
    const examXp = currentExamIsMock ? XP_REWARDS.mock_exam : XP_REWARDS.real_exam;
    addXp(examXp, currentExamIsMock ? '完成模拟考试' : '完成考试');
    // Also add per-question XP
    const questionXp = correct * XP_REWARDS.correct + (practiceQuestions.length - correct) * XP_REWARDS.wrong;
    addXp(questionXp, '考试答题');
  }
  renderExamResult(correct, practiceQuestions.length);
}

function renderExamResult(correct, total) {
  const isMock = currentExamIsMock;
  const passRate = currentExamPassRate || 60;
  const pct = total > 0 ? Math.round(correct / total * 100) : 0;
  const isPassed = pct >= passRate;
  const color = isPassed ? '#10b981' : '#ef4444';
  const circumference = 2 * Math.PI * 60;
  const offset = circumference - (pct / 100) * circumference;

  // Build detail list for all questions
  const detailHtml = practiceQuestions.map((q, i) => {
    let userAnswer = '';
    if (q.type === 'multiple') {
      const sel = examAnswers[q.id] || {};
      userAnswer = Object.keys(sel).filter(k => sel[k] && k !== '_confirmed').sort().join(',');
    } else {
      userAnswer = examAnswers[q.id] || '';
    }
    const isCorrect = checkAnswer(userAnswer, q.answer, q.type);
    const typeMap = { single: ['单选', 'tag-blue'], multiple: ['多选', 'tag-purple'], judge: ['判断', 'tag-green'] };
    const [typeLabel, typeClass] = typeMap[q.type] || ['未知', 'tag-gray'];

let _filteredWrongQs = [];
async function renderWrongBook() {
  // Cache-only: no cloud access needed for wrong book
  let records = await dbSelect('records', { eq: { student_id: currentUser.username }, cacheOnly: true });
  if (!records) records = await dbSelect('records', { eq: { student_id: currentUser.username } });
  const wrongRecords = records.filter(r => !r.is_correct);
  const wrongQIds = [...new Set(wrongRecords.map(r => r.question_id))];
  let allQ = await dbSelect('questions', { order: ['id', false], cacheOnly: true });
  if (!allQ) allQ = await dbSelect('questions', { order: ['id', false] });
  // Filter by current level
  const levelQIds = new Set(allQ.filter(q => q.level === currentLevel).map(q => q.id));
  _filteredWrongQs = wrongQIds.filter(id => levelQIds.has(id)).map(id => {
    const q = allQ.find(x => x.id === id);
    const count = wrongRecords.filter(r => r.question_id === id).length;
    return q ? { ...q, wrongCount: count } : null;
  }).filter(Boolean);

  _pg.wrongBook = 1;
  _pageRenderers.wrongBook = renderWrongBookPage;
  renderWrongBookPage();
}
function renderWrongBookPage() {
  const wrongQs = _filteredWrongQs;
  const page = _pg.wrongBook;
  const pageItems = pageSlice(wrongQs, page);
  const list = pageItems.length ? pageItems.map(q => `
    <div class="wrong-item" onclick="practiceWrongQuestion(${q.id})">
      <span class="wrong-content">${escHtml((q.content||'').substring(0,50))}</span>
      <span class="wrong-count">${q.wrongCount}次</span>
    </div>
  `).join('') : '<div class="empty-state"><div class="empty-icon">🎉</div><p>错题本为空，继续保持！</p></div>';

  document.getElementById('studentContent').innerHTML = `
    ${wrongQs.length > 0 ? `<button class="btn btn-danger btn-full" style="margin-bottom:16px" onclick="clearWrongBook()">🗑️ 清空错题本</button>` : ''}
    ${list}
    ${paginateHtml('wrongBook', wrongQs.length, page)}
  `;
}

async function practiceWrongQuestion(qId) {
  const allQ = await dbSelect('questions', { order: ['id', false] });
  const q = allQ.find(x => x.id === qId);
  if (!q) return;
  practiceQuestions = [q];
  practiceIndex = 0;
  practiceAnswered = {};
  practiceMultiSelected = {};
  practiceMode = 'wrong';
  renderPracticeUI();
}

async function clearWrongBook() {
  showConfirm('确定清空错题本？考试中的错题记录将保留，仅清除练习中的错题。', async () => {
    // Only delete wrong records that are NOT from exams
    const records = await dbSelect('records', { eq: { student_id: currentUser.username, is_correct: false }, cacheBypass: true });
    const practiceWrongIds = records.filter(r => !r.exam_id).map(r => r.id);
    if (practiceWrongIds.length === 0) {
      showToast('错题本已为空', 'info');
      return;
    }
    // Delete all practice wrong records in one batch
    await dbDelete('records', { id: practiceWrongIds });
    cacheClearTable('records');    showToast(`已清除${practiceWrongIds.length}条练习错题`, 'success');
    showConfetti();
    renderWrongBook();
  });
}

  const favCount = records.filter(r => r.is_fav).length;
  const wrongCount = totalCount - correctCount;
  const pct = totalCount > 0 ? Math.round(correctCount / totalCount * 100) : 0;
  const expireDate = currentUser.expires_at ? new Date(currentUser.expires_at).toLocaleDateString('zh-CN') : '未设置';

        <div style="display:flex;align-items:center;gap:6px">

        </div>
        <span style="font-size:.8rem;color:var(--text3)">${xpInLevel} / ${xpNeeded} XP</span>
      </div>
      <div style="background:#e5e7eb;border-radius:99px;height:10px;overflow:hidden">
        <div style="background:linear-gradient(90deg,#f59e0b,#d97706);height:100%;border-radius:99px;width:${xpProgress}%;transition:width .6s ease"></div>

  document.querySelectorAll('.stat-value[data-target]').forEach(el => {

async function changePassword() {
  const oldPwd = document.getElementById('oldPwd').value.trim();
  const newPwd = document.getElementById('newPwd').value.trim();
  const confirmPwd = document.getElementById('confirmPwd').value.trim();
  if (!oldPwd || !newPwd || !confirmPwd) { showToast('请填写所有字段', 'error'); return; }
  // Verify old password via server
  const verifyRes = await fetch(`${API_BASE}/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Token': API_TOKEN },
    body: JSON.stringify({ table: 'students', username: currentUser.username, password: oldPwd })
  });
  const verifyData = await verifyRes.json();
  if (verifyData.error) { showToast('当前密码错误', 'error'); return; }
  if (newPwd.length < 6) { showToast('新密码至少6位', 'error'); return; }
  if (newPwd !== confirmPwd) { showToast('两次输入的新密码不一致', 'error'); return; }
  try {
    await dbUpdate('students', { password: newPwd }, { id: currentUser.id });
    currentUser.password = newPwd;
    saveLogin('student', currentUser);
    showToast('密码修改成功', 'success');
    document.getElementById('oldPwd').value = '';
    document.getElementById('newPwd').value = '';
    document.getElementById('confirmPwd').value = '';
  } catch(e) {
    showToast('密码修改失败', 'error');
  }
}

// ===== Initialize =====
async function init() {
  initTheme(); // Ensure theme is applied before any rendering
  // Check for quick exam URL: #quick=examId
  const quickMatch = location.hash.match(/^#quick=(\d+)$/);
  if (quickMatch) {
    const quickExamId = parseInt(quickMatch[1]);
    renderQuickExamGuest(quickExamId);
    return;
  }
  const session = checkSession();
  if (session) {
    userRole = session.role;
    currentUser = session.user;
    if (session.admin) currentAdmin = session.admin;
    if (userRole === 'student' && currentUser) {
      // Verify account is still active
      try {
        const students = await dbSelect('students', { eq: { id: currentUser.id } });
        if (students.length === 0 || students[0].status === 'disabled') {
          showToast('账号已被禁用，请联系管理员', 'error');
          clearLogin();
          userRole = null;
          currentUser = null;
          renderLogin();
          return;
        }
        if (students[0].status === 'expired' || (students[0].expires_at && new Date(students[0].expires_at) < new Date())) {
          showToast('账号已过期，请联系管理员续期', 'error');
          clearLogin();
          userRole = null;
          currentUser = null;
          renderLogin();
          return;
        }
        // Update current user data
        currentUser = students[0];
        if (!currentUser.study_level || currentUser.study_level < 1) {
          currentUser.study_level = levelFromXp(currentUser.xp || 0);
        }
      } catch(e) {}
    }
    if (userRole === 'admin') { renderAdmin(); startSessionCheck(); }
    else { renderStudent(); startSessionCheck(); }
  } else {
    renderLogin();
  }
}
