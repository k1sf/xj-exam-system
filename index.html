async function handleLogin() {
  const btn = document.getElementById('loginBtn');
  if (btn.disabled) return;
  const username = document.getElementById('loginUser').value.trim();
  const password = document.getElementById('loginPwd').value.trim();
  if (!username || !password) { showToast('请输入账号和密码', 'error'); return; }
  if (!isOnline && !navigator.onLine) { showToast('当前无网络连接，无法登录', 'error'); return; }
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    // Try admin login via /api/login (verifies hashed password server-side)
    const adminRes = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Token': API_TOKEN },
      body: JSON.stringify({ table: 'admins', username, password })
    });
    const adminData = await adminRes.json();
    // 只有密码错误才停止，账号不存在继续尝试学生登录
    if (adminData.error === 'Wrong password') {
      showToast('密码错误', 'error'); btn.disabled = false; btn.textContent = '登 录'; return;
    }
    // 管理员登录成功
    if (adminData.username) {
      userRole = 'admin';
      currentAdmin = adminData;
      currentUser = null;
      saveLogin('admin', null, adminData);
      if (adminData.session_id) localStorage.setItem('xjSessionId', adminData.session_id);
      // 清除所有缓存，确保数据一致性
      cacheClear();
      // 登录成功，直接进入系统（session刚设置，无需自我验证）
      startSessionCheck();
      renderAdmin();
      preloadData('admin');
      // Show help on first login
      if (localStorage.getItem('xjHideHelp_admin') !== '1') showHelp('admin');
      return;
    }
    // Student login - phone number validation
    if (!/^1[3-9]\d{9}$/.test(username)) {
      showToast('请输入正确的11位手机号', 'error'); btn.disabled = false; btn.textContent = '登 录'; return;
    }
    const studentRes = await fetch(`${API_BASE}/login`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Token': API_TOKEN },
      body: JSON.stringify({ table: 'students', username, password })
    });
    const studentData = await studentRes.json();
    if (studentData.error) {
      if (studentData.error === 'User not found') {
        showToast('该手机号未注册，请联系管理员', 'error');
      } else if (studentData.error === 'Wrong password') {
        showToast('密码错误', 'error');
      } else {
        showToast(studentData.error, 'error');
      }
      btn.disabled = false; btn.textContent = '登 录'; return;
    }
    const student = studentData;
    // Check account status
    if (student.status === 'disabled') {
      showToast('该账号已被禁用，请联系管理员', 'error'); btn.disabled = false; btn.textContent = '登 录'; return;
    }
    if (student.status === 'expired' || (student.expires_at && new Date(student.expires_at) < new Date())) {
      if (student.status !== 'expired') {
        try { await dbUpdate('students', { status: 'expired' }, { id: student.id }); } catch(e) { console.warn('Status update failed:', e); }
      }
      showToast('账号已过期，请联系管理员续期', 'error'); btn.disabled = false; btn.textContent = '登 录'; return;
    }
    userRole = 'student';
    currentUser = student;
    currentLevel = student.level || '初级';
    currentUser.level = currentLevel;
    if (!currentUser.study_level || currentUser.study_level < 1) {
      currentUser.study_level = levelFromXp(currentUser.xp || 0);
    }
    // 保存session_id并清除缓存
    const sessionId = student.session_id;
    if (sessionId) localStorage.setItem('xjSessionId', sessionId);
    // 清除所有缓存，确保获取最新数据
    cacheClear();
    // 登录成功，直接进入系统（session刚设置，无需自我验证）
    saveLogin('student', student, null);
    startSessionCheck();
    renderStudent();
    // Preload student data in background (questions, records, exams)
    preloadData('student');
    // Show help on first login
    if (localStorage.getItem('xjHideHelp_student') !== '1') showHelp('student');
  } catch(e) {
    showToast('登录失败，请重试', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '登 录';
  }
}

async function createStudents() {
  if (!requireAdmin()) return;
  const btn = document.getElementById('createStudentBtn');
  if (btn.disabled) return;
  const cohort = document.getElementById('studentCohort').value.trim();
  const level = document.getElementById('studentLevel').value;
  const namesStr = document.getElementById('studentNames').value.trim();
  if (!cohort || !namesStr) { showToast('请填写班级名称和学生信息', 'error'); return; }
  btn.disabled = true; btn.textContent = '处理中...';
  try {
    const lines = namesStr.split(/\n/).map(n => n.trim()).filter(Boolean);
    // 使用 cacheBypass 确保获取最新的已存在账号列表
    const existing = await dbSelect('students', { select: ['username'], cacheBypass: true });
    const existingPhones = new Set(existing.map(s => s.username));
    const rows = [];
    const failed = [];
    for (const line of lines) {
      const parts = line.split(/[\s,，]+/).filter(Boolean);
      if (parts.length < 2) { failed.push(`${line}（格式错误，需要"昵称 手机号"）`); continue; }
      // Find the 11-digit phone number
      const phonePart = parts.find(p => /^1[3-9]\d{9}$/.test(p));
      if (!phonePart) { failed.push(`${line}（未找到有效手机号）`); continue; }
      const nickname = parts.filter(p => p !== phonePart).join('') || phonePart;
      if (existingPhones.has(phonePart)) { failed.push(`${nickname}（${phonePart}已存在）`); continue; }
      existingPhones.add(phonePart);
      rows.push({
        username: phonePart,
        password: '123456',
        nickname,
        cohort,
        level,
        status: 'active',
        can_change_level: false,
        expires_at: new Date(Date.now() + 365 * 24 * 3600 * 1000).toISOString()
      });
    }
    if (rows.length === 0) {

function togglePwd(btn) {
  const span = btn.closest('.pwd-cell, .student-meta, .copy-result')?.querySelector('.pwd-mask') || btn.previousElementSibling;
  if (!span || !span.classList?.contains('pwd-mask')) return;
  if (span.textContent === '••••••') {
    span.textContent = span.dataset.pwd;
    btn.textContent = '🙈';
  } else {
    span.textContent = '••••••';
    btn.textContent = '👁️';
  }
}

// ===== 通用复制函数 =====
function copyText(text) {
  // 尝试 navigator.clipboard（现代浏览器）
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(text).then(() => {
      showToast('已复制到剪贴板', 'success');
    }).catch(() => {
      // 降级方案：使用 textarea + execCommand
      fallbackCopy(text);
    });
  } else {
    fallbackCopy(text);
  }
}

function fallbackCopy(text) {
  try {
    const textarea = document.createElement('textarea');
    textarea.value = text;
    textarea.style.position = 'fixed';
    textarea.style.opacity = '0';
    document.body.appendChild(textarea);
    textarea.select();
    document.execCommand('copy');
    document.body.removeChild(textarea);
    showToast('已复制到剪贴板', 'success');
  } catch (e) {
    showToast('复制失败，请手动复制', 'error');
    console.error('Copy failed:', e);
  }
}

function copyAllAccounts() {

let _filteredStudents = [];
function filterStudents() {
  const cohortEl = document.getElementById('studentCohortFilter');
  const cohort = cohortEl ? cohortEl.value : '';

  const search = searchEl ? searchEl.value.trim().toLowerCase() : '';
  let filtered = allStudents;
  // 使用包含匹配，支持搜索合并期次中的任意一个
  if (cohort) filtered = filtered.filter(s => (s.cohort || '').split(',').map(c => c.trim()).includes(cohort));
  if (search) filtered = filtered.filter(s => (s.nickname||'').toLowerCase().includes(search) || (s.username||'').includes(search));

async function batchRenewStudents() {
  if (!requireAdmin()) return;
  const students = _filteredStudents.filter(s => s.status !== 'disabled');
  if (students.length === 0) return showToast('当前筛选无可用学生', 'error');
  showConfirm(`确定为当前筛选的 ${students.length} 名学生续期一年？`, async () => {
    try {
      const newExp = new Date(Date.now() + 365*24*60*60*1000).toISOString();
      // 使用批量更新
      const batch = students.map(s => ({
        data: { expires_at: newExp, status: 'active' },
        match: { id: s.id }
      }));
      
      const result = await dbBatchUpdate('students', batch);
      
      showToast(`已为 ${result.successCount || students.length} 名学生续期`, 'success');
      allStudents = await dbSelect('students', { cacheBypass: true });
      filterStudents();
    } catch(e) { showToast('批量续期失败', 'error'); }
  });

async function doEditStudent(username) {
  const nickname = document.getElementById('editNickname').value.trim();

  const can_change_level = document.getElementById('editCanChangeLevel').checked;

  try {
    await dbUpdate('students', { nickname, cohort, level, can_change_level }, { username });
    cacheClearTable('students');

    <div id="questionListContainer">${qList}</div>

async function goQuestionPage(page) {
  questionPage = page;
  if (_searchMode) {
    const totalCount = _searchResults.length;
    const totalPages = Math.max(1, Math.ceil(totalCount / PER_PAGE));
    const pageItems = _searchResults.slice((page - 1) * PER_PAGE, page * PER_PAGE);
    renderQuestionUI(pageItems, totalPages, totalCount);
  } else {
    const totalCount = await dbCount('questions');
    const totalPages = Math.max(1, Math.ceil(totalCount / PER_PAGE));
    // 按ID升序排列，保持导入顺序
    allQuestions = await dbSelect('questions', { order: ['id', true], limit: PER_PAGE, offset: (page - 1) * PER_PAGE });
    renderQuestionUI(allQuestions, totalPages, totalCount);
  }
}

let _searchMode = false, _searchResults = [];
async function searchQuestions() {
  questionPage = 1;
  const type = document.getElementById('filterType').value;
  const level = document.getElementById('filterLevel').value;
  const cohort = document.getElementById('filterCohort').value;
  const keyword = document.getElementById('filterKeyword').value.trim();
  const filter = {};

  if (level) filter.level = level;
  if (cohort) filter.cohort = cohort;
  _searchResults = await dbSelect('questions', { eq: filter, order: ['id', true] });

  const totalCount = _searchResults.length;
  const pageItems = _searchResults.slice(0, PER_PAGE);
  const totalPages = Math.max(1, Math.ceil(totalCount / PER_PAGE));
  renderQuestionUI(pageItems, totalPages, totalCount);
}

function selectQType(type, btn) {
  document.querySelectorAll('.type-btn').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  const optArea = document.getElementById('qOptionList');
  const optContainer = document.getElementById('qOptionsArea');
  if (type === 'judge') {
    optArea.innerHTML = '<div style="color:var(--text2);font-size:0.85rem">判断题自动生成：A.正确 / B.错误</div>';
    const addBtn = optContainer.querySelector('.btn-outline');
    if (addBtn) addBtn.style.display = 'none';
    document.getElementById('qAnswer').placeholder = 'A或B';
  } else {
    optArea.innerHTML = '';
    const letters = ['A','B','C','D'];
    letters.forEach(l => {
      optArea.innerHTML += `<div class="option-row"><span class="option-letter">${l}</span><input class="input opt-input" data-letter="${l}" placeholder="选项${l}的内容" style="flex:1"></div>`;
    });
    const addBtn = optContainer.querySelector('.btn-outline');
    if (addBtn) addBtn.style.display = '';
    document.getElementById('qAnswer').placeholder = type === 'multiple' ? '如A,C,D' : '如A';
  }
}

function addOptionRow() {
  const list = document.getElementById('qOptionList');
  const count = list.querySelectorAll('.option-row').length;
  if (count >= 8) { showToast('最多8个选项', 'info'); return; }
  const letter = String.fromCharCode(65 + count);
  const div = document.createElement('div');
  div.className = 'option-row';
  div.innerHTML = `<span class="option-letter">${letter}</span><input class="input opt-input" data-letter="${letter}" placeholder="选项${letter}的内容" style="flex:1"><button class="btn btn-sm btn-ghost" onclick="this.parentElement.remove()" style="color:var(--error)">✕</button>`;
  list.appendChild(div);
}

async function saveQuestion() {
  if (!requireAdmin()) return;
  const btn = document.getElementById('saveQuestionBtn');
  if (btn.disabled) return;
  const type = document.querySelector('.type-btn.active')?.dataset.qtype || 'single';
  const content = document.getElementById('qContent').value.trim();
  const answer = document.getElementById('qAnswer').value.trim().toUpperCase();
  const analysis = document.getElementById('qAnalysis').value.trim();
  const tagsStr = document.getElementById('qTags').value.trim();
  const cohort = document.getElementById('qCohort').value || null;
  const level = document.getElementById('qLevel').value || '初级';
  const tags = tagsStr ? tagsStr.split(/[,，]/).map(t => t.trim()).filter(Boolean) : [];

  if (!content) { showToast('请输入题干', 'error'); return; }
  if (!answer) { showToast('请输入正确答案', 'error'); return; }

  let options = [];
  if (type === 'judge') {
    options = [{ key: 'A', value: '正确' }, { key: 'B', value: '错误' }];
  } else {
    document.querySelectorAll('.opt-input').forEach(inp => {
      const text = inp.value.trim();
      if (text) options.push({ key: inp.dataset.letter, value: text });
    });
  }

  btn.disabled = true; btn.textContent = '处理中...';
  try {
    if (editingQuestionId) {
      await dbUpdate('questions', { type, content, options: JSON.stringify(options), answer, analysis, tags, cohort, level }, { id: editingQuestionId });
      showToast('题目已更新', 'success');
    } else {
      await dbInsert('questions', [{ type, content, options: JSON.stringify(options), answer, analysis, tags, cohort, level }]);
      showToast('题目已添加', 'success');
    }
    closeModal();
    renderAdminQuestions();
  } catch(e) { showToast('保存失败', 'error'); }
  finally { btn.disabled = false; btn.textContent = '保存'; }
}

function previewBatchImport() {
  const text = document.getElementById('batchImportText').value.trim();
  if (!text) { showToast('请输入导入数据', 'error'); return; }
  const importLevel = document.getElementById('batchImportLevel').value || '初级';
  const lines = text.split('\n').filter(l => l.trim());
  const rows = []; const errorLines = [];
  const typeNames = { single: '单选', multiple: '多选', judge: '判断' };
  lines.forEach((line, i) => {
    const parts = line.split('|').map(s => s.trim());
    if (parts.length < 7) { errorLines.push(`第${i+1}行：字段不足`); return; }
    const [type, content, optA, optB, optC, optD, answer, analysis, tagsStr] = parts;
    if (!['single','multiple','judge'].includes(type)) { errorLines.push(`第${i+1}行：题型错误`); return; }
    let options = [];
    if (type === 'judge') {
      options = [{ key: 'A', value: '正确' }, { key: 'B', value: '错误' }];
    } else {
      if (optA) options.push({ key: 'A', value: optA });
      if (optB) options.push({ key: 'B', value: optB });
      if (optC) options.push({ key: 'C', value: optC });
      if (optD) options.push({ key: 'D', value: optD });
    }
    const tags = tagsStr ? tagsStr.split(/[,\uff0c]/).map(t => t.trim()).filter(Boolean) : [];
    rows.push({ type, content, options: JSON.stringify(options), answer: answer.toUpperCase(), analysis: analysis || '', tags, level: importLevel });
  });
  let html = `<div style="font-size:0.85rem;margin-bottom:8px;color:var(--text2)">解析结果：<strong style="color:var(--success)">${rows.length}</strong> 题有效${errorLines.length > 0 ? `，<strong style="color:var(--danger)">${errorLines.length}</strong> 行错误` : ''}</div>`;
  if (errorLines.length > 0) {
    html += `<div style="background:#fef2f2;border-radius:var(--radius-s);padding:8px 12px;margin-bottom:8px;font-size:0.8rem;color:#dc2626">错误：${errorLines.join('、')}</div>`;
  }
  if (rows.length > 0) {
    html += '<div style="max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:var(--radius-s);padding:8px">';
    rows.forEach((r, i) => {
      html += `<div style="padding:6px 0;${i > 0 ? 'border-top:1px solid var(--border)' : ''}"><span style="color:var(--primary);font-weight:600">${i+1}.</span> <span style="color:var(--text2);font-size:0.78rem">[${typeNames[r.type]||r.type}]</span> ${escHtml(r.content.substring(0,60))}${r.content.length > 60 ? '...' : ''} <span style="color:var(--success);font-size:0.78rem">→ ${r.answer}</span></div>`;
    });
    html += '</div>';
    html += `<button class="btn btn-primary btn-full" style="margin-top:12px" id="confirmImportBtn" onclick="doBatchImportConfirm()">确认导入 ${rows.length} 题</button>`;
  }
  document.getElementById('batchImportResult').innerHTML = html;
  window._batchImportRows = rows;
  const importCohort = document.getElementById('batchImportCohort').value.trim() || null;
  window._batchImportRows.forEach(r => r.cohort = importCohort);
}

async function doBatchImportConfirm() {
  if (!requireAdmin()) return;
  const btn = document.getElementById('confirmImportBtn');
  if (btn.disabled) return;
  btn.disabled = true; btn.textContent = '导入中...';
  try {
    const rows = window._batchImportRows;
    if (!rows || rows.length === 0) { showToast('没有可导入数据', 'error'); return; }
    
    // 获取当前最大sort_order，确保新题目按顺序排列
    const existing = await dbSelect('questions', { select: 'id', cacheBypass: true });
    const maxOrder = existing.length > 0 ? Math.max(...existing.map(q => q.id || 0)) : 0;
    
    // 为新题目分配sort_order（从最大ID+1开始）
    rows.forEach((r, i) => {
      r.sort_order = maxOrder + i + 1;
    });
    
    await dbInsert('questions', rows);
    showToast(`成功导入${rows.length}题`, 'success');
    closeModal();
    cacheClearTable('questions');
    renderAdminQuestions();
  } catch(e) { showToast('导入失败', 'error'); console.error(e); }
  finally { if (btn) { btn.disabled = false; btn.textContent = '导入'; } }
}

async function deleteQuestion(qId) {
  if (!requireAdmin()) return;
  showConfirm('确定删除该题目？相关答题记录也会被删除，引用该题的考试也会自动移除该题。', async () => {
    try {
      await dbDelete('records', { question_id: qId });
      // Remove question from any exams that reference it
      const exams = await dbSelect('exams');
      for (const exam of exams) {
        const qids = exam.question_ids || [];
        if (qids.includes(qId)) {
          const newQids = qids.filter(id => id !== qId);
          await dbUpdate('exams', { question_ids: newQids }, { id: exam.id });
        }
      }
      await dbDelete('questions', { id: qId });
      cacheClearTable('questions');
      cacheClearTable('records');
      cacheClearTable('exams');
      showToast('已删除', 'success');
      renderAdminQuestions();
    } catch(e) {
      showToast('删除失败', 'error');
    }
  });
}

async function createExam() {
  if (!requireAdmin()) return;
  const btn = document.getElementById('createExamBtn');
  if (btn.disabled) return;
  const title = document.getElementById('examTitle').value.trim();
  const level = document.getElementById('examLevel').value;
  const cohort = document.getElementById('examCohort').value;
  const duration = parseInt(document.getElementById('examDuration').value);
  const startTime = document.getElementById('examStart').value;
  const endTime = document.getElementById('examEnd').value;
  if (!title || !duration || !startTime || !endTime) { showToast('请填写完整信息', 'error'); return; }

  // Filter questions by selected level
  const levelQuestions = allQuestions.filter(q => q.level === level);

  let questionIds = [];
  if (examPickMode === 'manual') {
    document.querySelectorAll('.exam-pick-q:checked').forEach(cb => questionIds.push(parseInt(cb.value)));
  } else {
    const count = parseInt(document.getElementById('smartCount')?.value) || 0;
    const type = document.getElementById('smartType')?.value;
    if (!count) { showToast('请输入抽题数量', 'error'); return; }
    let pool = type ? levelQuestions.filter(q => q.type === type) : [...levelQuestions];
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    questionIds = pool.slice(0, count).map(q => q.id);
  }
  if (!questionIds.length) { showToast('请选择至少1道题目', 'error'); return; }

  btn.disabled = true; btn.textContent = '处理中...';
  try {
    await dbInsert('exams', [{ title, level, cohort, question_ids: questionIds, duration, start_time: startTime.replace('T',' '), end_time: endTime.replace('T',' ') }]);
    showToast('考试已创建', 'success');
    closeModal();
    renderAdminExams();
  } catch(e) { showToast('创建失败', 'error'); }
  finally { btn.disabled = false; btn.textContent = '创建考试'; }
}

async function viewExamScores(examId) {
  const exam = allExams.find(e => e.id == examId);
  const examIdNum = Number(examId);
  // 使用 cacheBypass 确保获取最新成绩数据
  const records = await dbSelect('records', { eq: { exam_id: examIdNum }, cacheBypass: true });
  const students = await dbSelect('students', { cacheBypass: true });

  if (!records.length) {
    openModal('📊 考试成绩 - ' + escHtml(exam?.title || ''), '<div style="text-align:center;padding:30px;color:var(--text2)"><div>暂无成绩数据</div><div style="margin-top:8px;font-size:0.8rem;color:var(--text2)">提示：请确认学生已完成考试并交卷</div></div>');
    return;
  }

  const scoreMap = {};
  records.forEach(r => {
    if (!scoreMap[r.student_id]) scoreMap[r.student_id] = { correct: 0, total: 0 };
    scoreMap[r.student_id].total++;
    if (r.is_correct) scoreMap[r.student_id].correct++;
  });

  const studentIds = Object.keys(scoreMap);
  // Build guest_name map for quick exam
  const guestNameMap = {};
  records.forEach(r => { if (r.guest_name && r.student_id) guestNameMap[r.student_id] = r.guest_name; });
  const rows = studentIds.map(sid => {
    const s = scoreMap[sid] || { correct: 0, total: 0 };
    const student = students.find(st => st.username === sid);
    const displayName = student?.nickname || guestNameMap[sid] || sid;
    const pct = s.total > 0 ? Math.round(s.correct / s.total * 100) : 0;
    return `<tr>
      <td style="padding:8px;border-bottom:1px solid var(--border)">${escHtml(displayName)}</td>
      <td style="padding:8px;border-bottom:1px solid var(--border)">${s.correct}/${s.total}</td>
      <td style="padding:8px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="rank-bar" style="flex:1"><div class="rank-bar-fill" style="width:${pct}%;background:${gradientColor(pct)}"></div></div>
          <span style="font-weight:600;font-size:0.85rem">${pct}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  openModal('📊 考试成绩 - ' + escHtml(exam.title), `
    <div style="margin-bottom:12px;text-align:center;font-size:0.9rem;color:var(--text2)">共${studentIds.length}人参加</div>
    <table style="width:100%;border-collapse:collapse;font-size:0.88rem">
      <thead><tr><th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">学生</th><th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">正确/总数</th><th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">正确率</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="3" style="text-align:center;padding:20px;color:var(--text2)">暂无成绩数据</td></tr>'}</tbody>
    </table>
    <button class="btn btn-outline btn-full" style="margin-top:16px" onclick="exportExamCSV(${examId})">📥 导出CSV</button>
  `);
}

function exportExamCSV(examId) {
  const exam = allExams.find(e => e.id == examId);
  if (!exam) return;
  showToast('正在生成...', 'info');
  setTimeout(async () => {
    const rows = [['学生','用户名','正确数','总题数','正确率']];
    const recs = await dbSelect('records', { eq: { exam_id: Number(examId) } });
    const students = await dbSelect('students');
    const scoreMap = {};
    recs.forEach(r => {
      if (!scoreMap[r.student_id]) scoreMap[r.student_id] = { correct: 0, total: 0 };
      scoreMap[r.student_id].total++;
      if (r.is_correct) scoreMap[r.student_id].correct++;
    });
    Object.entries(scoreMap).forEach(([sid, s]) => {
      const st = students.find(x => x.username === sid);
      const pct = s.total > 0 ? Math.round(s.correct/s.total*100) : 0;
      rows.push([st?.nickname||sid, '\t'+sid, s.correct, s.total, pct+'%']);
    });
    const csv = rows.map(r => r.join(',')).join('\n');
    downloadCSV(csv, `${exam.title}_成绩.csv`);
    showToast('导出成功', 'success');
  }, 100);
}

  let questionIds = [];
  if (qePickMode === 'manual') {
    document.querySelectorAll('.qe-pick-q:checked').forEach(cb => questionIds.push(parseInt(cb.value)));
  } else {
    const count = parseInt(document.getElementById('qeSmartCount')?.value) || 0;
    const type = document.getElementById('qeSmartType')?.value;
    if (!count) { showToast('请输入抽题数量', 'error'); return; }
    let pool = type ? levelQuestions.filter(q => q.type === type) : [...levelQuestions];
    for (let i = pool.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [pool[i], pool[j]] = [pool[j], pool[i]]; }
    questionIds = pool.slice(0, count).map(q => q.id);
  }
  if (!questionIds.length) { showToast('请选择至少1道题目', 'error'); return; }

  // Use admin-configured start/end time
  const fmtDT = v => { const d=new Date(v); const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), dd=String(d.getDate()).padStart(2,'0'), h=String(d.getHours()).padStart(2,'0'), mi=String(d.getMinutes()).padStart(2,'0'), s=String(d.getSeconds()).padStart(2,'0'); return `${y}-${m}-${dd} ${h}:${mi}:${s}`; };

  btn.disabled = true; btn.textContent = '处理中...';
  try {
    await dbInsert('exams', [{
      title, level, cohort: '',
      question_ids: questionIds, duration,
      start_time: fmtDT(startTimeVal), end_time: fmtDT(endTimeVal),
      is_quick: true, pass_rate: passRate
    }]);
    showToast('快捷考试已创建', 'success');
    closeModal();
    renderQuickExam();
  } catch(e) { showToast('创建失败', 'error'); }
  finally { btn.disabled = false; btn.textContent = '创建快捷考试'; }
}

async function viewQuickExamScores(examId) {
  const exam = allExams.find(e => e.id == examId);
  const examIdNum = Number(examId);
  // 使用 cacheBypass 确保获取最新成绩数据
  const records = await dbSelect('records', { eq: { exam_id: examIdNum }, cacheBypass: true });

  if (!records.length) {
    openModal('📊 快捷考试成绩 - ' + escHtml(exam?.title || ''), '<div style="text-align:center;padding:30px;color:var(--text2)"><div>暂无成绩数据</div><div style="margin-top:8px;font-size:0.8rem;color:var(--text2)">等待考生扫码参加考试</div></div>');
    return;
  }

  // Group by student_id (phone number for quick exam guests)
  const scoreMap = {};
  records.forEach(r => {
    const key = r.student_id;
    if (!scoreMap[key]) scoreMap[key] = { correct: 0, total: 0, guestName: r.guest_name || '', phone: r.student_id };
    scoreMap[key].total++;
    if (r.is_correct) scoreMap[key].correct++;
  });

  // Sort by score descending
  const sorted = Object.values(scoreMap).sort((a, b) => {
    const pctA = a.total > 0 ? a.correct / a.total : 0;
    const pctB = b.total > 0 ? b.correct / b.total : 0;
    return pctB - pctA;
  });

  const passRate = exam?.pass_rate || 60;
  const rows = sorted.map((s, idx) => {
    const pct = s.total > 0 ? Math.round(s.correct / s.total * 100) : 0;
    const passed = pct >= passRate;
    const displayName = s.guestName || s.phone;
    return `<tr>
      <td style="padding:8px;border-bottom:1px solid var(--border);text-align:center;font-weight:600;${idx<3?'color:var(--primary)':''}">${idx + 1}</td>
      <td style="padding:8px;border-bottom:1px solid var(--border)">${escHtml(displayName)}<br><span style="font-size:0.75rem;color:var(--text2)">${escHtml(s.phone)}</span></td>
      <td style="padding:8px;border-bottom:1px solid var(--border)">${s.correct}/${s.total}</td>
      <td style="padding:8px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:8px">
          <div class="rank-bar" style="flex:1"><div class="rank-bar-fill" style="width:${pct}%;background:${gradientColor(pct)}"></div></div>
          <span style="font-weight:600;font-size:0.85rem;color:${passed?'var(--success)':'var(--error)'}">${pct}%</span>
        </div>
      </td>
      <td style="padding:8px;border-bottom:1px solid var(--border);text-align:center">${passed ? '<span style="color:var(--success)">✓ 通过</span>' : '<span style="color:var(--error)">✗ 未通过</span>'}</td>
    </tr>`;
  }).join('');

  const totalParticipants = sorted.length;
  const passedCount = sorted.filter(s => { const pct = s.total > 0 ? Math.round(s.correct / s.total * 100) : 0; return pct >= passRate; }).length;

  openModal('📊 快捷考试成绩 - ' + escHtml(exam.title), `
    <div style="margin-bottom:12px;text-align:center;font-size:0.9rem;color:var(--text2)">共${totalParticipants}人参加，${passedCount}人通过（及格线${passRate}%）</div>
    <table style="width:100%;border-collapse:collapse;font-size:0.82rem">
      <thead><tr>
        <th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">排名</th>
        <th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">姓名/手机</th>
        <th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">正确/总数</th>
        <th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">正确率</th>
        <th style="padding:8px;text-align:left;border-bottom:2px solid var(--border)">结果</th>
      </tr></thead>
      <tbody>${rows || '<tr><td colspan="5" style="text-align:center;padding:20px;color:var(--text2)">暂无成绩数据</td></tr>'}</tbody>
    </table>
    <button class="btn btn-outline btn-full" style="margin-top:16px" onclick="exportQuickExamCSV(${examId})">📥 导出CSV</button>
  `);
}

function exportQuickExamCSV(examId) {
  const exam = allExams.find(e => e.id == examId);
  if (!exam) return;
  showToast('正在生成...', 'info');
  setTimeout(async () => {
    const examIdNum = Number(examId);
    const recs = await dbSelect('records', { eq: { exam_id: examIdNum } });
    const scoreMap = {};
    recs.forEach(r => {
      const key = r.student_id;
      if (!scoreMap[key]) scoreMap[key] = { correct: 0, total: 0, guestName: r.guest_name || '', phone: r.student_id };
      scoreMap[key].total++;
      if (r.is_correct) scoreMap[key].correct++;
    });
    const sorted = Object.values(scoreMap).sort((a, b) => {
      const pctA = a.total > 0 ? a.correct / a.total : 0;
      const pctB = b.total > 0 ? b.correct / b.total : 0;
      return pctB - pctA;
    });
    const rows = [['排名','姓名','手机号','正确数','总题数','正确率','是否通过']];
    const passRate = exam.pass_rate || 60;
    sorted.forEach((s, idx) => {
      const pct = s.total > 0 ? Math.round(s.correct / s.total * 100) : 0;
      rows.push([idx+1, s.guestName||'', '\t'+s.phone, s.correct, s.total, pct+'%', pct>=passRate?'通过':'未通过']);
    });
    const csv = rows.map(r => r.join(',')).join('\n');
    downloadCSV(csv, `${exam.title}_成绩.csv`);
  }, 100);
}

async function createEnrollment() {
  const title = document.getElementById('enrollTitle').value.trim();
  const levelInputs = document.querySelectorAll('input[name="enroll_level"]:checked');
  const levels = Array.from(levelInputs).map(i => i.value);
  const cohort = document.getElementById('enrollCohort').value.trim();
  const startTime = document.getElementById('enrollStartTime').value;
  const endTime = document.getElementById('enrollEndTime').value;
  const autoSync = document.getElementById('enrollAutoSync').checked;
  
  if (!title) { showToast('请输入报名标题', 'error'); return; }
  if (!levels.length) { showToast('请选择至少一个级别', 'error'); return; }
  if (!cohort) { showToast('请输入班级/期次', 'error'); return; }
  if (!endTime) { showToast('请设置报名截止时间', 'error'); return; }
  
  try {
    const response = await fetch('/api/enroll-config/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Token': API_TOKEN },
      body: JSON.stringify({ title, levels, cohort, start_time: startTime || null, end_time: endTime, auto_sync: autoSync, created_by: currentAdmin?.id })
    });
    const result = await response.json();
    if (result.error) { showToast(result.error, 'error'); return; }
    showToast('创建成功', 'success');
    closeEnrollmentModal();
    renderAdminEnrollment();
  } catch(e) {
    showToast('创建失败：' + e.message, 'error');
  }
}

              <td style="padding:8px;text-align:center">
                <input type="checkbox" value="${e.id}" ${checked} ${disabled} onchange="toggleEnrollmentSelection(${e.id}, this.checked)">
              </td>
              <td style="padding:8px">${escHtml(e.name)}</td>
              <td style="padding:8px">${escHtml(e.phone)}</td>
              <td style="padding:8px">${LEVEL_ICONS[e.level]||''}${escHtml(e.level)}</td>
              <td style="padding:8px">${escHtml(e.cohort || '-')}</td>
              <td style="padding:8px">${fmtLocalShort(e.created_at)}</td>
              <td style="padding:8px">${statusBadge}</td>
            </tr>
          `;
        }).join('')}
      </tbody>
    </table>
    <div style="padding:8px;font-size:0.8rem;color:var(--text2)">
      已选 ${pendingSelected}/${allPending} 名待审核学生 <button class="admin-btn" style="padding:4px 8px;font-size:0.8rem" onclick="importSelectedEnrollments()">📥 导入选中</button>
    </div>
  `;
}

function toggleEnrollmentSelection(id, checked) {
  if (checked) _selectedEnrollments.add(id);
  else _selectedEnrollments.delete(id);
}

function toggleAllEnrollments(checked) {
  const filtered = getFilteredEnrollments();
  if (checked) {
    filtered.forEach(e => { if (e.status === 'pending') _selectedEnrollments.add(e.id); });
  } else {
    filtered.forEach(e => { if (e.status === 'pending') _selectedEnrollments.delete(e.id); });
  }
  // 重新渲染表格
  const tbody = document.querySelector('#adminContent table tbody');
  if (tbody) {
    renderEnrollmentTableBody();
  }
}

function renderEnrollmentTableBody() {
  const filtered = getFilteredEnrollments();
  const tbody = document.querySelector('#adminContent table tbody');
  if (tbody) {
    const allPending = filtered.filter(e => e.status === 'pending');
    const pendingSelected = allPending.filter(e => _selectedEnrollments.has(e.id));
    const allSelected = pendingSelected.length === allPending.length && allPending.length > 0;
    
    // 更新全选checkbox
    const headerCheckbox = document.querySelector('#adminContent thead input[type="checkbox"]');
    if (headerCheckbox) headerCheckbox.checked = allSelected;
    
    tbody.innerHTML = filtered.map(e => {
      const statusBadge = e.status === 'approved' 
        ? '<span style="background:#28a745;color:#fff;padding:2px 6px;border-radius:4px;font-size:0.7rem">已导入</span>'
        : '<span style="background:#ffc107;color:#000;padding:2px 6px;border-radius:4px;font-size:0.7rem">待审核</span>';
      const disabled = e.status === 'approved' ? 'disabled style="opacity:0.5"' : '';
      const checked = _selectedEnrollments.has(e.id) ? 'checked' : '';
      return `
        <tr style="border-bottom:1px solid var(--border)">
          <td style="padding:8px;text-align:center">
            <input type="checkbox" value="${e.id}" ${checked} ${disabled} onchange="toggleEnrollmentSelection(${e.id}, this.checked);renderEnrollmentTableBody()">
          </td>
          <td style="padding:8px">${escHtml(e.name)}</td>
          <td style="padding:8px">${escHtml(e.phone)}</td>
          <td style="padding:8px">${LEVEL_ICONS[e.level]||''}${escHtml(e.level)}</td>
          <td style="padding:8px">${escHtml(e.cohort || '-')}</td>
          <td style="padding:8px">${fmtLocalShort(e.created_at)}</td>
          <td style="padding:8px">${statusBadge}</td>
        </tr>
      `;
    }).join('');
    
    // 更新计数
    const countDiv = document.querySelector('#adminContent [id*="selected"]');
    if (!countDiv) {
      // 如果没有计数div，创建一个
      const table = document.querySelector('#adminContent table');
      if (table) {
        const div = document.createElement('div');
        div.id = 'selectedCount';
        div.style.cssText = 'padding:8px;font-size:0.8rem;color:var(--text2)';
        div.innerHTML = `已选 ${pendingSelected.length}/${allPending.length} 名待审核学生 <button class="admin-btn" style="padding:4px 8px;font-size:0.8rem" onclick="importSelectedEnrollments()">📥 导入选中</button>`;
        table.parentNode.insertBefore(div, table.nextSibling);
      }
    } else {
      countDiv.innerHTML = `已选 ${pendingSelected.length}/${allPending.length} 名待审核学生 <button class="admin-btn" style="padding:4px 8px;font-size:0.8rem" onclick="importSelectedEnrollments()">📥 导入选中</button>`;
    }
  }
}

function getFilteredEnrollments() {
  const level = _enrollmentFilter.level;
  const status = _enrollmentFilter.status;
  const search = _enrollmentFilter.search.toLowerCase();
  
  return _enrollmentList.filter(e => {
    if (level && e.level !== level) return false;
    if (status && e.status !== status) return false;
    if (search && !e.name.toLowerCase().includes(search) && !e.phone.includes(search)) return false;
    return true;
  });
}

function filterEnrollmentList() {
  _enrollmentFilter.level = document.getElementById('enrollLevelFilter').value;
  _enrollmentFilter.status = document.getElementById('enrollStatusFilter').value;
  _enrollmentFilter.search = document.getElementById('enrollSearch').value.trim();
  
  // 重新渲染整个表格（包含全选checkbox）
  const container = document.querySelector('#adminContent .card:nth-child(2)');
  if (container) {
    const oldTable = container.querySelector('table');
    if (oldTable) {
      const div = document.createElement('div');
      div.style.maxHeight = '400px';
      div.style.overflowY = 'auto';
      div.innerHTML = renderEnrollmentTable();
      oldTable.parentNode.replaceChild(div.firstElementChild, oldTable);
    }
  }
}

function closeShareEnrollmentModal() {
  const modal = document.getElementById('shareEnrollmentModal');
  if (modal) modal.remove();
}

function copyEnrollmentLink() {
  const url = window._currentEnrollUrl || document.getElementById('enrollLinkText')?.textContent?.trim();
  if (!url) {
    showToast('复制失败', 'error');
    return;
  }
  navigator.clipboard.writeText(url).then(() => {
    showToast('链接已复制', 'success');
  }).catch(() => {
    showToast('复制失败', 'error');
  });
}

async function toggleEnrollmentStatus(configId, status) {
  try {
    const response = await fetch('/api/enroll-config/update', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Token': API_TOKEN },
      body: JSON.stringify({ id: configId, status })
    });
    const result = await response.json();
    if (result.error) { showToast(result.error, 'error'); return; }
    showToast(status === 'active' ? '已开启' : '已关闭', 'success');
    openEnrollmentDetail(configId);
  } catch(e) {
    showToast('操作失败：' + e.message, 'error');
  }
}

async function deleteEnrollment(configId) {
  if (!confirm('确定删除此报名？报名记录将一并删除！')) return;
  try {
    const response = await fetch('/api/enroll-config/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Token': API_TOKEN },
      body: JSON.stringify({ id: configId })
    });
    const result = await response.json();
    if (result.error) { showToast(result.error, 'error'); return; }
    showToast('删除成功', 'success');
    renderAdminEnrollment();
  } catch(e) {
    showToast('删除失败：' + e.message, 'error');
  }
}

async function importEnrollments() {
  // 导入所有选中的待审核学生
  const selectedIds = Array.from(_selectedEnrollments);
  const pending = _enrollmentList.filter(e => e.status === 'pending' && _selectedEnrollments.has(e.id));
  if (!pending.length) {
    showToast('请选择要导入的待审核学生', 'info');
    return;
  }
  
  if (!confirm(`确定导入 ${pending.length} 名学生到学生列表？\n默认密码为 123456`)) return;
  
  try {
    const response = await fetch('/api/enroll-import-students', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Token': API_TOKEN },
      body: JSON.stringify({ config_id: _currentEnrollmentConfig.id, enrollment_ids: selectedIds })
    });
    const result = await response.json();
    if (result.error) { showToast(result.error, 'error'); return; }
    showToast(`成功导入 ${result.imported} 人，更新 ${result.updated} 人`, 'success');
    if (result.errors?.length) {
      console.error('导入错误：', result.errors);
    }
    // 刷新列表和全局学生数据
    _selectedEnrollments.clear();
    // 重新加载学生列表
    allStudents = await dbSelect('students', { cacheBypass: true });
    filterStudents();
    openEnrollmentDetail(_currentEnrollmentConfig.id);
  } catch(e) {
    showToast('导入失败：' + e.message, 'error');
  }
}

async function importSelectedEnrollments() {
  await importEnrollments();
}

function exportEnrollmentCSV() {
  const filtered = getFilteredEnrollments();
  if (!filtered.length) {
    showToast('没有数据可导出', 'info');
    return;
  }
  
  const headers = ['姓名', '手机号', '级别', '班级', '报名时间', '状态'];
  const rows = filtered.map(e => [
    e.name || '',
    '\t'+(e.phone || ''),
    e.level || '',
    e.cohort || '',
    '\t'+(fmtLocal(e.created_at) || ''),
    e.status === 'approved' ? '已导入' : '待审核'
  ]);
  
  const csv = [headers.join(','), ...rows.map(r => r.join(','))].join('\n');
  downloadCSV(csv, `报名列表_${_currentEnrollmentConfig.title}_${new Date().toISOString().slice(0,10)}.csv`);
}

  const start = parseInt(document.getElementById('homeworkQStart').value) || 1;

}

function setHomeworkDeadline(hours) {
  const now = new Date();
  const endTime = new Date(now.getTime() + hours * 60 * 60 * 1000);
  document.getElementById('homeworkEndTime').value = endTime.toISOString().slice(0, 16);
}

function addHomeworkCohort() {
  const select = document.getElementById('homeworkCohortSelect');
  const value = select.value;
  if (value && !_selectedHomeworkCohorts.includes(value)) {
    _selectedHomeworkCohorts.push(value);
    updateSelectedCohortsDisplay();
  }
  select.value = '';
}

function removeHomeworkCohort(cohort) {
  _selectedHomeworkCohorts = _selectedHomeworkCohorts.filter(c => c !== cohort);
  updateSelectedCohortsDisplay();
}

function updateSelectedCohortsDisplay() {
  const list = document.getElementById('selectedCohortsList');
  if (_selectedHomeworkCohorts.length === 0) {
    list.innerHTML = '<span style="color:#999;padding:4px;">请选择班级</span>';
  } else {
    list.innerHTML = _selectedHomeworkCohorts.map(c => 
      `<span class="cohort-tag selected" onclick="removeHomeworkCohort('${escHtml(c)}')">${escHtml(c)}<span class="remove-btn">×</span></span>`
    ).join('');
  }
}

async function createHomework() {
  const title = document.getElementById('homeworkTitle').value.trim() || '今日作业';
  const qStart = parseInt(document.getElementById('homeworkQStart').value);
  const qEnd = parseInt(document.getElementById('homeworkQEnd').value);
  const defaultCount = parseInt(document.getElementById('homeworkDefaultCount').value) || 20;
  const endTime = document.getElementById('homeworkEndTime').value;
  const autoCreate = document.getElementById('homeworkAutoCreate').checked;
  
  if (!qStart || !qEnd || qStart > qEnd) {
    showToast('请设置有效的题目范围', 'error');
    return;
  }
  
  if (_selectedHomeworkCohorts.length === 0) {
    showToast('请选择至少一个班级', 'error');
    return;
  }
  
  try {
    const res = await fetch('/api/homework/create', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        title,
        target_type: 'cohort',
        cohorts: _selectedHomeworkCohorts,
        question_count: qEnd - qStart + 1,
        question_start: qStart,
        question_end: qEnd,
        end_time: endTime ? new Date(endTime).toISOString() : null,
        auto_create: autoCreate
      })
    }).then(r => r.json());
    
    if (res.error) throw new Error(res.error);
    
    // 更新配置（记忆下次延续）
    await fetch('/api/homework/config/set', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ value: { question_end: qEnd, default_count: defaultCount } })
    });
    
    closeModal();
    showToast('作业布置成功', 'success');
    await loadHomeworkList();
  } catch (e) {
    showToast('创建失败：' + e.message, 'error');
  }
}

                       `指定学生`;

          </div>

            <div class="stat-value">${homework.auto_create ? '🤖 自动' : '👆 手动'}</div>
            <div class="stat-label">布置方式</div>
          </div>
        </div>
        <div class="homework-progress-bar">
          <div class="progress-info">
            <span class="progress-label">完成进度</span>
            <span class="progress-text">${completedCount}/${totalCount}人 (${progressPercent}%)</span>
          </div>
          <div class="progress-track">
            <div class="progress-fill" style="width:${progressPercent}%"></div>
          </div>
        </div>
      </div>
      
      <div class="records-header">
        <h4>📋 学生完成情况</h4>

          const prog = Math.round(r.total_count / homework.question_count * 100);
          const statusClass = r.is_completed ? 'completed' : r.total_count > 0 ? 'in-progress' : 'pending';
          const statusText = r.is_completed ? '✅ 已完成' : r.total_count > 0 ? '🔄 进行中' : '⏳ 未开始';

async function deleteHomework(id) {
  if (!confirm('确定要删除这个作业吗？')) return;
  
  try {
    const res = await fetch('/api/homework/delete', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ id })
    }).then(r => r.json());
    
    if (res.error) throw new Error(res.error);
    
    showToast('删除成功', 'success');
    renderAdminHomework();
  } catch (e) {
    showToast('删除失败：' + e.message, 'error');
  }
}

function switchManageSubTab(tab) {
  _manageSubTab = tab;
  const container = document.getElementById('manageSubContent');
  if (!container) return;
  
  // 更新按钮样式
  const btns = document.querySelectorAll('#manageTabBtns .btn');
  btns.forEach(btn => {
    btn.classList.remove('btn-primary');
    btn.classList.add('btn-outline');
  });
  const activeBtn = document.querySelector(`#manageTabBtns .btn[onclick="switchManageSubTab('${tab}')"]`);
  if (activeBtn) {
    activeBtn.classList.remove('btn-outline');
    activeBtn.classList.add('btn-primary');
  }
  
  switch(tab) {
    case 'learning': renderLearningSub(); break;
    case 'wrong': renderWrongStatsSub(); break;
    case 'settings': renderSettingsSub(); break;
    case 'notify': renderNotifySub(); break;
    case 'logs': renderLogsSub(); break;
  }
}

function switchLearningMode(mode) {
  learningMode = mode;
  _pg.learning = 1;
  document.getElementById('lmDay').className = `btn btn-sm ${mode==='day'?'btn-primary':'btn-outline'}`;
  document.getElementById('lmWeek').className = `btn btn-sm ${mode==='week'?'btn-primary':'btn-outline'}`;
  document.getElementById('lmMonth').className = `btn btn-sm ${mode==='month'?'btn-primary':'btn-outline'}`;
  loadLearningData();
}

function setLearningDate(offset) {
  const d = new Date();
  d.setDate(d.getDate() + offset);
  learningDate = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  _pg.learning = 1;
  const inp = document.getElementById('learningDate');
  if (inp) inp.value = learningDate;
  loadLearningData();
}

function getLearningDateRange() {
  // Return {start, end} as Date objects for the selected mode
  const base = new Date(learningDate + 'T00:00:00');
  let start, end;
  if (learningMode === 'day') {
    start = new Date(base);
    end = new Date(base);
    end.setDate(end.getDate() + 1);
  } else if (learningMode === 'week') {
    // Week: Monday to Sunday containing the selected date
    const day = base.getDay() || 7; // Sunday = 7
    start = new Date(base);
    start.setDate(start.getDate() - day + 1);
    end = new Date(start);
    end.setDate(end.getDate() + 7);
  } else {
    // Month: first to last day of the month
    start = new Date(base.getFullYear(), base.getMonth(), 1);
    end = new Date(base.getFullYear(), base.getMonth() + 1, 1);
  }
  return { start, end };
}

function formatRangeLabel() {
  const { start, end } = getLearningDateRange();
  const fmt = d => `${d.getMonth()+1}/${d.getDate()}`;
  if (learningMode === 'day') return `${start.getFullYear()}-${String(start.getMonth()+1).padStart(2,'0')}-${String(start.getDate()).padStart(2,'0')}`;
  if (learningMode === 'week') return `${fmt(start)} - ${fmt(new Date(end.getTime()-1))}`;
  return `${start.getFullYear()}年${start.getMonth()+1}月`;
}

async function loadLearningData() {
  if (!_pg.learning) _pg.learning = 1;
  const statsEl = document.getElementById('learningStats');
  const rankEl = document.getElementById('learningRank');
  if (!statsEl || !rankEl) return;

  const { start, end } = getLearningDateRange();

  // Fetch records with date filter to avoid loading entire table
  // Use gte/lte on created_at for efficient server-side filtering
  // 使用 cacheBypass 确保获取最新数据
  const allRecords = await dbSelect('records', { order: ['created_at', false], gte: { created_at: start.toISOString() }, lt: { created_at: end.toISOString() }, cacheBypass: true });
  const students = learningCohort
    ? allStudents.filter(s => (s.cohort || '').split(',').map(c => c.trim()).includes(learningCohort))
    : allStudents;
  const studentIds = new Set(students.map(s => s.username));

  // Filter records by date range and cohort
  const records = allRecords.filter(r => {
    if (!studentIds.has(r.student_id)) return false;
    const t = new Date(r.created_at).getTime();
    return t >= start.getTime() && t < end.getTime();
  });

  // Aggregate per student
  const studentMap = {};
  students.forEach(s => {
    studentMap[s.username] = { username: s.username, nickname: s.nickname, cohort: s.cohort, level: s.level, study_level: s.study_level || levelFromXp(s.xp || 0), total: 0, correct: 0, streak: 0 };
  });
  records.forEach(r => {
    if (!studentMap[r.student_id]) return;
    studentMap[r.student_id].total++;
    if (r.is_correct) studentMap[r.student_id].correct++;
  });

  // Calculate streak (consecutive days with at least 1 answer up to today)
  // Only need recent 60 days for streak calculation, not entire history
  const today = new Date(); today.setHours(0,0,0,0);
  const streakStart = new Date(today); streakStart.setDate(streakStart.getDate() - 60);
  const streakRecords = await dbSelect('records', { gte: { created_at: streakStart.toISOString() }, select: ['student_id', 'created_at'], cacheBypass: true });
  const dayRecords = {};
  streakRecords.forEach(r => {
    if (!studentIds.has(r.student_id)) return;
    const _d = new Date(r.created_at); const day = `${_d.getFullYear()}-${String(_d.getMonth()+1).padStart(2,'0')}-${String(_d.getDate()).padStart(2,'0')}`;
    if (!dayRecords[r.student_id]) dayRecords[r.student_id] = new Set();
    dayRecords[r.student_id].add(day);
  });
  Object.keys(studentMap).forEach(sid => {
    const days = dayRecords[sid];
    if (!days) { studentMap[sid].streak = 0; return; }
    let streak = 0;
    const d = new Date(today);
    while (true) {
      const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
      if (days.has(key)) { streak++; d.setDate(d.getDate() - 1); }
      else break;
    }
    studentMap[sid].streak = streak;
  });

  // Sort by total questions descending (activity ranking)
  const sorted = Object.values(studentMap).sort((a, b) => {
    if (b.total !== a.total) return b.total - a.total;
    return b.correct - a.correct;
  });
  learningRankData = sorted;  // store for export

  // Stats summary
  const activeCount = sorted.filter(s => s.total > 0).length;
  const totalQuestions = sorted.reduce((sum, s) => sum + s.total, 0);
  const totalCorrect = sorted.reduce((sum, s) => sum + s.correct, 0);
  const avgRate = totalQuestions > 0 ? Math.round(totalCorrect / totalQuestions * 100) : 0;

  statsEl.innerHTML = `
    <div class="stats-grid">
      <div class="stat-card blue"><div class="stat-icon">👥</div><div class="stat-value" data-target="${students.length}">0</div><div class="stat-label">总人数</div></div>
      <div class="stat-card green"><div class="stat-icon">✅</div><div class="stat-value" data-target="${activeCount}">0</div><div class="stat-label">活跃人数</div></div>
      <div class="stat-card orange"><div class="stat-icon">✍️</div><div class="stat-value" data-target="${totalQuestions}">0</div><div class="stat-label">答题总数</div></div>
      <div class="stat-card purple"><div class="stat-icon">🎯</div><div class="stat-value">${avgRate}%</div><div class="stat-label">平均正确率</div></div>
    </div>
  `;
  document.querySelectorAll('#learningStats .stat-value[data-target]').forEach(el => {
    animateNumber(el, parseInt(el.dataset.target));
  });

  // Rank table
  const rangeLabel = formatRangeLabel();
  const modeLabel = { day: '日', week: '周', month: '月' }[learningMode];
  const modeIcon = { day: '📅', week: '📆', month: '🗓️' }[learningMode];

  // Pagination for rank table
  _pageRenderers.learning = loadLearningData;
  const pgItems = pageSlice(sorted, _pg.learning);
  const rows = pgItems.map((s, idx) => {
    const realIdx = (_pg.learning - 1) * PER_PAGE + idx;
    const pct = s.total > 0 ? Math.round(s.correct / s.total * 100) : 0;
    const rankClass = realIdx === 0 ? 'gold' : realIdx === 1 ? 'silver' : realIdx === 2 ? 'bronze' : '';
    const medal = realIdx < 3 ? ['🥇','🥈','🥉'][realIdx] : (realIdx + 1);
    const streakHtml = s.streak > 0 ? `<span style="color:#f59e0b;font-size:0.75rem">🔥${s.streak}天</span>` : '';
    const levelHtml = s.level ? `<span class="tag tag-blue" style="font-size:0.6rem;padding:1px 4px">${LEVEL_ICONS[s.level]||''} ${escHtml(s.level)}</span>` : '';
    const sLv = s.study_level || 1;
    const lvBadge = `<span class="tag" style="background:var(--tag-orange-bg,#fef3c7);color:var(--tag-orange-text,#92400e);font-size:0.6rem;padding:1px 4px">${studyLevelIcon(sLv)} Lv.${sLv}</span>`;
    return `<tr>
      <td style="padding:8px 6px;border-bottom:1px solid var(--border);text-align:center;font-weight:600;width:36px"><span class="rank-num ${rankClass}">${medal}</span></td>
      <td style="padding:8px 6px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:6px">
          <div class="student-avatar" style="background:${hashColor(s.nickname)};width:28px;height:28px;font-size:0.75rem;flex-shrink:0">${escHtml(s.nickname.charAt(0))}</div>
          <div style="min-width:0">
            <div style="font-weight:600;font-size:0.88rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(s.nickname)}</div>
            <div style="display:flex;gap:4px;align-items:center;margin-top:2px">${levelHtml}${lvBadge}${streakHtml}</div>
          </div>
        </div>
      </td>
      <td style="padding:8px 6px;border-bottom:1px solid var(--border);text-align:center;font-weight:600;color:var(--primary);font-size:0.95rem">${s.total}</td>
      <td style="padding:8px 6px;border-bottom:1px solid var(--border);text-align:center">${s.correct}/${s.total}</td>
      <td style="padding:8px 6px;border-bottom:1px solid var(--border)">
        <div style="display:flex;align-items:center;gap:6px">
          <div class="rank-bar" style="flex:1"><div class="rank-bar-fill" style="width:${pct}%;background:${gradientColor(pct)}"></div></div>
          <span style="font-size:0.82rem;font-weight:600;min-width:32px;text-align:right">${pct}%</span>
        </div>
      </td>
    </tr>`;
  }).join('');

  rankEl.innerHTML = `
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div class="card-title" style="margin:0">${modeIcon} ${rangeLabel} 排行榜（${modeLabel}榜）</div>
        <button class="btn btn-sm btn-outline" onclick="exportLearningCSV()">📥 导出</button>
      </div>
      ${sorted.length > 0 && activeCount > 0 ? `
      <div style="overflow-x:auto">
        <table style="width:100%;border-collapse:collapse;font-size:0.82rem">
          <thead><tr>
            <th style="padding:8px 6px;text-align:left;border-bottom:2px solid var(--border);width:36px">排名</th>
            <th style="padding:8px 6px;text-align:left;border-bottom:2px solid var(--border)">学生</th>
            <th style="padding:8px 6px;text-align:center;border-bottom:2px solid var(--border)">答题数</th>
            <th style="padding:8px 6px;text-align:center;border-bottom:2px solid var(--border)">正确/总</th>
            <th style="padding:8px 6px;text-align:left;border-bottom:2px solid var(--border)">正确率</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
      ${paginateHtml('learning', sorted.length, _pg.learning)}
      ` : '<div class="empty-state"><div class="empty-icon">📭</div><p>该时段暂无学习数据</p></div>'}
    </div>
    <div class="card" style="margin-top:12px">
      <div class="card-title">📊 近7日活跃趋势</div>
      <div id="learningTrend"></div>
    </div>
  `;

  // Render 7-day trend chart
  renderLearningTrend(allRecords, studentIds);
}

function renderLearningTrend(allRecords, studentIds) {
  const trendEl = document.getElementById('learningTrend');
  if (!trendEl) return;

  // Last 7 days
  const days = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date();
    d.setDate(d.getDate() - i);
    d.setHours(0,0,0,0);
    days.push(d);
  }

  const dayData = days.map(d => {
    const next = new Date(d); next.setDate(next.getDate() + 1);
    const key = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
    const dayRecords = allRecords.filter(r => {
      if (!studentIds.has(r.student_id)) return false;
      const t = new Date(r.created_at).getTime();
      return t >= d.getTime() && t < next.getTime();
    });
    const activeStudents = new Set(dayRecords.map(r => r.student_id)).size;
    const totalQ = dayRecords.length;
    const correctQ = dayRecords.filter(r => r.is_correct).length;
    const pct = totalQ > 0 ? Math.round(correctQ / totalQ * 100) : 0;
    return { key, activeStudents, totalQ, correctQ, pct };
  });

  const maxQ = Math.max(...dayData.map(d => d.totalQ), 1);
  const maxActive = Math.max(...dayData.map(d => d.activeStudents), 1);

  const bars = dayData.map(d => {
    const hPct = Math.round(d.totalQ / maxQ * 100);
    const barColor = d.totalQ > 0 ? 'var(--primary)' : '#e2e8f0';
    const weekday = ['日','一','二','三','四','五','六'][new Date(d.key).getDay()];
    return `<div style="display:flex;flex-direction:column;align-items:center;gap:4px;flex:1">
      <div style="font-size:0.7rem;color:var(--text2)">${d.totalQ}</div>
      <div style="width:100%;max-width:28px;height:80px;background:#f1f5f9;border-radius:4px;display:flex;align-items:flex-end;overflow:hidden">
        <div style="width:100%;height:${Math.max(hPct, 4)}%;background:${barColor};border-radius:4px 4px 0 0;transition:height 0.3s"></div>
      </div>
      <div style="font-size:0.65rem;color:var(--text2)">${d.key.slice(5)}</div>
      <div style="font-size:0.6rem;color:var(--text2)">周${weekday}</div>
    </div>`;
  }).join('');

  const summaryRows = dayData.map(d => {
    return `<div style="display:flex;justify-content:space-between;padding:4px 0;font-size:0.82rem;border-bottom:1px solid var(--border)">
      <span style="color:var(--text2)">${d.key.slice(5)}</span>
      <span><strong>${d.activeStudents}</strong>人活跃 · <strong>${d.totalQ}</strong>题 · 正确率<strong>${d.pct}%</strong></span>
    </div>`;
  }).join('');

  trendEl.innerHTML = `
    <div style="display:flex;align-items:flex-end;gap:4px;padding:8px 0">${bars}</div>
    <div style="margin-top:8px">${summaryRows}</div>
  `;
}

  ).join('\n');

}

async function startHomework(homeworkId) {
  try {
    // 检查是否有保存的进度
    const savedProgress = await loadHomeworkProgress(homeworkId);
    
    // 获取作业详情
    const homework = await fetch(`/api/homework/get?id=${homeworkId}`).then(r => r.json());
    if (homework.error) throw new Error(homework.error);
    
    // 开始/继续作业
    const record = await fetch('/api/homework/start', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ homework_id: homeworkId, student_id: currentUser.id })
    }).then(r => r.json());
    
    _currentStudentHomework = homework;
    
    // 获取题目（按题库顺序）
    let allQuestions = await dbSelect('questions', { 
      eq: homework.level ? { level: homework.level } : {},
      order: ['id', false] 
    });
    
    // 如果有题目范围设置，使用范围
    if (homework.question_start && homework.question_end) {
      allQuestions = allQuestions.filter(q => q.id >= homework.question_start && q.id <= homework.question_end);
    }
    
    // 检查是否有保存的进度
    if (savedProgress && savedProgress.questions) {
      // 恢复保存的进度
      _homeworkQuestions = allQuestions.filter(q => savedProgress.questions.includes(q.id));
      _homeworkIndex = savedProgress.index || 0;
      _homeworkAnswered = savedProgress.answered || {};
      _homeworkMultiSelected = {};
      
      showToast('已恢复上次进度', 'info');
    } else {
      // 排除已答过的题
      const answeredIds = record.question_ids || [];
      _homeworkQuestions = allQuestions.filter(q => !answeredIds.includes(q.id));
      
      // 如果题目不够，随机补充
      if (_homeworkQuestions.length < homework.question_count) {
        const remaining = homework.question_count - _homeworkQuestions.length;
        const otherQs = allQuestions.filter(q => !_homeworkQuestions.find(hq => hq.id === q.id));
        const shuffled = otherQs.sort(() => Math.random() - 0.5);
        _homeworkQuestions = [..._homeworkQuestions, ...shuffled.slice(0, remaining)];
      }
      
      // 截取指定数量
      _homeworkQuestions = _homeworkQuestions.slice(0, homework.question_count);
      
      _homeworkIndex = 0;
      _homeworkAnswered = {};
      _homeworkMultiSelected = {};
    }
    
    closeModal();
    enterHomeworkMode(); // 进入作业模式（全屏+防退出）
    renderHomeworkUI();
  } catch (e) {
    showToast('加载作业失败：' + e.message, 'error');
  }
}

// 作业模式相关变量
let _homeworkExitCount = 0;
let _homeworkModeActive = false;

// 进入作业模式
function enterHomeworkMode() {
  _homeworkModeActive = true;
  _homeworkExitCount = 0;
  
  // 禁用右键和选择
  document.addEventListener('contextmenu', preventContextMenu);
  document.body.style.userSelect = 'none';
  document.body.style.webkitUserSelect = 'none';
  
  // 添加页面切换监听
  document.addEventListener('visibilitychange', handleHomeworkVisibility);
  
  // 添加beforeunload警告
  window.addEventListener('beforeunload', handleHomeworkBeforeUnload);
}

// 退出作业模式
function exitHomeworkMode() {
  _homeworkModeActive = false;
  _homeworkExitCount = 0;
  
  document.removeEventListener('contextmenu', preventContextMenu);
  document.removeEventListener('visibilitychange', handleHomeworkVisibility);
  window.removeEventListener('beforeunload', handleHomeworkBeforeUnload);
  document.body.style.userSelect = '';
  document.body.style.webkitUserSelect = '';
}

// 作业模式页面切换处理
function handleHomeworkVisibility() {
  if (document.hidden && _homeworkModeActive && _currentStudentHomework) {
    _homeworkExitCount++;
    
    // 保存进度
    saveHomeworkProgress(_currentStudentHomework.id);
    
    // 显示警告
    const warn = document.getElementById('homework-warning');
    if (warn) {

function renderHomeworkCard() {
  const area = document.getElementById('homeworkCardArea');
  if (!area) return;
  
  // 更新进度导航点
  const total = _currentStudentHomework.question_count;
  document.querySelectorAll('.progress-dot').forEach((dot, i) => {
    dot.classList.remove('current', 'answered', 'wrong');
    if (i === _homeworkIndex) dot.classList.add('current');
    else {
      const q = _homeworkQuestions[i];
      if (q && _homeworkAnswered[q.id]) {
        dot.classList.add(_homeworkAnswered[q.id].isCorrect ? 'answered' : 'wrong');
      }
    }
  });
  
  // 检查是否全部答完
  const answeredCount = Object.keys(_homeworkAnswered).length;
  const submitArea = document.getElementById('homeworkSubmitArea');
  if (submitArea) {
    submitArea.style.display = answeredCount >= total ? 'block' : 'none';
  }
  
  if (_homeworkIndex >= _homeworkQuestions.length || _homeworkIndex >= total) {
    renderHomeworkComplete();
    return;
  }
  
  const q = _homeworkQuestions[_homeworkIndex];
  const typeMap = { '单选': ['单选', 'tag-blue'], '多选': ['多选', 'tag-purple'], '判断': ['判断', 'tag-green'] };
  const [typeLabel, typeClass] = typeMap[q.type] || ['未知', 'tag-gray'];
  const isMulti = q.type === '多选';
  const opts = Array.isArray(q.options) ? q.options : JSON.parse(q.options || '[]');
  const answered = _homeworkAnswered[q.id];
  const answeredOpts = answered?.selected || [];
  const isCorrect = answered?.isCorrect;
  const answerArr = Array.isArray(q.answer) ? q.answer : (typeof q.answer === 'string' ? q.answer.split(',').map(s => s.trim()) : [q.answer]);
  
  // 构建选项HTML
  const optHtml = opts.map((opt, i) => {
    const key = opt.key || opt.label || String.fromCharCode(65 + i);
    const val = opt.value || opt.text || opt;
    const isSelected = answeredOpts.includes(key);
    const isCorrectOpt = answerArr.includes(key);
    let cls = 'opt-btn';
    let icon = '';
    
    if (answered) {
      if (isCorrectOpt) {
        cls += ' correct';
        icon = '<span class="opt-icon">✓</span>';
      }
      if (isSelected && !isCorrectOpt) {
        cls += ' wrong';
        icon = '<span class="opt-icon">✗</span>';
      }
    } else if (isSelected) {
      cls += ' selected';
    }
    
    return `<button class="${cls}" data-letter="${key}" onclick="${answered ? '' : `selectHomeworkOption('${q.id}','${key}',${isMulti})`}">${icon}<span>${key}. ${escHtml(val)}</span></button>`;
  }).join('');
  
  const analysisHtml = answered && q.analysis ? `
    <div class="analysis-box"><span class="analysis-icon">💡</span>${escHtml(q.analysis)}</div>
  ` : '';
  
  const multiConfirmHtml = isMulti && !answered ? `
    <div class="confirm-submit-bar">
      <button class="multi-confirm-btn" onclick="submitHomeworkMulti('${q.id}')" ${answeredOpts.length === 0 ? 'disabled' : ''}>确认提交</button>
    </div>
  ` : '';
  
  const actionHtml = answered ? `
    <div class="practice-actions">
      <button class="btn btn-outline" onclick="prevHomeworkQuestion()" ${_homeworkIndex === 0 ? 'disabled' : ''}>上一题</button>
      <button class="btn btn-primary" onclick="nextHomeworkQuestion()">下一题</button>
    </div>
  ` : '';
  
  area.innerHTML = `
    <div class="practice-card">
      <div class="question-number">第 ${_homeworkIndex + 1} / ${total} 题</div>
      <span class="tag ${typeClass} q-type-tag">${typeLabel}</span>
      <div class="q-content">${escHtml(q.content)}</div>
      <div id="homeworkOptionsArea">${optHtml}</div>
      ${multiConfirmHtml}
      ${analysisHtml}
      ${actionHtml}
    </div>
  `;
}

function updateHomeworkProgress() {
  const total = _homeworkQuestions.length;
  const answered = Object.keys(_homeworkAnswered).length;
  const progressBar = document.getElementById('homeworkProgressBar');
  const progressText = document.getElementById('homeworkProgressText');
  if (progressBar) {
    progressBar.style.width = `${(answered / total) * 100}%`;
  }
  if (progressText) {
    progressText.textContent = `${answered}/${total}`;
  }
}

function goToHomeworkQuestion(index) {
  if (index >= 0 && index < _homeworkQuestions.length) {
    _homeworkIndex = index;
    renderHomeworkCard();
  }
}

function selectHomeworkOption(qId, key, isMulti) {
  if (isMulti) {
    if (!_homeworkMultiSelected[qId]) _homeworkMultiSelected[qId] = [];
    const idx = _homeworkMultiSelected[qId].indexOf(key);
    if (idx >= 0) _homeworkMultiSelected[qId].splice(idx, 1);
    else _homeworkMultiSelected[qId].push(key);
    _homeworkAnswered[qId] = { selected: _homeworkMultiSelected[qId] };
    renderHomeworkCard();
  } else {
    _homeworkAnswered[qId] = { selected: [key] };
    submitHomeworkAnswer(qId, [key]);
  }
}

function submitHomeworkMulti(qId) {
  const selected = _homeworkMultiSelected[qId] || [];
  if (selected.length === 0) return;
  submitHomeworkAnswer(qId, selected);
}

async function submitHomeworkAnswer(qId, selected) {
  const q = _homeworkQuestions.find(q => q.id == qId);
  const answerArr = Array.isArray(q.answer) ? q.answer : (typeof q.answer === 'string' ? q.answer.split(',').map(s => s.trim()) : [q.answer]);
  const isCorrect = selected.length === answerArr.length && selected.every(s => answerArr.includes(s));
  
  _homeworkAnswered[qId] = { selected, isCorrect };
  
  // 提交到服务器
  try {
    await fetch('/api/homework/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        homework_id: _currentStudentHomework.id,
        student_id: currentUser.id,
        question_id: qId,
        is_correct: isCorrect
      })
    });
    
    // 同时记录到 records 表
    await dbInsert('records', {
      student_id: currentUser.username,
      question_id: qId,
      is_correct: isCorrect,
      user_answer: selected.join(','),
      exam_id: null,
      is_fav: false
    });
    
    // 加 XP
    addXp(isCorrect ? XP_REWARDS.correct : XP_REWARDS.wrong, isCorrect ? '答对' : '答错');
    
    // 清除缓存
    clearCache('records');
  } catch (e) {
    console.error('提交作业答案失败:', e);
  }
  
  renderHomeworkCard();
}

function nextHomeworkQuestion() {
  _homeworkIndex++;
  renderHomeworkCard();
}

async function renderHomeworkComplete() {

    // 计算错题（使用 isCorrect 标记）
    const wrongQuestions = _homeworkQuestions.filter(q => {
      const ans = _homeworkAnswered[q.id];
      if (!ans) return false;
      return ans.isCorrect === false;
    });
    
    const area = document.getElementById('homeworkCardArea');
    
    if (wrongQuestions.length > 0) {
      // 有错题，显示错题重做提示
      area.innerHTML = `
        <div class="homework-complete">

              <span class="stat-label">答题数</span>
              <span class="stat-value">${_homeworkQuestions.length}</span>
            </div>
            <div class="stat-item correct">

            </div>

            </div>
          </div>

          <h3>作业全部完成！</h3>
          <div class="complete-stats">
            <div class="stat-item">
              <span class="stat-label">答题数</span>
              <span class="stat-value">${_homeworkQuestions.length}</span>
            </div>
            <div class="stat-item correct">
              <span class="stat-label">答对数</span>
              <span class="stat-value">${_homeworkQuestions.length}</span>
            </div>
            <div class="stat-item">
              <span class="stat-label">用时</span>
              <span class="stat-value">${Math.floor(_homeworkTimerSeconds / 60)}分${_homeworkTimerSeconds % 60}秒</span>
            </div>
          </div>

function retryWrongQuestions() {
  // 筛出错题，重新开始
  const wrongQuestions = _homeworkQuestions.filter(q => {
    const ans = _homeworkAnswered[q.id];
    if (!ans) return false;
    return ans.isCorrect === false;
  });
  
  if (wrongQuestions.length === 0) {
    renderHomeworkComplete();
    return;
  }
  
  // 重置为错题
  _homeworkQuestions = wrongQuestions;
  _homeworkIndex = 0;
  _homeworkAnswered = {};
  _homeworkMultiSelected = {};
  
  showToast(`开始重做 ${wrongQuestions.length} 道错题`, 'info');
  saveHomeworkProgress();
  renderHomeworkUI();
}

function exitHomework() {
  _currentStudentHomework = null;
  _homeworkQuestions = [];
  _homeworkIndex = 0;
  _homeworkAnswered = {};
  _homeworkMultiSelected = {};
  stopHomeworkTimer();
  switchStudentTab('practice');
}

let _homeworkTimerInterval = null;
let _homeworkTimerSeconds = 0;

function startHomeworkTimer() {
  _homeworkTimerSeconds = 0;
  updateHomeworkTimerDisplay();
  _homeworkTimerInterval = setInterval(() => {
    _homeworkTimerSeconds++;
    updateHomeworkTimerDisplay();
  }, 1000);
}

function stopHomeworkTimer() {
  if (_homeworkTimerInterval) {
    clearInterval(_homeworkTimerInterval);
    _homeworkTimerInterval = null;
  }
}

function updateHomeworkTimerDisplay() {
  const display = document.getElementById('homeworkTimeDisplay');
  if (display) {
    const mins = Math.floor(_homeworkTimerSeconds / 60);
    const secs = _homeworkTimerSeconds % 60;
    display.textContent = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
  }
}

function confirmExitHomework() {
  if (confirm('确定要退出作业吗？下次可以继续做。')) {

  };

}

async function loadHomeworkProgress(homeworkId) {
