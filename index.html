async function enterQuickExam(examId) {
  const btn = document.getElementById('guestStartBtn');
  if (btn.disabled) return;
  const name = document.getElementById('guestName').value.trim();
  const phone = document.getElementById('guestPhone').value.trim();
  if (!name) { showToast('请输入姓名', 'error'); return; }
  if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('请输入正确的11位手机号', 'error'); return; }

  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    const exams = await dbSelect('exams', { eq: { id: examId } });
    if (!exams.length) { showToast('考试不存在', 'error'); return; }
    const exam = exams[0];

    // Re-check exam time validity
    const nowTs = Date.now();
    if (nowTs < new Date(exam.start_time).getTime()) { showToast('考试尚未开始', 'error'); return; }
    if (nowTs > new Date(exam.end_time).getTime()) { showToast('考试已结束', 'error'); return; }

    // Check if this phone already took this exam
    const existRecords = await dbSelect('records', { eq: { student_id: phone, exam_id: Number(examId) } });
    if (existRecords.length > 0) {
      showToast('该手机号已参加过本次考试', 'info');
      return;
    }

    // Save guest info
    quickExamGuest = { name, phone };
    examData = exam;
    currentExamId = exam.id ? Number(exam.id) : null;
    currentExamIsMock = false;
    currentExamIsQuick = true;
    currentExamPassRate = exam.pass_rate || 60;
    examAnswers = {};
    fullscreenExitCount = 0;
    examRemaining = exam.duration * 60;

    // Anti-cheat: disable right-click, text selection, and detect tab switching
    document.addEventListener('contextmenu', preventContextMenu);
    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';
    document.addEventListener('visibilitychange', handleVisibilityChange);

    // Load exam questions
    const allQ = await dbSelect('questions', { order: ['id', false] });
    practiceQuestions = (exam.question_ids || []).map(id => allQ.find(q => q.id == id)).filter(Boolean);

    renderExamTaking();
  } catch(e) {
    showToast('进入考试失败', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '进入考试';
  }
}

function showQuickExamEnd() {
  // Clean up anti-cheat
  document.removeEventListener('contextmenu', preventContextMenu);
  document.body.style.userSelect = '';
  document.body.style.webkitUserSelect = '';
  document.removeEventListener('visibilitychange', handleVisibilityChange);
  // Clear exam state
  examData = null;

async function showArchiveDialog() {
  // Count expired students and their records
  const expiredStudents = await dbSelect('students', { eq: { status: 'expired' }, select: ['id', 'nickname', 'username', 'expires_at'] });
  const disabledStudents = await dbSelect('students', { eq: { status: 'disabled' }, select: ['id', 'nickname', 'username', 'expires_at'] });
  const archivable = [...expiredStudents, ...disabledStudents];
  
  if (archivable.length === 0) {
    showToast('当前没有过期或禁用的学生，无需归档', 'info');
    return;
  }
  
  // Count records for these students
  const studentIds = archivable.map(s => s.id);
  let recordCount = 0;
  // Use count API for efficiency
  for (const sid of studentIds) {
    const cnt = await dbCount('records', { student_id: sid });
    recordCount += cnt;
  }
  
  const sizeEst = (recordCount * 189 / 1024 / 1024).toFixed(2);
  
  openModal('📦 归档过期学生数据', `
    <div style="padding:2px 0">
      <div style="background:var(--bg);border-radius:8px;padding:12px;margin-bottom:12px">
        <div style="font-size:0.85rem;font-weight:600;margin-bottom:8px">归档预览</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:0.8rem">
          <div>过期/禁用学生: <strong>${archivable.length}</strong> 人</div>
          <div>关联答题记录: <strong>${recordCount}</strong> 条</div>
          <div>预计释放空间: <strong>${sizeEst} MB</strong></div>
          <div>归档方式: <strong>删除记录</strong></div>
        </div>
      </div>
      <div style="font-size:0.78rem;color:var(--text2);margin-bottom:12px">
        ⚠️ 归档将删除这些学生的答题记录，学生账号保留。错题本、学情统计中的相关数据将受影响。此操作不可恢复！
      </div>
      <div class="form-group">
        <label>请输入 "确认归档" 以继续</label>
        <input id="archiveConfirmInput" class="form-input" placeholder="确认归档" autocomplete="off">
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doArchive()">执行归档</button>
    </div>
  `);
}

async function doArchive() {
  const input = document.getElementById('archiveConfirmInput').value.trim();
  if (input !== '确认归档') {
    showToast('请输入"确认归档"以确认操作', 'error');
    return;
  }
  
  try {
    const expiredStudents = await dbSelect('students', { eq: { status: 'expired' }, select: ['id'] });
    const disabledStudents = await dbSelect('students', { eq: { status: 'disabled' }, select: ['id'] });
    const studentIds = [...expiredStudents, ...disabledStudents].map(s => s.id);
    
    if (studentIds.length === 0) {
      showToast('没有需要归档的学生', 'info');
      return;
    }
    
    let deletedCount = 0;
    // Delete records in batches of 50 to avoid timeout
    const batchSize = 50;
    for (let i = 0; i < studentIds.length; i += batchSize) {
      const batch = studentIds.slice(i, i + batchSize);
      for (const sid of batch) {
        await dbDelete('records', { student_id: sid });
      }
      deletedCount += batch.length;
      // Update progress
      const pct = Math.round((i + batchSize) / studentIds.length * 100);
      document.getElementById('archiveConfirmInput') && (document.getElementById('archiveConfirmInput').placeholder = `正在归档... ${Math.min(pct, 100)}%`);
    }
    
    // Clear all caches - use cacheClearTable for proper table cache clearing
    cacheClearTable('records');
    cacheClearTable('students');
    closeModal();
    showToast(`归档完成！已清理 ${studentIds.length} 名学生的答题记录`, 'success');
  } catch(e) {
    console.error('Archive failed:', e);
    showToast('归档失败: ' + (e.message || '未知错误'), 'error');
  }
}

function handleFileDrop(e) {
  e.preventDefault();
  e.target.style.borderColor = 'var(--border)';
  e.target.style.background = 'transparent';
  const file = e.dataTransfer.files[0];
  if (file) processFile(file);
}

function handleFileSelect(input) {
  const file = input.files[0];
  if (file) processFile(file);
}

async function processFile(file) {
  const extension = file.name.split('.').pop().toLowerCase();
  
  // 读取文件内容
  let content = '';
  if (extension === 'xlsx' || extension === 'xls') {
    showToast('正在解析Excel文件...', 'info');
    const arrayBuffer = await file.arrayBuffer();
    content = await parseExcel(arrayBuffer);
  } else if (extension === 'docx') {
    showToast('正在解析Word文档...', 'info');
    try {
      content = await parseDocx(file);
    } catch (err) {
      showToast('Word文档解析失败: ' + err.message, 'error');
      return;
    }
  } else if (extension === 'doc') {
    // .doc 是旧版Word格式，提示用户转换为 .docx
    alert('.doc是旧版格式，不支持直接导入！\n\n请使用以下方法转换：\n1. 用Word/WPS打开文件\n2. 文件 → 另存为\n3. 选择格式为 "Word 文档 (*.docx)"\n4. 保存后重新导入');
    return;
  } else {
    content = await file.text();
  }
  
  // 智能解析内容
  const parsed = smartParse(content);
  const questions = parsed.questions || [];
  
  if (questions.length === 0) {
    const errMsg = parsed.errors ? parsed.errors.join('; ') : '未能解析出任何题目';
    showToast(errMsg + '，请检查文件格式', 'error');
    return;
  }
  
  // 显示预览
  const previewEl = document.getElementById('fileImportPreview');
  const resultEl = document.getElementById('fileImportResult');
  const confirmBtn = document.getElementById('confirmFileImportBtn');
  
  previewEl.style.display = 'block';
  
  const typeNames = { single: '单选', multiple: '多选', judge: '判断' };
  const stats = parsed.stats || { total: questions.length, single: 0, multiple: 0, judge: 0 };
  
  // 生成详细统计信息
  let previewHtml = `<div style="font-size:0.82rem;color:var(--text2);margin-bottom:8px">
    检测到 <strong style="color:var(--success)">${questions.length}</strong> 道题目
    <span style="margin-left:12px">单选 <strong>${stats.single || 0}</strong></span>
    <span style="margin-left:8px">多选 <strong>${stats.multiple || 0}</strong></span>
    <span style="margin-left:8px">判断 <strong>${stats.judge || 0}</strong></span>
  </div>`;
  
  previewHtml += '<div style="max-height:160px;overflow-y:auto">';
  questions.slice(0, 10).forEach((q, i) => {
    previewHtml += `<div style="padding:6px 0;border-bottom:1px solid var(--border);font-size:0.8rem">
      <span style="color:var(--primary)">${i + 1}.</span> 
      <span style="background:#e0f2fe;padding:1px 4px;border-radius:3px;font-size:0.75rem">[${typeNames[q.type] || q.type}]</span>
      ${escHtml(q.content.substring(0, 50))}${q.content.length > 50 ? '...' : ''}
      <span style="color:var(--success)">答案: ${q.answer}</span>
    </div>`;
  });
  if (questions.length > 10) {
    previewHtml += `<div style="padding:8px 0;color:var(--text2);font-size:0.78rem;text-align:center">... 还有 ${questions.length - 10} 道题目</div>`;
  }
  previewHtml += '</div>';
  
  document.getElementById('filePreviewContent').innerHTML = previewHtml;
  
  // 保存解析结果
  window._fileImportData = questions;
  
  // 显示格式检测信息
  resultEl.style.display = 'block';
  const encodingInfo = parsed.encoding ? ` | 编码: <strong>${parsed.encoding}</strong>` : '';
  resultEl.innerHTML = `<div style="font-size:0.78rem;color:var(--text2);background:#dcfce7;padding:8px 12px;border-radius:6px;margin-bottom:8px">
    ✅ 智能识别完成！检测格式：<strong>${parsed.format || '自动'}</strong>${encodingInfo}
  </div>`;
  
  confirmBtn.disabled = false;
  confirmBtn.textContent = `📥 导入 ${questions.length} 道题目`;
  
  // 清除错误状态
  resultEl.innerHTML = '';
  resultEl.style.display = 'none';
}

async function parseExcel(arrayBuffer) {
  // 使用SheetJS解析Excel
  if (typeof XLSX === 'undefined') {
    await loadScript('https://cdn.sheetjs.com/xlsx-0.20.1/package/dist/xlsx.full.min.js');
  }
  
  const data = new Uint8Array(arrayBuffer);
  const workbook = XLSX.read(data, { type: 'array' });
  const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
  const jsonData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
  
  // 尝试将Excel转换为JSON格式
  const rows = jsonData.filter(row => row.some(cell => cell !== null && cell !== undefined && cell !== ''));
  if (rows.length === 0) return '';
  
  // 获取表头
  const header = rows[0].map(h => String(h || '').trim());
  
  // 转换为JSON对象数组
  const jsonArray = [];
  for (let i = 1; i < rows.length; i++) {
    const row = rows[i];
    const obj = {};
    header.forEach((h, idx) => {
      obj[h] = row[idx];
    });
    // 也添加A/B/C/D作为选项列
    if (row[0] !== undefined) obj.A = row[0];
    if (row[1] !== undefined) obj.B = row[1];
    if (row[2] !== undefined) obj.C = row[2];
    if (row[3] !== undefined) obj.D = row[3];
    jsonArray.push(obj);
  }
  
  return JSON.stringify(jsonArray);
}

// ===== Word文档(.docx)解析 =====
async function parseDocx(file) {
  // 动态加载 mammoth.js
  if (typeof mammoth === "undefined") {
    await loadScript("https://cdn.jsdelivr.net/npm/mammoth@1.6.0/mammoth.browser.min.js");
  }
  
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = async function(e) {
      try {
        const result = await mammoth.extractRawText({ arrayBuffer: e.target.result });
        const text = result.value; // 纯文本内容
        
        if (!text || text.trim().length < 10) {
          resolve("");
          return;
        }
        
        // 处理文本，规范化换行
        let processed = text
          .replace(/\r\n/g, "\n")
          .replace(/\r/g, "\n")
          .replace(/\n{3,}/g, "\n\n")
          .trim();
        
        resolve(processed);
      } catch (err) {
        console.error("Word解析失败:", err);
        reject(err);
      }
    };
    reader.onerror = reject;
    reader.readAsArrayBuffer(file);
  });
}


function loadScript(src) {
  return new Promise((resolve, reject) => {
    const script = document.createElement('script');
    script.src = src;
    script.onload = resolve;
    script.onerror = reject;
    document.head.appendChild(script);
  });
}

// ===== 增强版智能题库解析器 =====
/**
 * 智能题库导入系统 v2.0
 * 支持：JSON、CSV、Excel、纯文本
 * 自动检测：编码、分隔符、题型、答案格式
 */

// ===== 智能内容解析 =====
function smartParse(content) {
  // 预处理：规范化换行符
  content = content.replace(/\r\n/g, '\n').replace(/\r/g, '\n').trim();
  
  // 0. 检测并转换编码
  const { text, encoding } = detectAndConvertEncoding(content);
  content = text;
  
  const result = {
    questions: [],
    format: '未知',
    encoding: encoding,
    stats: { total: 0, single: 0, multiple: 0, judge: 0, failed: 0 },
    errors: []
  };
  
  // 1. 尝试 JSON 格式（最高优先级）
  if (content.startsWith('[') || content.startsWith('{')) {
    const jsonResult = tryParseJSON(content);
    if (jsonResult.questions.length > 0) {
      result.questions = jsonResult.questions;
      result.format = 'JSON';
      result.stats = countStats(result.questions);
      return result;
    } else if (jsonResult.error) {
      result.errors.push('JSON: ' + jsonResult.error);
    }
  }
  
  // 2. 尝试带表头的 CSV/Excel 格式
  const csvResult = tryParseCSV(content);
  if (csvResult.questions.length > 0) {
    result.questions = csvResult.questions;
    result.format = 'CSV表格';
    result.stats = countStats(result.questions);
    return result;
  }
  
  // 3. 尝试多种分隔符格式（按优先级）
  const delimiters = ['|', '\t', ';;', ';', ',', '::'];
  let bestResult = { questions: [], quality: 0 };
  
  for (const delim of delimiters) {
    const parsed = tryParseDelimited(content, delim);
    if (parsed.questions.length > bestResult.quality) {
      bestResult = { questions: parsed.questions, quality: parsed.quality };
    }
  }
  
  if (bestResult.questions.length > 0) {
    result.questions = bestResult.questions;
    result.format = '文本分隔';
    result.stats = countStats(result.questions);
    return result;
  }
  
  // 4. 尝试智能逐行解析（处理特殊格式）
  const lineResult = tryParseSmartLines(content);
  if (lineResult.questions.length > 0) {
    result.questions = lineResult.questions;
    result.format = '智能解析';
    result.stats = countStats(result.questions);
    return result;
  }
  
  result.errors.push('无法识别文件格式');
  return result;
}

// ===== 编码检测与转换 =====
function detectAndConvertEncoding(content) {
  // 检测是否包含乱码特征（GBK转UTF8产生的乱码）
  const garbledPattern = /[ã€Šã€‹â€œâ€�]/;
  const hasGarbled = garbledPattern.test(content);
  
  // 检测UTF-8编码特征
  const utf8Chars = content.match(/[\u4e00-\u9fff]/g) || [];
  const hasCJK = utf8Chars.length > 0;
  
  // 如果有中文且没有乱码，很可能是UTF-8
  if (hasCJK && !hasGarbled) {
    return { text: content, encoding: 'UTF-8' };
  }
  
  // 如果有乱码，尝试用TextDecoder转换
  if (hasGarbled) {
    // 尝试将乱码转为正常中文
    try {
      // GBK编码的中文在UTF-8解析时会产生这些字符
      const replacements = {
        'ã€Š': '【',
        'ã€‹': '】',
        'â€œ': '"',
        'â€�': '"',
        'ã€Œ': '【',
        'ã€�': '】'
      };
      let fixed = content;
      for (const [wrong, correct] of Object.entries(replacements)) {
        fixed = fixed.replace(new RegExp(wrong, 'g'), correct);
      }
      return { text: fixed, encoding: 'GBK→UTF8' };
    } catch (e) {
      return { text: content, encoding: 'unknown' };
    }
  }
  
  return { text: content, encoding: 'UTF-8' };
}

// ===== JSON 格式尝试解析 =====
function tryParseJSON(content) {
  try {
    // 尝试直接解析
    let json = JSON.parse(content);
    if (!Array.isArray(json)) json = [json];
    
    const questions = [];
    for (const item of json) {
      const q = parseJSONItem(item);
      if (q) questions.push(q);
    }
    
    return { questions };
  } catch (e) {
    // 尝试修复常见JSON错误
    try {
      // 修复单引号为双引号
      let fixed = content.replace(/'/g, '"');
      // 移除尾部逗号
      fixed = fixed.replace(/,\s*([}\]])/g, '$1');
      const json = JSON.parse(fixed);
      const questions = Array.isArray(json) ? json.map(parseJSONItem).filter(Boolean) : [parseJSONItem(json)].filter(Boolean);
      return { questions };
    } catch (e2) {
      return { questions: [], error: e.message };
    }
  }
}

// 解析单个JSON题目
function parseJSONItem(item) {
  if (!item || typeof item !== 'object') return null;
  
  const typeNames = { '单选': 'single', '多选': 'multiple', '判断': 'judge', 'single': 'single', 'multiple': 'multiple', 'judge': 'judge' };
  
  // 识别题型
  let type = 'single';
  const typeField = item.type || item.题型 || item.questionType || '';
  if (typeNames[typeField]) {
    type = typeNames[typeField];
  } else if (/判断|对错|true.*false/i.test(typeField)) {
    type = 'judge';
  } else if (/多选|多选/i.test(typeField)) {
    type = 'multiple';
  }
  
  // 提取题干
  let content = item.content || item.题干 || item.question || item.title || item.subject || '';
  if (!content) return null;
  
  // 提取答案
  let answer = (item.answer || item.答案 || item.an || '').toString().toUpperCase();
  
  // 标准化答案
  answer = normalizeAnswer(answer, type);
  
  // 提取选项
  let options = [];
  if (item.options) {
    options = parseOptions(item.options);
  } else if (item.A || item.B || item.C || item.D) {
    if (item.A) options.push({ key: 'A', value: item.A });
    if (item.B) options.push({ key: 'B', value: item.B });
    if (item.C) options.push({ key: 'C', value: item.C });
    if (item.D) options.push({ key: 'D', value: item.D });
  } else if (item.选项) {
    options = parseOptions(item.选项);
  }
  
  // 判断题默认选项
  if (type === 'judge' && options.length === 0) {
    options = [{ key: 'A', value: '正确' }, { key: 'B', value: '错误' }];
  }
  
  // 提取解析
  let analysis = item.analysis || item.解析 || item.explanation || item.desc || '';
  
  // 提取标签
  let tags = item.tags || item.标签 || [];
  if (typeof tags === 'string') {
    tags = tags.split(/[,，;；]/).map(t => t.trim()).filter(Boolean);
  }
  
  if (content && answer) {
    return { type, content, options: JSON.stringify(options), answer, analysis: analysis.toString(), tags };
  }
  
  return null;
}

// 标准化答案格式
function normalizeAnswer(answer, type) {
  if (!answer) return '';
  answer = answer.toString().trim();
  
  // 处理判断题 - 对/错/正确/错误/√/×/T/F/true/false
  if (['对', '错', '正确', '错误', 'TRUE', 'FALSE', 'YES', 'NO', 'T', 'F', 'Y', 'N', '√', '×', 'true', 'false'].includes(answer.toUpperCase()) || answer === '√' || answer === '×') {
    // 对/正确/TRUE/YES/T/Y/√/true → A
    if (/^(对|正确|TRUE|YES|T|Y|√|true)$/i.test(answer)) return 'A';
    // 错/错误/FALSE/NO/F/N/×/false → B
    return 'B';
  }
  // 处理多选题（提取所有字母）
  if (type === 'multiple') {
    const letters = answer.match(/[A-Da-d]/g);
    if (letters) return letters.map(l => l.toUpperCase()).join('');
  }
  
  // 处理单选题
  const letter = answer.match(/[A-Da-d]/);
  if (letter) return letter[0].toUpperCase();
  
  return answer;
}

// 解析选项
function parseOptions(opts) {
  if (Array.isArray(opts)) {
    return opts.map((o, i) => {
      if (typeof o === 'string') {
        return { key: String.fromCharCode(65 + i), value: o };
      }
      return { 
        key: o.key || o.label || String.fromCharCode(65 + i), 
        value: o.value || o.text || o 
      };
    });
  }
  
  if (typeof opts === 'object') {
    return Object.entries(opts).map(([k, v]) => ({ key: k.toUpperCase(), value: v }));
  }
  
  return [];
}

// CSV/Excel格式解析
// ===== CSV/表格格式尝试解析 =====
function tryParseCSV(content) {
  const lines = content.split('\n').filter(l => l.trim());
  if (lines.length < 2) return { questions: [] };
  
  const firstLine = lines[0];
  
  // 检测是否是表格格式
  const hasHeader = /(题型|题干|Question|Answer|选项|Option|单选|多选|判断)/i.test(firstLine);
  const hasComma = /,/.test(firstLine);
  
  if (!hasHeader && !hasComma) return { questions: [] };
  
  // 解析表头
  const headers = parseCSVLine(firstLine).map(h => h.trim().toLowerCase());
  
  // 建立列映射
  const colMap = buildColumnMap(headers);
  
  // 如果没有识别到关键列，跳过
  if (!colMap.content && headers.length < 3) {
    return { questions: [] };
  }
  
  const questions = [];
  const startLine = hasHeader ? 1 : 0;
  
  for (let i = startLine; i < lines.length; i++) {
    const line = lines[i].trim();
    if (!line) continue;
    
    const q = parseCSVRow(line, colMap);
    if (q) questions.push(q);
  }
  
  return { questions };
}

// 建立列映射
function buildColumnMap(headers) {
  const map = {};
  
  headers.forEach((h, idx) => {
    const h2 = h.replace(/[_\s]/g, '');
    
    if (/题型|type|qtype|questiontype/i.test(h2) && map.type === undefined) map.type = idx;
    if (/题干|题目|content|question|title|subject/i.test(h2) && map.content === undefined) map.content = idx;
    if (/答案|answer|key|ans/i.test(h2) && map.answer === undefined) map.answer = idx;
    if (/解析|analysis|explanation|desc|description/i.test(h2) && map.analysis === undefined) map.analysis = idx;
    if (/标签|tags|category/i.test(h2) && map.tags === undefined) map.tags = idx;
    
    if (/^a$|^选项.*a|^a$|选项a/i.test(h2) && map.A === undefined) map.A = idx;
    if (/^b$|^选项.*b|^b$|选项b/i.test(h2) && map.B === undefined) map.B = idx;
    if (/^c$|^选项.*c|^c$|选项c/i.test(h2) && map.C === undefined) map.C = idx;
    if (/^d$|^选项.*d|^d$|选项d/i.test(h2) && map.D === undefined) map.D = idx;
  });
  
  // 如果没有找到A/B/C/D列，检查是否有连续的短文本列
  if (map.A === undefined) {
    const optionCandidates = headers.map((h, i) => ({ h, i, len: h.length }))
      .filter(x => x.len <= 2 && /^[a-d]$/i.test(x.h));
    if (optionCandidates.length >= 2) {
      optionCandidates.slice(0, 4).forEach((x, i) => {
        if (i === 0) map.A = x.i;
        if (i === 1) map.B = x.i;
        if (i === 2) map.C = x.i;
        if (i === 3) map.D = x.i;
      });
    }
  }
  
  return map;
}

// 解析CSV行
function parseCSVRow(line, colMap) {
  try {
    const parts = parseCSVLine(line);
    if (parts.length < 2) return null;
    
    const typeNames = { '单选': 'single', '多选': 'multiple', '判断': 'judge' };
    
    // 识别题型
    let type = 'single';
    if (colMap.type !== undefined) {
      const t = (parts[colMap.type] || '').toLowerCase();
      if (typeNames[t]) type = typeNames[t];
      else if (/判断|对错/i.test(t)) type = 'judge';
      else if (/多选/i.test(t)) type = 'multiple';
    }
    
    // 提取题干
    let content = '';
    if (colMap.content !== undefined) {
      content = (parts[colMap.content] || '').trim();
    } else {
      let maxLen = 0;
      for (let i = 0; i < parts.length; i++) {
        if (i === colMap.answer || i === colMap.analysis) continue;
        if (colMap.A !== undefined && i === colMap.A) continue;
        if (colMap.B !== undefined && i === colMap.B) continue;
        if (colMap.C !== undefined && i === colMap.C) continue;
        if (colMap.D !== undefined && i === colMap.D) continue;
        
        const p = parts[i].trim();
        if (p.length > maxLen && p.length > 5) {
          if (!/^[A-Da-d]$/.test(p)) {
            maxLen = p.length;
            content = p;
          }
        }
      }
    }
    
    if (!content || content.length < 4) return null;
    
    // 提取答案
    let answer = '';
    if (colMap.answer !== undefined) {
      answer = (parts[colMap.answer] || '').toString().toUpperCase();
    } else {
      for (let i = parts.length - 1; i >= 0; i--) {
        const p = parts[i].trim();
        if (/^[A-Da-d]$/.test(p) || /^[A-Da-d]{2,4}$/.test(p)) {
          answer = p.toUpperCase();
          break;
        }
        if (/^(对|错|正确|错误)$/.test(p)) {
          answer = /^(对|正确)$/.test(p) ? 'A' : 'B';
          break;
        }
      }
    }
    
    answer = normalizeAnswer(answer, type);
    if (!answer) return null;
    
    // 提取选项
    let options = [];
    if (colMap.A !== undefined && parts[colMap.A]) options.push({ key: 'A', value: parts[colMap.A].trim() });
    if (colMap.B !== undefined && parts[colMap.B]) options.push({ key: 'B', value: parts[colMap.B].trim() });
    if (colMap.C !== undefined && parts[colMap.C]) options.push({ key: 'C', value: parts[colMap.C].trim() });
    if (colMap.D !== undefined && parts[colMap.D]) options.push({ key: 'D', value: parts[colMap.D].trim() });
    
    if (type === 'judge' && options.length === 0) {
      options = [{ key: 'A', value: '正确' }, { key: 'B', value: '错误' }];
    }
    
    // 提取解析
    let analysis = '';
    if (colMap.analysis !== undefined) {
      analysis = (parts[colMap.analysis] || '').trim();
    }
    
    // 提取标签
    let tags = [];
    if (colMap.tags !== undefined) {
      const t = (parts[colMap.tags] || '').trim();
      if (t) tags = t.split(/[,，;；]/).map(x => x.trim()).filter(Boolean);
    }
    
    return { type, content, options: JSON.stringify(options), answer, analysis, tags };
  } catch (e) {
    return null;
  }
}

// CSV行解析（处理引号）
function parseCSVLine(line) {
  const parts = [];
  let current = '';
  let inQuotes = false;
  
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      inQuotes = !inQuotes;
    } else if (c === ',' && !inQuotes) {
      parts.push(current.trim());
      current = '';
    } else {
      current += c;
    }
  }
  parts.push(current.trim());
  
  return parts;
}

// ===== 智能逐行解析（处理特殊格式）=====
function tryParseSmartLines(content) {
  const lines = content.split('\n').filter(l => l.trim());
  if (lines.length < 1) return { questions: [] };
  
  const typeNames = { '单选': 'single', '多选': 'multiple', '判断': 'judge', 'single': 'single', 'multiple': 'multiple', 'judge': 'judge' };
  const questions = [];
  let currentQ = null;
  let currentOptions = [];
  
  for (const rawLine of lines) {
    const line = rawLine.trim();
    if (!line) continue;
    
    // 检测是否是新题目的开始
    const isNewQuestion = (
      typeNames[line] || // 题型标识开头
      /^[【\[【].*题/.test(line) || // 【单选题】
      /^\d+[.、]/.test(line) || // 1. 或 1、
      /^[题目]+[:：]/.test(line) // 题目:
    );
    
    // 如果是新题目且有当前题目，保存它
    if (isNewQuestion && currentQ && currentQ.content) {
      // 尝试从内容中提取答案
      const answerMatch = currentQ.content.match(/答案[：:]\s*([A-Da-d对错√×])\s*$/i);
      if (answerMatch) {
        currentQ.answer = normalizeAnswer(answerMatch[1], currentQ.type);
        currentQ.content = currentQ.content.replace(/答案[：:]\s*[A-Da-d对错√×]\s*$/i, '').trim();
      }
      
      // 如果没有找到答案，检查最后一行是否是答案
      if (!currentQ.answer && currentOptions.length > 0) {
        const lastOpt = currentOptions[currentOptions.length - 1];
        if (/^(对|错|正确|错误|√|×|A|B)$/i.test(lastOpt.value)) {
          currentQ.answer = normalizeAnswer(lastOpt.value, currentQ.type);
          currentOptions.pop();
        }
      }
      
      if (currentQ.answer && currentQ.content) {
        if (currentQ.type === 'judge' && currentOptions.length === 0) {
          currentOptions = [{ key: 'A', value: '正确' }, { key: 'B', value: '错误' }];
        }
        questions.push({
          type: currentQ.type,
          content: currentQ.content,
          options: JSON.stringify(currentOptions),
          answer: currentQ.answer,
          analysis: currentQ.analysis || '',
          tags: []
        });
      }
      currentQ = null;
      currentOptions = [];
    }
    
    // 开始新题目
    if (isNewQuestion || !currentQ) {
      let type = 'single';
      let content = line;
      
      // 检测题型
      if (/判断|对错|judge/i.test(line)) type = 'judge';
      else if (/多选|multiple/i.test(line)) type = 'multiple';
      else if (/单选|single/i.test(line)) type = 'single';
      
      // 移除题型前缀
      content = content.replace(/^[【\[【】\]]*(单选|多选|判断|single|multiple|judge)[】\]]*[:：\s]*/i, '');
      content = content.replace(/^\d+[.、]\s*/, '');
      content = content.replace(/^[题目]+[:：\s]*/, '');
      
      currentQ = { type, content };
      continue;
    }
    
    // 处理选项行
    if (currentQ) {
      const optMatch = line.match(/^([A-Da-d])[.、:：\s]+(.*)$/);
      if (optMatch) {
        currentOptions.push({ key: optMatch[1].toUpperCase(), value: optMatch[2] || optMatch[1] });
      } else if (/^[A-Da-d]$/.test(line) || /^[A-Da-d]{2,4}$/.test(line)) {
        // 纯选项标识，可能是答案
        if (!currentQ.answer) {
          currentQ.answer = normalizeAnswer(line.toUpperCase(), currentQ.type);
        }
      } else if (/^(对|错|正确|错误|√|×)$/i.test(line)) {
        // 判断题答案
        if (!currentQ.answer) {
          currentQ.answer = normalizeAnswer(line, currentQ.type);
        }
      } else if (/^答案[：:]?\s*(.*)$/i.test(line)) {
        // 独立的答案行
        const ans = line.match(/^答案[：:]?\s*(.*)$/i)[1];
        if (/^[A-Da-d]$/i.test(ans) || /^(对|错|正确|错误|√|×)$/i.test(ans)) {
          currentQ.answer = normalizeAnswer(ans, currentQ.type);
        }
      } else if (/^(解析|说明)[:：]/i.test(line)) {
        currentQ.analysis = line.replace(/^(解析|说明)[:：]/, '');
      } else {
        // 可能是选项内容（没有A.前缀）
        if (currentOptions.length > 0 && !currentQ.answer) {
          currentOptions[currentOptions.length - 1].value += ' ' + line;
        }
      }
    }
  }
  
  // 保存最后一个题目
  if (currentQ && currentQ.content) {
    if (!currentQ.answer && currentOptions.length > 0) {
      const lastOpt = currentOptions[currentOptions.length - 1];
      if (/^(对|错|正确|错误|√|×|A|B)$/i.test(lastOpt.value)) {
        currentQ.answer = normalizeAnswer(lastOpt.value, currentQ.type);
        currentOptions.pop();
      }
    }
    
    if (currentQ.answer && currentQ.content) {
      if (currentQ.type === 'judge' && currentOptions.length === 0) {
        currentOptions = [{ key: 'A', value: '正确' }, { key: 'B', value: '错误' }];
      }
      questions.push({
        type: currentQ.type,
        content: currentQ.content,
        options: JSON.stringify(currentOptions),
        answer: currentQ.answer,
        analysis: currentQ.analysis || '',
        tags: []
      });
    }
  }
  
  return { questions };
}

// ===== 分隔符格式尝试解析 =====
function tryParseDelimited(content, delimiter) {
  const lines = content.split('\n').filter(l => l.trim());
  if (lines.length < 1) return { questions: [], quality: 0 };
  
  const typeNames = { '单选': 'single', '多选': 'multiple', '判断': 'judge' };
  
  const questions = [];
  let validCount = 0;
  
  for (const line of lines) {
    if (!line.trim()) continue;
    
    const parts = line.split(delimiter).map(s => s.trim()).filter(Boolean);
    if (parts.length < 2) continue;
    
    let type = 'single';
    let content = '';
    let answer = '';
    let options = [];
    let analysis = '';
    let tags = [];
    let startIdx = 0;
    
    // 检测第一列是否是题型标识
    const first = parts[0].toLowerCase();
    if (typeNames[first]) {
      type = typeNames[first];
      startIdx = 1;
    } else if (/判断|对错/i.test(first)) {
      type = 'judge';
      startIdx = 1;
    } else if (/多选/i.test(first)) {
      type = 'multiple';
      startIdx = 1;
    }
    
    // 提取内容
    let maxLen = 0;
    for (let i = startIdx; i < parts.length; i++) {
      const p = parts[i];
      if (p.length > maxLen && p.length > 5) {
        if (!/^(?:答案|answer)?[：:\s]*([A-Da-d]{1,4}|[对错正确错误])$/i.test(p)) {
          maxLen = p.length;
          content = p;
        }
      }
    }
    
    if (!content) continue;
    
    // 智能提取答案
    answer = extractAnswer(parts, startIdx, type);
    if (!answer) continue;
    
    // 提取选项
    options = extractOptions(parts, startIdx);
    
    if (type === 'judge' && options.length === 0) {
      options = [{ key: 'A', value: '正确' }, { key: 'B', value: '错误' }];
    }
    
    // 提取解析
    for (const p of parts) {
      if (/^(解析|analysis|说明)[:：\s]*/i.test(p)) {
        analysis = p.replace(/^(解析|analysis|说明)[:：\s]*/i, '');
        break;
      }
    }
    
    // 提取标签
    for (const p of parts) {
      if (/^(标签|tags|category)[:：\s]*/i.test(p)) {
        tags = p.replace(/^(标签|tags|category)[:：\s]*/i, '').split(/[,，]/).map(t => t.trim()).filter(Boolean);
        break;
      }
    }
    
    if (content && answer) {
      questions.push({ type, content, options: JSON.stringify(options), answer, analysis, tags });
      validCount++;
    }
  }
  
  const quality = lines.length > 0 ? validCount / lines.length : 0;
  
  return { questions, quality };
}

// 智能提取答案
function extractAnswer(parts, startIdx, type) {
  for (let i = parts.length - 1; i >= startIdx; i--) {
    const p = parts[i].trim();
    
    const ansPatterns = [
      /^(?:答案|answer|key)[:：\s]*([A-Da-d]{1,4}|[对错正确错误])$/i,
      /^(?:答案|answer)[:：]\s*"?([A-Da-d]{1,4})"?$/i
    ];
    
    for (const pattern of ansPatterns) {
      const match = p.match(pattern);
      if (match) {
        return normalizeAnswer((match[1] || p).toUpperCase(), type);
      }
    }
    
    if (/^(对|错|正确|错误)$/.test(p)) {
      return normalizeAnswer(p, type);
    }
  }
  
  return '';
}

// 智能提取选项
function extractOptions(parts, startIdx) {
  const options = [];
  const seenKeys = new Set();
  
  for (let i = startIdx; i < parts.length; i++) {
    const p = parts[i].trim();
    
    if (/^(?:答案|answer|key|解析|analysis|说明|标签|tags)[:：\s]*/i.test(p)) continue;
    
    const optMatch = p.match(/^([A-Da-d])[.、:：\s]+(.*)$/);
    if (optMatch) {
      const key = optMatch[1].toUpperCase();
      if (!seenKeys.has(key)) {
        options.push({ key, value: optMatch[2] || key });
        seenKeys.add(key);
      }
      continue;
    }
    
    if (/^[A-Da-d]$/.test(p) || /^[A-Da-d]{2,4}$/.test(p)) continue;
  }
  
  return options;
}

// 统计题目数量
function countStats(questions) {
  const stats = { total: questions.length, single: 0, multiple: 0, judge: 0, failed: 0 };
  for (const q of questions) {
    if (q.type === 'single') stats.single++;
    else if (q.type === 'multiple') stats.multiple++;
    else if (q.type === 'judge') stats.judge++;
  }
  return stats;
}

// CSV行解析（处理引号）
function parseCSVLine(line) {
  const parts = [];
  let current = '';
  let inQuotes = false;
  
  for (let i = 0; i < line.length; i++) {
    const c = line[i];
    if (c === '"') {
      inQuotes = !inQuotes;
    } else if (c === ',' && !inQuotes) {
      parts.push(current.trim());
      current = '';
    } else {
      current += c;
    }
  }
  parts.push(current.trim());
  
  return parts;
}

// 管道符/Tab分隔格式解析
function parsePipeDelimited(content, delimiter) {
  const questions = [];
  const lines = content.split('\n').filter(l => l.trim());
  const typeNames = { '单选': 'single', '多选': 'multiple', '判断': 'judge', 'single': 'single', 'multiple': 'multiple', 'judge': 'judge' };
  
  for (const line of lines) {
    try {
      const parts = line.split(delimiter).map(s => s.trim()).filter(Boolean);
      if (parts.length < 2) continue;
      
      let type = 'single';
      let content = '';
      let answer = '';
      let options = [];
      let analysis = '';
      let tags = [];
      let startIdx = 0;
      
      // 检查第一列是否是题型
      const first = parts[0].toLowerCase();
      if (typeNames[first]) {
        type = typeNames[first];
        startIdx = 1;
      } else if (/判断|对错/i.test(first)) {
        type = 'judge';
        startIdx = 1;
      } else if (/多选/i.test(first)) {
        type = 'multiple';
        startIdx = 1;
      }
      
      if (!content) continue;
      
      // 查找答案
      for (let i = parts.length - 1; i >= startIdx; i--) {
        const p = parts[i];
        // 答案格式: 答案:D 或 D 或 正确:对
        const ansMatch = p.match(/^(?:答案|answer)?[：:\s]*([A-Da-d]{1,4}|[对错正确错误])$/i);
        if (ansMatch) {
          answer = ansMatch[1].toUpperCase();
          if (/^[对错]$/.test(answer)) {
            answer = answer === '对' ? 'A' : 'B';
          } else if (/正确/.test(answer)) {
            answer = 'A';
          } else if (/错误/.test(answer)) {
            answer = 'B';
          }
          break;
        }
        // 单个字母在最后
        if (/^[A-Da-d]$/.test(p) && !answer) {
          answer = p.toUpperCase();
        }
        // 多个字母（多选）
        if (/^[A-Da-d]{2,4}$/.test(p) && !answer) {
          answer = p.toUpperCase();
        }
      }
      
      // 提取选项
      for (let i = startIdx + 1; i < parts.length; i++) {
        const p = parts[i];
        if (/^答案|answer/i.test(p)) continue;
        
        // 选项格式: A. xxx 或 A、xxx 或 A:xxx 或 A xxx
        const optMatch = p.match(/^([A-Da-d])[.、:：\s]+(.*)$/);
        if (optMatch) {
          options.push({ key: optMatch[1].toUpperCase(), value: optMatch[2] || optMatch[1] });
        } else if (/^[A-Da-d]$/.test(p)) {
          // 单字母可能是答案，跳过
          continue;
        } else if (/^[A-Da-d]{2,4}$/.test(p)) {
          // 多字母可能是答案，跳过
          continue;
        }
      }
      
      // 查找解析
      for (const p of parts) {
        if (/^解析|^analysis/i.test(p)) {
          analysis = p.replace(/^解析[：:\s]*/i, '');
          break;
        }
      }
      
      // 查找标签
      for (const p of parts) {
        if (/^标签|^tags/i.test(p)) {
          tags = p.replace(/^标签[：:\s]*/i, '').split(/[,，]/).map(t => t.trim()).filter(Boolean);
          break;
        }
      }
      
      // 判断题处理
      if (type === 'judge') {
        options = [{ key: 'A', value: '正确' }, { key: 'B', value: '错误' }];
        if (['对', '错', '正确', '错误'].includes(answer)) {
          answer = /^(对|正确)$/.test(answer) ? 'A' : 'B';
        }
      }
      
      if (content && answer) {
        questions.push({ type, content, options: JSON.stringify(options), answer, analysis, tags });
      }
    } catch(e) {
      console.warn('行解析失败:', e);
    }
  }
  
  return questions;
}

function parseJSONQuestions(arr) {
  const questions = [];
  const typeNames = { '单选': 'single', '多选': 'multiple', '判断': 'judge', 'single': 'single', 'multiple': 'multiple', 'judge': 'judge' };
  
  for (const item of arr) {
    try {
      // 支持多种JSON格式
      const type = typeNames[item.type] || typeNames[item.题型] || 'single';
      const content = item.content || item.题干 || item.question || item.title || '';
      let answer = (item.answer || item.答案 || item.an || '').toString().toUpperCase();
      
      // 处理选项
      let options = [];
      if (item.options) {
        if (Array.isArray(item.options)) {
          options = item.options.map((o, i) => {
            if (typeof o === 'string') {
              return { key: String.fromCharCode(65 + i), value: o };
            }
            return { key: o.key || o.label || String.fromCharCode(65 + i), value: o.value || o.text || o };
          });
        } else if (typeof item.options === 'object') {
          options = Object.entries(item.options).map(([k, v]) => ({ key: k.toUpperCase(), value: v }));
        }
      } else if (item.A || item.B || item.C || item.D) {
        // Excel列格式
        if (item.A) options.push({ key: 'A', value: item.A });
        if (item.B) options.push({ key: 'B', value: item.B });
        if (item.C) options.push({ key: 'C', value: item.C });
        if (item.D) options.push({ key: 'D', value: item.D });
      }
      
      // 判断题自动生成选项
      if (type === 'judge' && options.length === 0) {
        options = [{ key: 'A', value: '正确' }, { key: 'B', value: '错误' }];
        if ('对错正确错误'.includes(answer)) {
          answer = answer === '对' || answer === '正确' ? 'A' : 'B';
        }
      }
      
      const analysis = item.analysis || item.解析 || item.desc || '';
      const tags = item.tags || item.标签 || [];
      
      if (content && answer) {
        questions.push({ 
          type, 
          content, 
          options: JSON.stringify(options), 
          answer, 
          analysis: analysis.toString(),
          tags: Array.isArray(tags) ? tags : []
        });
      }
    } catch(e) {
      console.warn('解析JSON题目失败:', e);
    }
  }
  
  questions.format = 'JSON';
  return questions;
}

      </div>
    `;
    result.style.display = 'block';
  }
}

// ===== 数据库导入功能 =====
function openDatabaseImport() {
  if (!_superAdminSession) {
    showToast('请先验证超级管理员', 'error');
    openSuperAdminLogin();
    return;
  }
  openModal('📥 导入数据库', `
    <div style="padding:8px 0">
      <div style="background:#fef3c7;border-radius:8px;padding:16px;margin-bottom:20px">
        <div style="font-size:32px;margin-bottom:8px;text-align:center">⚠️</div>
        <div style="font-size:0.85rem;color:#92400e;line-height:1.6;text-align:center">
          <strong>警告：导入将覆盖现有数据！</strong><br>
          建议在导入前先导出当前数据作为备份
        </div>
      </div>
      
      <div style="margin-bottom:16px">
        <label style="font-size:0.85rem;color:var(--text2);display:block;margin-bottom:6px">选择备份文件 (.json)</label>
        <input type="file" id="importFileInput" accept=".json" style="width:100%;padding:10px;border:1px solid var(--border);border-radius:8px"
               onchange="previewImportFile(this)">
      </div>
      
      <div id="importPreview" style="display:none;margin-bottom:16px">
        <div style="font-size:0.85rem;font-weight:600;margin-bottom:8px">📋 备份文件预览</div>
        <div style="background:var(--bg);border-radius:8px;padding:12px;font-size:0.8rem">
          <div>版本: <span id="importVersion">-</span></div>
          <div>导出时间: <span id="importTime">-</span></div>
          <div style="margin-top:8px">包含数据:</div>
          <div id="importCounts" style="color:var(--text2)">-</div>
        </div>
      </div>
      
      <div style="margin-bottom:16px">
        <label style="font-size:0.85rem;font-weight:600;display:block;margin-bottom:8px">导入选项</label>
        <div style="display:flex;flex-direction:column;gap:8px">
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="importQuestions" checked> 📚 题库
          </label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="importStudents"> 👥 学生账号
          </label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="importRecords"> 📝 答题记录
          </label>
          <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
            <input type="checkbox" id="importExams"> 📋 考试记录
          </label>
        </div>
      </div>
      
      <div id="importProgress" style="display:none;margin-bottom:16px;text-align:center">
        <div class="spinner"></div>
        <div style="font-size:0.85rem;color:var(--text2);margin-top:8px">正在导入数据...</div>
      </div>
      
      <button class="btn btn-success" id="doImportBtn" style="width:100%" onclick="doDatabaseImport()" disabled>
        ⚠️ 确认导入（将覆盖数据）
      </button>
    </div>
  `, 'md');
}

function previewImportFile(input) {
  const file = input.files[0];
  if (!file) return;
  
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = JSON.parse(e.target.result);
      
      document.getElementById('importVersion').textContent = data.version || '未知';
      document.getElementById('importTime').textContent = data.exportTime ? new Date(data.exportTime).toLocaleString() : '未知';
      
      const counts = [];
      if (data.questions?.length) counts.push(`题库 ${data.questions.length} 道`);
      if (data.students?.length) counts.push(`学生 ${data.students.length} 名`);
      if (data.records?.length) counts.push(`记录 ${data.records.length} 条`);
      if (data.exams?.length) counts.push(`考试 ${data.exams.length} 场`);
      document.getElementById('importCounts').textContent = counts.join(' | ') || '无数据';
      
      document.getElementById('importPreview').style.display = 'block';
      document.getElementById('doImportBtn').disabled = false;
      
      window._importData = data;
    } catch(err) {
      showToast('文件格式错误: ' + err.message, 'error');
      input.value = '';
    }
  };
  reader.readAsText(file);
}

async function doDatabaseImport() {
  const data = window._importData;
  if (!data) {
    showToast('请先选择备份文件', 'error');
    return;
  }
  
  const options = {
    questions: document.getElementById('importQuestions').checked,
    students: document.getElementById('importStudents').checked,
    records: document.getElementById('importRecords').checked,
    exams: document.getElementById('importExams').checked
  };
  
  if (!Object.values(options).some(v => v)) {
    showToast('请至少选择一项导入', 'error');
    return;
  }
  
  if (!confirm('确定要导入数据吗？这将覆盖现有的相关数据！')) return;
  
  const btn = document.getElementById('doImportBtn');
  const progress = document.getElementById('importProgress');
  btn.disabled = true;
  progress.style.display = 'block';
  
  try {
    const res = await fetch(`${API_BASE}/superadmin/import`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Token': API_TOKEN },
      body: JSON.stringify({ data, options, sessionToken: _superAdminSession })
    });
    const result = await res.json();
    
    if (result.error) {
      throw new Error(result.error);
    }
    
    closeModal();
    showToast(`导入成功！题库(${result.questionsCount}) 学生(${result.studentsCount}) 记录(${result.recordsCount}) 考试(${result.examsCount})`, 'success');
    
  } catch(e) {
    btn.disabled = false;
    showToast('导入失败: ' + (e.message || '未知错误'), 'error');
  } finally {
    progress.style.display = 'none';
  }
}


initTheme();
init();
</script>
</body>
</html>
