async function renderPracticeSub() {
  const container = document.getElementById('practiceSubContent');
  if (!container) return;
  
  // 检查用户登录状态
  if (!currentUser) {
    container.innerHTML = '<div class="empty-state"><p>请先登录</p></div>';
    return;
  }
  
  // 初始化题目数据（首次加载，且不是错题/复习模式）
  if (!practiceQuestions || practiceQuestions.length === 0) {
    container.innerHTML = `<div style="text-align:center;padding:40px"><div class="spinner-lg" style="margin:0 auto"></div><div style="margin-top:12px;color:var(--text2)">加载题目...</div></div>`;
    
    // 保存当前模式，以便重新加载后恢复
    const savedMode = practiceMode || 'all';
    
    const allQ = await dbSelect('questions', { eq: { level: currentLevel }, order: ['id', false] });
    allQuestions = allQ || [];  // 缓存到全局变量
    
    const records = await dbSelect('records', { eq: { student_id: currentUser.username }, cacheBypass: true });
    
    // 预加载收藏状态（统一使用字符串键，根据最新记录确定状态）
    const latestRecordByQ = {};
    records.forEach(r => {
      const existing = latestRecordByQ[r.question_id];
      if (!existing || new Date(r.created_at) > new Date(existing.created_at)) {
        latestRecordByQ[r.question_id] = r;
      }
    });
    
    // 初始化全局收藏状态缓存（跨模式共享）
    _favStatusByQId = {};
    Object.entries(latestRecordByQ).forEach(([qId, r]) => {
      _favStatusByQId[String(qId)] = !!r.is_fav;
    });
    
    // 先初始化 practiceAnswered
    practiceAnswered = {};
    Object.entries(latestRecordByQ).forEach(([qId, r]) => {
      const key = String(qId);
      practiceAnswered[key] = { isFav: !!r.is_fav };
    });
    
    // 根据 savedMode 过滤题目
    practiceMode = savedMode;
    if (savedMode === 'fav') {
      // 收藏模式：只显示收藏的题目
      const favQIds = Object.entries(latestRecordByQ)
        .filter(([, r]) => r.is_fav)
        .map(([qId]) => Number(qId));
      practiceQuestions = (allQ || []).filter(q => favQIds.includes(Number(q.id)));
    } else if (savedMode === 'random') {
      // 随机模式：打乱顺序
      practiceQuestions = [...(allQ || [])].sort(() => Math.random() - 0.5);
    } else {
      // 全部模式
      practiceQuestions = allQ || [];
    }
    
    practiceMultiSelected = {};
    practiceIndex = 0;
  }
  
  // 渲染刷题界面
  const modes = [
    { key: 'all', label: '全部', icon: '📝' },
    { key: 'fav', label: '收藏', icon: '⭐' },
    { key: 'random', label: '随机', icon: '🎲' }
  ];
  const modeBtns = modes.map(m => `<button class="mode-btn ${practiceMode===m.key?'active':''}" onclick="switchPracticeMode('${m.key}')">${m.icon} ${m.label}</button>`).join('');
  const headerHtml = `<div class="practice-modes">${modeBtns}</div>`;
  
  container.innerHTML = `
    <div id="homeworkBanner"></div>
    ${headerHtml}
    <div id="practiceCardArea"></div>
  `;
  loadStudentHomework();
  renderPracticeCard();
}

async function switchPracticeMode(mode) {
  practiceMode = mode;
  practiceIndex = 0;
  practiceMultiSelected = {};
  practiceAnswered = {}; // 切换模式时清除答题状态，允许重新做题
  clearPracticeProgress(); // 清除保存的进度

  // 更新按钮样式
  document.querySelectorAll('.practice-modes .mode-btn').forEach(btn => {
    btn.classList.remove('active');
  });
  const activeBtn = document.querySelector(`.practice-modes .mode-btn[onclick="switchPracticeMode('${mode}')"]`);
  if (activeBtn) activeBtn.classList.add('active');

  // 使用缓存的题目列表（避免重复查询数据库）
  if (allQuestions.length === 0) {
    const allQ = await dbSelect('questions', { eq: { level: currentLevel }, order: ['id', false] });
    allQuestions = allQ || [];
  }
  const allQ = allQuestions;

  // 从全局收藏状态缓存获取（toggleFav 已更新）
  // _favStatusByQId 是跨模式共享的，切换模式不会丢失
  const localFavStatus = { ..._favStatusByQId };
  
  // 同时从 _recordBuffer 获取最新的收藏状态（可能有刚收藏但还没更新到 _favStatusByQId 的情况）
  _recordBuffer.forEach(r => {
    localFavStatus[String(r.question_id)] = r.is_fav;
  });
  
  // 切换模式时只在本地同步数据，不触发云端同步
  // 云端同步只在这些情况触发：10分钟定时、手动同步按钮、缓冲区满50条、考试模式、页面关闭

  switch(mode) {
    case 'fav': {
      // 从本地收藏状态筛选收藏的题目
      const favQIds = Object.entries(localFavStatus)
        .filter(([, isFav]) => isFav)
        .map(([qId]) => Number(qId));
      practiceQuestions = allQ.filter(q => favQIds.includes(Number(q.id)));
      
      // 如果本地没有收藏数据，显示提示
      if (practiceQuestions.length === 0) {
        // 显示空状态
        const area = document.getElementById('practiceCardArea');
        if (area) {
          area.innerHTML = `<div class="empty-state"><p>暂无收藏题目</p><p style="font-size:0.85rem;color:var(--text2);margin-top:8px">在刷题时点击☆收藏题目</p></div>`;
        }
        return;
      }
      
      // 预加载收藏状态
      practiceQuestions.forEach(q => {
        const key = String(q.id);
        practiceAnswered[key] = { isFav: localFavStatus[key] ?? false };
      });
      break;
    }
    case 'random': {
      practiceQuestions = [...allQ].sort(() => Math.random() - 0.5);
      // 预加载收藏状态
      practiceQuestions.forEach(q => {
        const key = String(q.id);
        practiceAnswered[key] = { isFav: localFavStatus[key] ?? false };
      });
      break;
    }
    default:
      practiceQuestions = allQ;
      // 预加载收藏状态
      practiceQuestions.forEach(q => {
        const key = String(q.id);
        practiceAnswered[key] = { isFav: localFavStatus[key] ?? false };
      });
  }
  // Check for saved progress when switching back to 'all' mode
  if (mode === 'all') {
    const saved = loadPracticeProgress();
    if (saved && saved.total === allQ.length && saved.firstQId === allQ[0]?.id && saved.index > 0) {
      renderPracticeCard();
      showContinueDialog(saved);
      return;
    }
  }
  renderPracticeCard();
}

function renderPracticeCard() {
  const area = document.getElementById('practiceCardArea');
  if (!practiceQuestions.length) {
    area.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>暂无题目</p></div>';
    return;
  }
  if (practiceIndex >= practiceQuestions.length) {
    area.innerHTML = `<div style="text-align:center;padding:40px">
      <div style="font-size:64px;margin-bottom:16px">🎉</div>
      <div style="font-size:1.2rem;font-weight:600;margin-bottom:8px">恭喜完成！</div>
      <div style="color:var(--text2);margin-bottom:20px">你已完成所有题目</div>
      <button class="btn btn-primary" onclick="practiceIndex=0;practiceAnswered={};practiceMultiSelected={};clearPracticeProgress();renderPracticeCard()">重新开始</button>
    </div>`;
    showConfetti();
    return;
  }

  const q = practiceQuestions[practiceIndex];
  // 确保 ID 存在（兼容错题数据中的 question_id 字段）
  // 统一使用字符串键确保收藏状态一致性
  const qId = String(q.id || q.question_id);
  const answered = practiceAnswered[qId];
  const progress = ((practiceIndex + 1) / practiceQuestions.length * 100).toFixed(1);

  // Normalize options
  let options = (q.options || []).map((o, i) => ({
    letter: o.key || o.label || String.fromCharCode(65 + i),
    text: o.value || o.text || ''
  }));
  if (q.type === 'judge' && options.length === 0) {
    options = [{ letter: 'A', text: '正确' }, { letter: 'B', text: '错误' }];
  }

  const typeMap = { single: ['单选', 'tag-blue'], multiple: ['多选', 'tag-purple'], judge: ['判断', 'tag-green'] };
  const [typeLabel, typeClass] = typeMap[q.type] || ['未知', 'tag-gray'];
  const isMulti = q.type === 'multiple';
  const multiSel = practiceMultiSelected[qId] || {};

  const isAnswered = answered && answered.isCorrect !== undefined;
  const optHtml = options.map((opt, oi) => {
    let cls = 'opt-btn';
    let icon = '';
    if (isAnswered) {
      const userAns = answered.answer || '';
      const correctAns = q.answer || '';
      if (userAns.includes(opt.letter)) {
        cls += correctAns.includes(opt.letter) ? ' correct' : ' wrong';
        icon = correctAns.includes(opt.letter) ? '<span class="opt-icon">✓</span>' : '<span class="opt-icon">✗</span>';
      } else if (correctAns.includes(opt.letter) && !userAns.includes(opt.letter)) {
        cls += ' show-correct';
        icon = '<span class="opt-icon">✓</span>';
      }
    } else if (isMulti && multiSel[opt.letter]) {
      cls += ' selected';
    }
    return `<button class="${cls}" data-idx="${oi}" data-letter="${opt.letter}" onclick="answerPractice('${qId}','${opt.letter}')">${icon}<span>${opt.letter}. ${escHtml(opt.text)}</span></button>`;
  }).join('');

  const favActive = answered?.isFav ? 'active' : '';
  const analysisHtml = isAnswered && q.analysis ? `
    <div class="analysis-box"><span class="analysis-icon">💡</span>${escHtml(q.analysis)}</div>
  ` : '';
  const multiConfirmHtml = isMulti && !isAnswered ? `<div class="confirm-submit-bar"><button class="multi-confirm-btn" onclick="confirmMultiAnswer('${qId}')">确认提交</button></div>` : '';

  area.innerHTML = `
    <div class="practice-card">
      <div class="progress-bar"><div class="progress-fill" style="width:${progress}%"></div></div>
      <div class="progress-text">第${practiceIndex+1}/${practiceQuestions.length}题</div>
      <span class="tag ${typeClass} q-type-tag">${typeLabel}</span>
      <div class="q-content">${escHtml(q.content)}</div>
      <div id="optionsArea">${optHtml}</div>
      ${multiConfirmHtml}
      ${analysisHtml}
      <div class="practice-actions">
        <button class="btn btn-outline" onclick="practicePrev()" ${practiceIndex===0?'disabled':''}>上一题</button>
        <button class="btn fav-btn ${favActive}" onclick="toggleFav('${qId}')" aria-label="收藏">${answered?.isFav?'⭐':'☆'}</button>
        <button class="btn btn-primary" onclick="practiceNext()">下一题</button>
      </div>
    </div>
  `;
}

// 统一答案比较：多选题去除分隔符后排序比较
function checkAnswer(userAnswer, correctAnswer, questionType) {
  if (!userAnswer || !correctAnswer) return false;
  if (questionType === 'multiple') {
    const normalize = s => String(s).replace(/[,，、\s]/g, '').split('').sort().join('');
    return normalize(userAnswer) === normalize(correctAnswer);
  }
  return String(userAnswer) === String(correctAnswer);
}

function answerPractice(qId, letter) {
  // 兼容 question_id 和 id 两种格式，使用 == 进行类型宽松比较
  const q = practiceQuestions.find(x => x.id == qId || x.question_id == qId);
  if (!q) return;
  
  // 使用统一的字符串键（优先使用 id，其次使用 question_id）
  const actualQId = String(q.id || q.question_id);

  if (q.type === 'multiple') {
    // Multi-select: toggle selection - update DOM locally, no full re-render
    if (!practiceMultiSelected[actualQId]) practiceMultiSelected[actualQId] = {};
    practiceMultiSelected[actualQId][letter] = !practiceMultiSelected[actualQId][letter];
    // Update only the clicked option button's CSS class
    const btn = document.querySelector(`#optionsArea .opt-btn[data-letter="${letter}"]`);
    if (btn) {
      if (practiceMultiSelected[actualQId][letter]) {
        btn.classList.add('selected');
      } else {
        btn.classList.remove('selected');
      }
    }
    return;
  }

  // Single/Judge: immediate answer - full re-render to show result
  if (practiceAnswered[actualQId] && practiceAnswered[actualQId].isCorrect !== undefined) return;

  const isCorrect = checkAnswer(letter, q.answer, q.type);
  practiceAnswered[actualQId] = { answer: letter, isCorrect, isFav: practiceAnswered[actualQId]?.isFav || false };
  
  // 保存答题记录（保留现有收藏状态）
  const currentFav = practiceAnswered[actualQId]?.isFav || false;
  bufferRecord({ student_id: currentUser.username, question_id: actualQId, is_correct: isCorrect, user_answer: letter, is_fav: currentFav });
  
  addXp(isCorrect ? XP_REWARDS.correct : XP_REWARDS.wrong, isCorrect ? '答对' : '答题');
  // 记录答题日志（节流，每10题记录一次）
  if (Object.keys(practiceAnswered).length % 10 === 0) {
    recordLog('answer', { count: Object.keys(practiceAnswered).length });
  }
  renderPracticeCard();
  savePracticeProgress();
}

function confirmMultiAnswer(qId) {
  // 兼容 question_id 和 id 两种格式，使用 == 进行类型宽松比较
  const q = practiceQuestions.find(x => x.id == qId || x.question_id == qId);
  if (!q) return;
  const actualQId = String(q.id || q.question_id);
  
  const sel = practiceMultiSelected[actualQId] || {};
  const answer = Object.keys(sel).filter(k => sel[k]).sort().join(',');
  if (!answer) { showToast('请先选择答案', 'info'); return; }
  const isCorrect = checkAnswer(answer, q.answer, 'multiple');
  practiceAnswered[actualQId] = { answer, isCorrect, isFav: practiceAnswered[actualQId]?.isFav || false };
  delete practiceMultiSelected[actualQId];
  
  // 保存答题记录（保留现有收藏状态）
  const currentFav = practiceAnswered[actualQId]?.isFav || false;
  bufferRecord({ student_id: currentUser.username, question_id: actualQId, is_correct: isCorrect, user_answer: answer, is_fav: currentFav });
  
  addXp(isCorrect ? XP_REWARDS.correct : XP_REWARDS.wrong, isCorrect ? '答对' : '答题');
  renderPracticeCard();
  savePracticeProgress();
}

async function toggleFav(qId) {
  // 统一使用字符串键
  const qIdStr = String(qId);
  
  // 先检查收藏缓冲区，合并最新状态
  let currentFavStatus = null;
  for (const [recordId, update] of Object.entries(_favBuffer)) {
    if (String(update.question_id) === qIdStr) {
      currentFavStatus = update.is_fav;
      break;
    }
  }
  
  // 优先使用全局收藏状态缓存（避免数据库查询导致的转圈）
  if (currentFavStatus === null && _favStatusByQId[qIdStr] !== undefined) {
    currentFavStatus = _favStatusByQId[qIdStr];
  }
  
  // 再检查 practiceAnswered 缓存
  if (currentFavStatus === null && practiceAnswered[qIdStr] && practiceAnswered[qIdStr].isFav !== undefined) {
    currentFavStatus = practiceAnswered[qIdStr].isFav;
  }
  
  // Check local buffer first
  const bufferedRecord = _recordBuffer.find(r => String(r.question_id) === qIdStr);
  let records = [];
  if (bufferedRecord) {
    records = [bufferedRecord];
  } else if (currentFavStatus !== null) {
    // 有缓存状态，不需要查询数据库，直接使用缓存
    records = [{ question_id: qIdStr, is_fav: currentFavStatus }];
  } else {
    // 无缓存，查询数据库（使用 cacheOnly 避免显示 loading）
    records = await dbSelect('records', { eq: { student_id: currentUser.username, question_id: qIdStr }, cacheOnly: true }) || [];
    // 如果缓存也没有，尝试不带 cacheOnly 查询
    if (records.length === 0) {
      records = await dbSelect('records', { eq: { student_id: currentUser.username, question_id: qIdStr } });
    }
  }
  
  if (records.length > 0) {
    const latest = records.reduce((a, b) => new Date(a.created_at || 0) > new Date(b.created_at || 0) ? a : b);
    // 使用缓冲区中的最新收藏状态，而不是数据库中的旧值
    const baseIsFav = currentFavStatus !== null ? currentFavStatus : (latest.is_fav || false);
    const isFav = !baseIsFav;
    
    if (latest.id) {
      // 使用缓冲机制，与其他操作一起批量同步
      bufferFavUpdate(latest.id, isFav, qIdStr);
    } else {
      // Record is in buffer, update it locally
      latest.is_fav = isFav;
    }
    // 更新全局收藏状态缓存（跨模式共享）
    _favStatusByQId[qIdStr] = isFav;
    if (!practiceAnswered[qIdStr]) practiceAnswered[qIdStr] = {};
    practiceAnswered[qIdStr].isFav = isFav;
    if (isFav) addXp(XP_REWARDS.fav, '收藏');
    
    // 在收藏夹模式下取消收藏时，立即从列表中移除该题目
    if (practiceMode === 'fav' && !isFav) {
      const idx = practiceQuestions.findIndex(q => String(q.id || q.question_id) === qIdStr);
      if (idx !== -1) {
        practiceQuestions.splice(idx, 1);
        // 如果移除的是当前题目，调整索引
        if (idx < practiceIndex) {
          practiceIndex--;
        } else if (idx === practiceIndex && practiceIndex >= practiceQuestions.length) {
          practiceIndex = Math.max(0, practiceQuestions.length - 1);
        }
      }
      // 重新渲染整个练习界面
      renderPracticeCard();
    } else {
      // 其他情况只刷新当前卡片
      renderPracticeCard();
    }
  } else {
    // 新建收藏记录，进入缓冲区统一处理
    const newRecord = { student_id: currentUser.username, question_id: qIdStr, is_correct: false, user_answer: '', is_fav: true };
    _recordBuffer.push(newRecord);
    // 更新全局收藏状态缓存
    _favStatusByQId[qIdStr] = true;
    if (!practiceAnswered[qIdStr]) practiceAnswered[qIdStr] = {};
    practiceAnswered[qIdStr].isFav = true;
    addXp(XP_REWARDS.fav, '收藏');
    // 立即刷新卡片以更新收藏按钮状态
    renderPracticeCard();
    if (_recordBuffer.length >= RECORD_BUFFER_MAX_SIZE) flushRecordBuffer();
  }
}

// ===== Practice progress memory =====
function savePracticeProgress() {
  if (practiceMode !== 'all') return;
  const key = `practice_progress_${currentUser.username}_${currentLevel}`;
  localStorage.setItem(key, JSON.stringify({
    index: practiceIndex,
    total: practiceQuestions.length,
    firstQId: practiceQuestions[0]?.id || null,
    timestamp: Date.now()
  }));
}
function loadPracticeProgress() {
  const key = `practice_progress_${currentUser.username}_${currentLevel}`;
  const data = localStorage.getItem(key);
  if (!data) return null;
  try { return JSON.parse(data); } catch { return null; }
}
function clearPracticeProgress() {
  const key = `practice_progress_${currentUser.username}_${currentLevel}`;
  localStorage.removeItem(key);
}

function showContinueDialog(saved) {
  const idx = saved.index;
  const total = saved.total;
  const pct = ((idx / total) * 100).toFixed(0);
  const timeStr = saved.timestamp ? new Date(saved.timestamp).toLocaleString('zh-CN', {month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
  const overlay = document.createElement('div');
  overlay.id = 'continue-overlay';
  overlay.style.cssText = 'position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.45);z-index:300;display:flex;align-items:center;justify-content:center;padding:20px';
  overlay.innerHTML = `
    <div style="background:var(--card);border-radius:16px;padding:28px 24px;width:100%;max-width:340px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.2);position:relative">
      <button onclick="dismissContinueDialog()" style="position:absolute;top:12px;right:12px;background:none;border:none;font-size:1.2rem;color:var(--text3);cursor:pointer;padding:4px;line-height:1">✕</button>
      <div style="font-size:48px;margin-bottom:12px">📖</div>
      <div style="font-size:1.15rem;font-weight:700;margin-bottom:8px;color:var(--text1)">发现学习记录</div>
      <div style="color:var(--text2);font-size:.875rem;margin-bottom:6px">上次做到第 <b style="color:var(--primary)">${idx + 1}</b> / ${total} 题 (${pct}%)</div>
      ${timeStr ? `<div style="color:var(--text3);font-size:.75rem;margin-bottom:18px">${timeStr}</div>` : '<div style="margin-bottom:18px"></div>'}
      <div style="display:flex;gap:12px">
        <button onclick="continueFromStart()" style="flex:1;padding:12px;border-radius:10px;border:1.5px solid var(--border);background:var(--card);color:var(--text1);font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s">从头开始</button>
        <button onclick="continueFromSaved(${idx})" style="flex:1;padding:12px;border-radius:10px;border:none;background:linear-gradient(135deg,var(--primary),var(--primary-dark));color:#fff;font-size:.9rem;font-weight:600;cursor:pointer;transition:all .15s;box-shadow:0 4px 12px rgba(79,108,255,.3)">继续做题</button>
      </div>
    </div>
  `;
  document.body.appendChild(overlay);
  // Allow clicking outside the dialog box to dismiss
  overlay.addEventListener('click', (e) => { if (e.target === overlay) dismissContinueDialog(); });
}
function dismissContinueDialog() {
  const overlay = document.getElementById('continue-overlay');
  if (overlay) overlay.remove();
  practiceIndex = 0;
  renderPracticeCard();
}
function continueFromStart() {
  document.getElementById('continue-overlay')?.remove();
  practiceIndex = 0;
  clearPracticeProgress();
  renderPracticeCard();
}
function continueFromSaved(idx) {
  document.getElementById('continue-overlay')?.remove();
  practiceIndex = idx;
  renderPracticeCard();
  savePracticeProgress();
}

function practicePrev() { if (practiceIndex > 0) { practiceIndex--; renderPracticeCard(); savePracticeProgress(); } }
function practiceNext() { if (practiceIndex < practiceQuestions.length - 1) { practiceIndex++; renderPracticeCard(); savePracticeProgress(); } else { practiceIndex = practiceQuestions.length; renderPracticeCard(); savePracticeProgress(); } }

      <div class="mock-summary-row"><span>题源</span><strong>${{all:'全部题目',wrong:'仅错题',fav:'仅收藏',new:'未做过'}[mockSettings.source]}</strong></div>

async function startMockExam() {
  // 检查用户登录状态
  if (!currentUser) {
    showToast('请先登录', 'error');
    return;
  }
  
  showLoading();

  // Fetch questions filtered by student's level
  const allQ = await dbSelect('questions', { eq: { level: currentLevel }, order: ['id', false] });
  const records = await dbSelect('records', { eq: { student_id: currentUser.username }, cacheBypass: true });

  // Filter by source
  let pool = [...allQ];
  switch (mockSettings.source) {
    case 'wrong': {
      const wrongQIds = [...new Set(records.filter(r => !r.is_correct).map(r => r.question_id))];
      pool = allQ.filter(q => wrongQIds.includes(q.id));
      break;
    }
    case 'fav': {
      const favQIds = [...new Set(records.filter(r => r.is_fav).map(r => r.question_id))];
      pool = allQ.filter(q => favQIds.includes(q.id));
      break;
    }
    case 'new': {
      const doneQIds = [...new Set(records.map(r => r.question_id))];
      pool = allQ.filter(q => !doneQIds.includes(q.id));
      break;
    }
  }

  // Filter by type
  if (mockSettings.types.length < 3) {
    pool = pool.filter(q => mockSettings.types.includes(q.type));
  }

  // Shuffle and pick
  pool = pool.sort(() => Math.random() - 0.5);
  const selected = pool.slice(0, mockSettings.count);

  hideLoading();

  if (selected.length === 0) {
    showToast('没有符合条件的题目，请调整设置', 'error');
    return;
  }
  if (selected.length < mockSettings.count) {
    showToast(`符合条件的题目只有${selected.length}题（不足${mockSettings.count}题）`, 'info');
  }

  showConfirm(`模拟考试：${selected.length}题 · ${mockSettings.duration}分钟\n开始后请勿切换页面，确认开始？`, async () => {
    // 保存模拟考试配置
    _mockExamConfig = {
      questionType: mockSettings.types.length < 3 ? mockSettings.types.join(',') : 'all',
      questionSource: mockSettings.source,
      count: mockSettings.count,
      duration: mockSettings.duration,
      passRate: mockSettings.passRate
    };
    // Set up exam state using mock exam data
    examData = {
      id: null,
      title: '模拟考试',
      isMock: true,
      duration: mockSettings.duration,
      passRate: mockSettings.passRate,
      question_ids: selected.map(q => q.id)
    };
    currentExamId = null;  // 模拟考试无exam_id
    currentExamIsMock = true;  // 模拟考试
    currentExamIsQuick = false;  // 非快捷考试
    currentExamPassRate = mockSettings.passRate;  // 模拟考试及格线
    examAnswers = {};
    fullscreenExitCount = 0;
    examRemaining = mockSettings.duration * 60;

    // Anti-cheat: disable right-click, text selection, and detect tab switching
    document.addEventListener('contextmenu', preventContextMenu);
    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';
    document.addEventListener('visibilitychange', handleVisibilityChange);

    practiceQuestions = selected;
    renderExamTaking();
  });
}

function renderFormalExamList(container) {
  const exams = _filteredStudentExams;
  const now = Date.now();
  const page = _pg.studentExam;
  const pageItems = pageSlice(exams, page);
  const list = pageItems.length ? pageItems.map(e => {
    const start = new Date(e.start_time).getTime();
    const end = new Date(e.end_time).getTime();
    const status = now < start ? 'upcoming' : now > end ? 'ended' : 'ongoing';
    const statusMap = { upcoming: ['未开始', 'tag-gray'], ongoing: ['进行中', 'tag-green'], ended: ['已结束', 'tag-red'] };
    const [label, cls] = statusMap[status];
    const qCount = (e.question_ids || []).length;
    const hasTaken = _takenExamIds.has(Number(e.id));
    let actionHtml = '';
    if (hasTaken) {
      actionHtml = '<button class="btn btn-full" style="margin-top:8px;background:var(--border);color:var(--text2);cursor:not-allowed;border:none">✅ 已参加</button>';
    } else if (status === 'ongoing') {
      actionHtml = '<button class="btn btn-primary btn-full" style="margin-top:8px" onclick="enterExam(' + e.id + ')">进入考试</button>';
    } else if (status === 'ended') {
      actionHtml = '<button class="btn btn-sm btn-outline" style="margin-top:8px" onclick="viewExamResult(' + e.id + ')">查看成绩</button>';
    }
    return '<div class="exam-list-card ' + status + '">' +
      '<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"><span class="exam-title" style="flex:1">' + escHtml(e.title) + '</span><span class="tag ' + cls + '">' + label + '</span></div>' +
      '<div class="exam-meta">📋 ' + qCount + '题 · ⏱️ ' + e.duration + '分钟</div>' +
      '<div class="exam-time">🕐 ' + formatTime(e.start_time) + ' → ' + formatTime(e.end_time) + '</div>' +
      actionHtml +
      '</div>';
  }).join('') : '<div class="empty-state"><div class="empty-icon">📋</div><p>暂无考试</p></div>';

  container.innerHTML = list + paginateHtml('studentExam', exams.length, page);
}

async function enterExam(examId) {
  const exam = allExams.find(e => e.id == examId);
  if (!exam) return;

  // Check if already submitted
  const existRecords = await dbSelect('records', { eq: { student_id: currentUser.username, exam_id: Number(examId) || examId } });
  if (existRecords.length > 0) {
    showToast('你已经参加过本次考试', 'info');
    viewExamResult(examId);
    return;
  }

  showConfirm('确认进入考试？考试期间请勿切换页面，切换2次将自动交卷。', async () => {
    examData = exam;
    currentExamId = exam.id ? Number(exam.id) : null;  // 独立保存考试ID
    currentExamIsMock = false;  // 正式考试
    currentExamIsQuick = false;  // 非快捷考试
    currentExamPassRate = 60;  // 正式考试默认及格线
    examAnswers = {};
    fullscreenExitCount = 0;
    examRemaining = exam.duration * 60;

    // Anti-cheat: disable right-click, text selection, and detect tab switching
    document.addEventListener('contextmenu', preventContextMenu);
    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';
    document.addEventListener('visibilitychange', handleVisibilityChange);

    // Load exam questions
    const allQ = await dbSelect('questions', { order: ['id', false] });
    practiceQuestions = (exam.question_ids || []).map(id => allQ.find(q => q.id == id)).filter(Boolean);

    renderExamTaking();
  });
}

let examCurrentQ = 0;

function formatMmSs(sec) {
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}

function startExamTimer() {
  if (examTimerInterval) clearInterval(examTimerInterval);
  examTimerInterval = setInterval(() => {
    examRemaining--;
    const el = document.getElementById('examTimer');
    if (el) {
      el.textContent = formatMmSs(examRemaining);
      el.classList.toggle('danger', examRemaining < 300);
    }
    if (examRemaining <= 0) {
      autoSubmitExam('考试时间到，已自动提交');
    }
  }, 1000);
}

function renderExamQuestion() {
  const q = practiceQuestions[examCurrentQ];
  if (!q) return;

  let options = (q.options || []).map((o, i) => ({
    letter: o.key || o.label || String.fromCharCode(65 + i),
    text: o.value || o.text || ''
  }));
  if (q.type === 'judge' && options.length === 0) {
    options = [{ letter: 'A', text: '正确' }, { letter: 'B', text: '错误' }];
  }

  const isMulti = q.type === 'multiple';
  const currentAns = examAnswers[q.id] || (isMulti ? {} : '');
  const isConfirmed = isMulti && currentAns._confirmed;

  const optHtml = options.map((opt, oi) => {
    let cls = 'opt-btn';
    if (isMulti) {
      if (currentAns[opt.letter]) cls += ' selected';
    } else {
      if (currentAns === opt.letter) cls += ' selected';
    }
    return `<button class="${cls}" data-idx="${oi}" data-letter="${opt.letter}" onclick="selectExamOption(${q.id},'${opt.letter}')">${opt.letter}. ${escHtml(opt.text)}</button>`;
  }).join('');

  const typeMap = { single: ['单选', 'tag-blue'], multiple: ['多选', 'tag-purple'], judge: ['判断', 'tag-green'] };
  const [typeLabel, typeClass] = typeMap[q.type] || ['', ''];

  const multiConfirmHtml = isMulti && !isConfirmed
    ? '<div style="text-align:center;color:var(--warning);font-size:0.82rem;padding:6px 0">⚠ 请选择后点击底部"确认"按钮</div>'
    : (isMulti && isConfirmed ? '<div style="text-align:center;color:var(--success);font-size:0.85rem;font-weight:600;padding:6px 0">✓ 已确认选择</div>' : '');

  document.getElementById('examBody').innerHTML = `
    <div class="practice-card" style="margin:0">
      <span class="tag ${typeClass} q-type-tag">${typeLabel}</span>
      <div class="q-content">${escHtml(q.content)}</div>
      <div>${optHtml}</div>
      ${multiConfirmHtml}
    </div>
  `;

  // Update count
  const answered = Object.values(examAnswers).filter(a => {
    if (typeof a === 'string') return a !== '';
    return Object.entries(a).some(([k, v]) => k !== '_confirmed' && v);
  }).length;
  document.getElementById('examCount').textContent = `${answered}/${practiceQuestions.length}`;
  updateExamNavBtns();
}

function selectExamOption(qId, letter) {
  const q = practiceQuestions.find(x => x.id === qId);
  if (!q) return;

  if (q.type === 'multiple') {
    if (!examAnswers[qId]) examAnswers[qId] = {};
    examAnswers[qId][letter] = !examAnswers[qId][letter];
    // Reset confirmed status when changing selection
    if (examAnswers[qId]._confirmed) {
      delete examAnswers[qId]._confirmed;
    }
    // Local DOM update only - no full re-render
    const btn = document.querySelector(`#examBody .opt-btn[data-letter="${letter}"]`);
    if (btn) {
      if (examAnswers[qId][letter]) {
        btn.classList.add('selected');
      } else {
        btn.classList.remove('selected');
      }
    }
    // Update answered count and nav
    const answered = Object.values(examAnswers).filter(a => {
      if (typeof a === 'string') return a !== '';
      return Object.entries(a).some(([k, v]) => k !== '_confirmed' && v);
    }).length;
    document.getElementById('examCount').textContent = `${answered}/${practiceQuestions.length}`;
    renderExamQNav();
    updateExamNavBtns();
  } else {
    examAnswers[qId] = letter;
    // Reset confirmed status when changing selection
    delete examAnswers[qId + '_confirmed'];
    // Local DOM update: remove selected from all, add to clicked
    const btns = document.querySelectorAll('#examBody .opt-btn');
    btns.forEach(b => {
      b.classList.remove('selected');
      if (b.dataset.letter === letter) b.classList.add('selected');
    });
    // Update answered count and nav
    const answered = Object.values(examAnswers).filter(a => {
      if (typeof a === 'string') return a !== '';
      return Object.entries(a).some(([k, v]) => k !== '_confirmed' && v);
    }).length;
    document.getElementById('examCount').textContent = `${answered}/${practiceQuestions.length}`;
    renderExamQNav();
    updateExamNavBtns();
  }
}

function confirmExamMulti(qId) {
  const sel = examAnswers[qId] || {};
  const answer = Object.keys(sel).filter(k => sel[k] && k !== '_confirmed').sort().join(',');
  if (!answer) { showToast('请先选择答案', 'info'); return; }
  // Mark as confirmed so student can see it's done
  examAnswers[qId] = { _confirmed: true, ...sel };
  showToast('已确认选择', 'success');
  // Auto advance to next question
  if (examCurrentQ < practiceQuestions.length - 1) {
    examCurrentQ++;
  }
  renderExamQuestion();
  renderExamQNav();
  updateExamNavBtns();
}

function renderExamQNav() {
  const nav = document.getElementById('examQNav');
  if (!nav) return;
  nav.innerHTML = practiceQuestions.map((q, i) => {
    const ans = examAnswers[q.id];
    let hasAns = false;
    if (ans) {
      if (typeof ans === 'string') hasAns = ans !== '';
      else {
        // Object (multi-select): check for any selected option (ignore _confirmed flag)
        hasAns = Object.entries(ans).some(([k, v]) => k !== '_confirmed' && v);
      }
    }
    let cls = 'exam-q-num';
    if (i === examCurrentQ) cls += ' current';
    else if (hasAns) cls += ' answered';
    return `<button class="${cls}" onclick="examCurrentQ=${i};renderExamQuestion();renderExamQNav();updateExamNavBtns()">${i+1}</button>`;
  }).join('');

  // Update answered count in header
  const answered = Object.values(examAnswers).filter(a => {
    if (typeof a === 'string') return a !== '';
    return Object.entries(a).some(([k, v]) => k !== '_confirmed' && v);
  }).length;
  const countEl = document.getElementById('examNavAnswered');
  if (countEl) countEl.textContent = answered;
}

function toggleExamQNav() {
  const body = document.getElementById('examQNav');
  const icon = document.getElementById('examNavToggle');
  if (!body) return;
  body.classList.toggle('collapsed');
  icon?.classList.toggle('collapsed');
}

function examGoPrev() {
  if (examCurrentQ > 0) {
    examCurrentQ--;
    renderExamQuestion();
    renderExamQNav();
    updateExamNavBtns();
  }
}

function examGoNext() {
  if (examCurrentQ < practiceQuestions.length - 1) {
    examCurrentQ++;
    renderExamQuestion();
    renderExamQNav();
    updateExamNavBtns();
  }
}

function updateExamNavBtns() {
  const prevBtn = document.getElementById('examPrevBtn');
  const nextBtn = document.getElementById('examNextBtn');
  const confirmBtn = document.getElementById('examConfirmBtn');
  if (prevBtn) prevBtn.disabled = examCurrentQ === 0;
  if (nextBtn) nextBtn.disabled = examCurrentQ >= practiceQuestions.length - 1;

  // Update confirm button state
  const q = practiceQuestions[examCurrentQ];
  if (confirmBtn && q) {
    const isMulti = q.type === 'multiple';
    const ans = examAnswers[q.id];
    if (isMulti) {
      const isConfirmed = ans?._confirmed;
      const hasSelection = ans && Object.entries(ans).some(([k, v]) => k !== '_confirmed' && v);
      if (isConfirmed) {
        confirmBtn.textContent = '已确认';
        confirmBtn.disabled = true;
      } else if (!hasSelection) {
        confirmBtn.textContent = '确认';
        confirmBtn.disabled = true;
      } else {
        confirmBtn.textContent = '确认';
        confirmBtn.disabled = false;
      }
    } else {
      // Single/judge: check confirmed state
      const hasAnswer = typeof ans === 'string' && ans !== '';
      const isConfirmed = examAnswers[q.id + '_confirmed'];
      if (isConfirmed) {
        confirmBtn.textContent = '已确认';
        confirmBtn.disabled = true;
      } else if (hasAnswer) {
        confirmBtn.textContent = '确认';
        confirmBtn.disabled = false;
      } else {
        confirmBtn.textContent = '确认';
        confirmBtn.disabled = true;
      }
    }
  }
}

function examConfirmAndNext() {
  const q = practiceQuestions[examCurrentQ];
  if (!q) return;

  if (q.type === 'multiple') {
    const sel = examAnswers[q.id] || {};
    const answer = Object.keys(sel).filter(k => sel[k] && k !== '_confirmed').sort().join(',');
    if (!answer) { showToast('请先选择答案', 'info'); return; }
    if (sel._confirmed) return; // already confirmed
    examAnswers[q.id] = { _confirmed: true, ...sel };
  } else {
    // Single/judge: check answer exists
    const ans = examAnswers[q.id];
    if (!ans || (typeof ans === 'string' && !ans)) { showToast('请先选择答案', 'info'); return; }
    // Mark as confirmed for single/judge too
    examAnswers[q.id + '_confirmed'] = true;
  }

  // Update confirm button to show confirmed state
  const confirmBtn = document.getElementById('examConfirmBtn');
  if (confirmBtn) {
    confirmBtn.textContent = '已确认';
    confirmBtn.disabled = true;
  }

  // Auto go to next question, or submit if last
  if (examCurrentQ < practiceQuestions.length - 1) {
    setTimeout(() => {
      examCurrentQ++;
      renderExamQuestion();
      renderExamQNav();
      updateExamNavBtns();
    }, 400); // Brief delay so user sees "已确认"
  } else {
    // Last question confirmed - auto submit after brief feedback
    setTimeout(() => {
      confirmSubmitExam();
    }, 600);
  }
}

function confirmSubmitExam() {
  if (_examSubmitting) return;  // Prevent double-submit
  // Count unanswered questions
  const unanswered = practiceQuestions.filter(q => {
    const a = examAnswers[q.id];
    if (!a) return true;
    if (typeof a === 'string') return a === '';
    return !Object.entries(a).some(([k, v]) => k !== '_confirmed' && v);
  }).length;

  const msg = unanswered > 0
    ? `还有${unanswered}题未作答，确定交卷？交卷后无法修改答案。`
    : '确定交卷？交卷后无法修改答案。';
  showConfirm(msg, async () => {
    _examSubmitting = true;
    exitExamMode();
    try {
      await submitExamAnswers();
    } catch(e) {
      console.error('Exam submit failed:', e);
      showToast('提交失败，请检查网络后重试', 'error');
      _examSubmitting = false;
    }
  });
}

async function submitExamAnswers() {
  const records = [];
  let correct = 0;
  // For quick exam guests, use phone as student_id
  const studentId = currentExamIsQuick && quickExamGuest ? quickExamGuest.phone : currentUser.username;
  const guestName = currentExamIsQuick && quickExamGuest ? quickExamGuest.name : null;
  practiceQuestions.forEach(q => {
    let userAnswer = '';
    if (q.type === 'multiple') {
      const sel = examAnswers[q.id] || {};
      userAnswer = Object.keys(sel).filter(k => sel[k] && k !== '_confirmed').sort().join(',');
    } else {
      userAnswer = examAnswers[q.id] || '';
    }
    const isCorrect = checkAnswer(userAnswer, q.answer, q.type);
    if (isCorrect) correct++;
    const rec = {
      student_id: studentId,
      question_id: q.id,
      is_correct: isCorrect,
      user_answer: userAnswer,
      is_fav: false,
      exam_id: currentExamId
    };
    if (guestName) rec.guest_name = guestName;
    records.push(rec);
  });
  await dbInsert('records', records);
  // Award XP for completing exam (not for quick exam guests)
  if (!currentExamIsQuick && currentUser) {
    const examXp = currentExamIsMock ? XP_REWARDS.mock_exam : XP_REWARDS.real_exam;
    addXp(examXp, currentExamIsMock ? '完成模拟考试' : '完成考试');
    // Also add per-question XP
    const questionXp = correct * XP_REWARDS.correct + (practiceQuestions.length - correct) * XP_REWARDS.wrong;
    addXp(questionXp, '考试答题');
  }
  // 记录考试日志
  recordLog('exam_submit', { exam_id: currentExamId, correct, total: practiceQuestions.length, is_mock: currentExamIsMock });
  // 保存模拟考试历史
  if (currentExamIsMock && currentUser) {
    saveMockExamHistory(correct, practiceQuestions.length);
  }
  // 交卷后立即同步并退出考试模式
  setExamMode(false);
  syncAll();

  renderExamResult(correct, practiceQuestions.length);
}

      <div class="stat-card blue"><div class="stat-icon">✍️</div><div class="stat-value" data-target="${totalCount}">0</div><div class="stat-label">答题</div></div>
      <div class="stat-card green"><div class="stat-icon">✓</div><div class="stat-value" data-target="${pct}">0</div><div class="stat-label">正确率%</div></div>
      <div class="stat-card orange"><div class="stat-icon">❌</div><div class="stat-value" data-target="${wrongCount}">0</div><div class="stat-label">错题</div></div>
      <div class="stat-card purple"><div class="stat-icon">⭐</div><div class="stat-value" data-target="${favCount}">0</div><div class="stat-label">收藏</div></div>
    </div>
    
    <!-- Tab导航区 -->
    <div class="profile-tab-nav" style="margin:12px">
      <button class="profile-tab ${_profileSubTab === 'task' ? 'active' : ''}" onclick="switchProfileTab('task')">📋 今日任务</button>
      <button class="profile-tab ${_profileSubTab === 'ranking' ? 'active' : ''}" onclick="switchProfileTab('ranking')">🏆 学习排名</button>
      <button class="profile-tab ${_profileSubTab === 'settings' ? 'active' : ''}" onclick="switchProfileTab('settings')">⚙️ 设置</button>
    </div>
    
    <!-- 内容区 -->
    <div id="profileSubContent" style="margin:0 12px 12px;overflow:hidden"></div>
  `;

  document.querySelectorAll('.stat-value[data-target]').forEach(el => {
    animateNumber(el, parseInt(el.dataset.target));
  });
  
  // 加载当前Tab内容
  switchProfileTab(_profileSubTab);
  
  } catch (e) {
    console.error('renderProfile error:', e);
    document.getElementById('studentContent').innerHTML = `
      <div class="card" style="margin-top:12px;padding:20px;text-align:center">
        <div style="font-size:2rem;margin-bottom:12px">⚠️</div>
        <div style="color:var(--text2)">加载失败，请刷新重试</div>
        <button class="btn btn-primary" style="margin-top:12px" onclick="renderProfile()">重新加载</button>
      </div>
    `;
  }
}

function switchProfileTab(tab) {
  _profileSubTab = tab;
  
  // 更新Tab样式
  document.querySelectorAll('.profile-tab').forEach(btn => {
    btn.classList.toggle('active', btn.getAttribute('onclick').includes(`'${tab}'`));
  });
  
  const container = document.getElementById('profileSubContent');
  if (!container) return;
  
  switch(tab) {
    case 'task': renderProfileTask(container); break;
    case 'ranking': renderProfileRanking(container); break;
    case 'settings': renderProfileSettings(container); break;
  }
}

// 在"我的"页面显示任务进度
async function loadTaskProgressInProfile() {
  if (!currentUser) return;
  
  try {
    // student_id 存储的是手机号(username)
    const res = await fetch(`/api/daily-task/status?student_id=${currentUser.username}`, {
      headers: { 'X-API-Token': API_TOKEN }
    });
    const task = await res.json();
    
    const container = document.getElementById('taskProgressContent');
    if (!container) return;
    
    const tasks = [
      { name: '登录奖励', done: task.login_bonus, icon: '🎁' },
      { name: `刷题${task.practice_target || 20}道`, done: task.practice_count >= (task.practice_target || 20), progress: `${task.practice_count}/${task.practice_target || 20}`, icon: '✍️' },
      { name: '完成作业', done: task.homework_done, icon: '📝' },
      { name: `错题练习${task.wrong_practice_target || 10}道`, done: task.wrong_practice_count >= (task.wrong_practice_target || 10), progress: `${task.wrong_practice_count}/${task.wrong_practice_target || 10}`, icon: '🔄' }
    ];
    
    const doneCount = tasks.filter(t => t.done).length;
    
    container.innerHTML = `
      <div style="display:grid;grid-template-columns:1fr;gap:8px">
        ${tasks.map(t => `
          <div style="display:flex;align-items:center;gap:10px;padding:12px;background:${t.done ? 'rgba(16,185,129,0.1)' : 'var(--bg)'};border-radius:10px;border:1px solid ${t.done ? '#10b981' : 'var(--border)'}">
            <span style="font-size:1.3rem;flex-shrink:0">${t.icon}</span>
            <div style="flex:1;min-width:0;overflow:hidden">
              <div style="font-size:.85rem;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t.name}</div>
              ${t.progress ? `<div style="font-size:.75rem;color:var(--text3);margin-top:2px">${t.progress}</div>` : ''}
            </div>
            <span style="color:${t.done ? '#10b981' : 'var(--text3)'};font-size:1.2rem;flex-shrink:0">${t.done ? '✓' : '○'}</span>
          </div>
        `).join('')}
      </div>
      <div style="margin-top:12px;text-align:center;font-size:.85rem;color:var(--text3);padding:8px;background:var(--bg);border-radius:8px">
        今日完成：<span style="color:var(--primary);font-weight:600">${doneCount}</span>/4 项任务
      </div>
    `;
  } catch (e) {
    const container = document.getElementById('taskProgressContent');
    if (container) container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text3)">加载失败</div>';
  }
}

async function loadWrongAnalysis() {
  try {
    const res = await fetch(`/api/daily-task/wrong-analysis?student_id=${currentUser.username}`);
    const data = await res.json();
    
    const container = document.getElementById('wrongAnalysisContent');
    if (!container) return;
    
    // 题型分析
    const typeMap = { single: '单选题', multiple: '多选题', judge: '判断题' };
    let typeHtml = '<div style="margin-bottom:12px"><div style="font-size:.85rem;font-weight:600;margin-bottom:8px;color:var(--text2)">题型分析</div>';
    
    if (data.typeStats && data.typeStats.length > 0) {
      typeHtml += '<div style="display:flex;flex-direction:column;gap:6px">';
      data.typeStats.forEach(stat => {
        const rate = stat.total > 0 ? Math.round(stat.correct / stat.total * 100) : 0;
        const rateColor = rate >= 80 ? '#10b981' : rate >= 60 ? '#f59e0b' : '#ef4444';
        typeHtml += `
          <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:var(--bg);border-radius:8px">
            <div style="display:flex;align-items:center;gap:8px">
              <span style="font-weight:600">${typeMap[stat.type] || stat.type}</span>
              <span style="font-size:.75rem;color:var(--text3)">错${stat.wrong}题</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px">
              <div style="width:60px;height:6px;background:var(--border);border-radius:3px;overflow:hidden">
                <div style="width:${rate}%;height:100%;background:${rateColor}"></div>
              </div>
              <span style="font-size:.8rem;font-weight:600;color:${rateColor}">${rate}%</span>
            </div>
          </div>
        `;
      });
      typeHtml += '</div>';
    } else {
      typeHtml += '<div style="text-align:center;color:var(--text3);padding:12px">暂无答题数据</div>';
    }
    typeHtml += '</div>';
    
    // 知识点分析（如果有tags）
    let tagHtml = '';
    if (data.tagStats && data.tagStats.length > 0) {
      tagHtml = '<div style="margin-top:12px"><div style="font-size:.85rem;font-weight:600;margin-bottom:8px;color:var(--text2)">薄弱知识点 TOP 5</div>';
      tagHtml += '<div style="display:flex;flex-wrap:wrap;gap:6px">';
      data.tagStats.slice(0, 5).forEach(stat => {
        const rate = stat.total > 0 ? Math.round(stat.correct / stat.total * 100) : 0;
        tagHtml += `<span class="tag tag-red" style="cursor:pointer" onclick="practiceByTag('${stat.tag}')">${stat.tag} (${rate}%)</span>`;
      });
      tagHtml += '</div></div>';
    }
    
    // 快捷操作
    let actionHtml = `
      <div style="margin-top:16px;display:flex;gap:8px">
        <button class="btn btn-outline" style="flex:1" onclick="switchStudentTab('wrong')">
          ❌ 错题练习
        </button>
        <button class="btn btn-outline" style="flex:1" onclick="startTargetPractice()">
          🎯 针对练习
        </button>
      </div>
    `;
    
    container.innerHTML = typeHtml + tagHtml + actionHtml;
  } catch (e) {
    console.error('加载错题分析失败:', e);
    const container = document.getElementById('wrongAnalysisContent');
    if (container) {
      container.innerHTML = '<div style="text-align:center;color:var(--text3);padding:12px">加载失败，请刷新重试</div>';
    }
  }
}

function practiceByTag(tag) {
  // 按知识点练习（目前题目没有tags，提示用户）
  showToast(`即将练习"${tag}"相关题目`, 'info');
  // 切换到错题模式
  practiceMode = 'wrong';
  switchStudentTab('practice');
}

function startTargetPractice() {
  // 开始针对性练习：基于薄弱题型
  showToast('将针对你的薄弱题型进行强化练习', 'info');
  practiceMode = 'wrong';
  switchStudentTab('practice');
}

let _currentRankPeriod = 'today';

async function loadRanking(period = 'today') {
  _currentRankPeriod = period;
  const container = document.getElementById('rankingContent');
  if (!container) return;
  
  container.innerHTML = '<div style="text-align:center;padding:20px;color:var(--text3)"><span class="spinner"></span> 加载排名...</div>';
  
  try {
    const res = await fetch(`/api/daily-task/ranking?period=${period}&level=${currentLevel}&my_student_id=${currentUser.username}`, {
      headers: { 'X-API-Token': API_TOKEN }
    });
    const data = await res.json();
    
    const periodLabels = { today: '今日', week: '本周', month: '本月' };
    const periodBtns = ['today', 'week', 'month'].map(p => 
      `<button class="mode-btn ${period === p ? 'active' : ''}" onclick="loadRanking('${p}')">${periodLabels[p]}</button>`
    ).join('');
    
    let html = `
      <div class="practice-modes" style="margin-bottom:12px">${periodBtns}</div>
    `;
    
    // 我的排名
    if (data.myRank) {
      html += `
        <div style="background:linear-gradient(135deg,var(--primary),#7c3aed);color:#fff;padding:10px 14px;border-radius:10px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between">
          <div style="display:flex;align-items:center;gap:8px">
            <span style="font-size:1.5rem">🏆</span>
            <div>
              <div style="font-weight:700">我的排名</div>
              <div style="font-size:.75rem;opacity:.9">${periodLabels[period]}第 ${data.myRank} 名</div>
            </div>
          </div>
          <div style="text-align:right">
            <div style="font-weight:700">${currentUser.xp || 0} XP</div>
            <div style="font-size:.7rem;opacity:.9">Lv.${currentUser.study_level || 1}</div>
          </div>
        </div>
      `;
    }
    
    // 排名列表
    if (data.rankings && data.rankings.length > 0) {
      html += '<div style="display:flex;flex-direction:column;gap:6px">';
      data.rankings.slice(0, 10).forEach((r, i) => {
        const rankIcon = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `${i + 1}`;
        const isMe = r.username === currentUser.username;
        html += `
          <div style="display:flex;align-items:center;gap:10px;padding:10px 12px;background:${isMe ? 'var(--primary-light)' : 'var(--bg)'};border-radius:10px;border:${isMe ? '2px solid var(--primary)' : 'none'}">

            <div style="flex:1;min-width:0">
              <div style="font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escHtml(r.nickname || '匿名')}</div>
              <div style="font-size:.7rem;color:var(--text3)">${r.level || ''}${r.cohort ? ' · ' + r.cohort : ''}</div>
            </div>
            <div style="text-align:right">
              <div style="font-weight:700;color:var(--primary)">${r.total_questions || 0}题</div>
              <div style="font-size:.7rem;color:var(--text3)">${r.accuracy || 0}%正确</div>
            </div>
          </div>
        `;
      });
      html += '</div>';
    } else {
      html += '<div style="text-align:center;color:var(--text3);padding:20px">暂无排名数据</div>';
    }
    
    container.innerHTML = html;
  } catch (e) {
    console.error('加载排名失败:', e);

            </div>
          </div>
          <div style="font-size:.75rem;color:var(--text3)">${fmtLocalShort(log.created_at)}</div>
        </div>
        ${log.details && Object.keys(log.details).length > 0 ? `<div style="font-size:.75rem;color:var(--text3);margin-top:4px;padding-left:24px">${escHtml(JSON.stringify(log.details))}</div>` : ''}

async function changePassword() {
  const oldPwd = document.getElementById('oldPwd').value.trim();
  const newPwd = document.getElementById('newPwd').value.trim();
  const confirmPwd = document.getElementById('confirmPwd').value.trim();
  if (!oldPwd || !newPwd || !confirmPwd) { showToast('请填写所有字段', 'error'); return; }
  // Determine table and user based on role
  const table = userRole === 'admin' ? 'admins' : 'students';
  const user = userRole === 'admin' ? currentAdmin : currentUser;
  // Verify old password via server
  const verifyRes = await fetch(`${API_BASE}/login`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'X-API-Token': API_TOKEN },
    body: JSON.stringify({ table, username: user.username, password: oldPwd })
  });
  const verifyData = await verifyRes.json();
  if (verifyData.error) { showToast('当前密码错误', 'error'); return; }
  if (newPwd.length < 6) { showToast('新密码至少6位', 'error'); return; }
  if (newPwd !== confirmPwd) { showToast('两次输入的新密码不一致', 'error'); return; }
  try {
    await dbUpdate(table, { password: newPwd }, { id: user.id });
    user.password = newPwd;
    if (userRole === 'admin') {
      saveLogin('admin', null, user);
    } else {
      saveLogin('student', user, null);
    }
    showToast('密码修改成功', 'success');
    closeModal();
  } catch(e) {
    showToast('密码修改失败', 'error');
  }
}

async function sendNotificationToStudents() {
  const title = document.getElementById('notifyTitle')?.value?.trim();

// submitHomeworkFinal - 提交作业
async function submitHomeworkFinal() {
  if (!_currentStudentHomework || !_homeworkQuestions) {
    showToast('作业数据异常', 'error');
    return;
  }
  
  // 检查是否全部作答
  const totalQuestions = _homeworkQuestions.length;
  const answeredCount = Object.keys(_homeworkAnswered).length;
  
  if (answeredCount < totalQuestions) {
    const confirmed = await new Promise(resolve => {
      showConfirm(`还有${totalQuestions - answeredCount}题未作答，确定提交吗？`, () => resolve(true));
      // 3秒后自动关闭
      setTimeout(() => resolve(false), 3000);
    });
    if (!confirmed) return;
  }
  
  try {
    // 计算成绩
    let correct = 0;
    _homeworkQuestions.forEach(q => {
      const ans = _homeworkAnswered[q.id];
      if (ans && ans.isCorrect) correct++;
    });
    
    const score = Math.round(correct / totalQuestions * 100);
    
    // 更新作业状态
    await fetch('/api/homework/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-API-Token': API_TOKEN },
      body: JSON.stringify({
        homework_id: _currentStudentHomework.id,
        student_id: currentUser.id,
        score,
        answers: _homeworkAnswered
      })
    });
    
    // 清除进度
    clearHomeworkProgress(_currentStudentHomework.id);
    
    // 显示完成页面
    renderHomeworkComplete();
  } catch(e) {
    showToast('提交失败', 'error');
  }
}

// ===== Initialize =====
async function init() {
  initTheme(); // Ensure theme is applied before any rendering
  // Check for enrollment URL: #enroll=configId
  const enrollMatch = location.hash.match(/^#enroll=(\d+)$/);
  if (enrollMatch) {
    const configId = parseInt(enrollMatch[1]);
    renderEnrollmentPage(configId);
    return;
  }
  // Check for quick exam URL: #quick=examId
  const quickMatch = location.hash.match(/^#quick=(\d+)$/);
  if (quickMatch) {
    const quickExamId = parseInt(quickMatch[1]);
    renderQuickExamGuest(quickExamId);
    return;
  }
  const session = checkSession();
  if (session) {
    userRole = session.role;
    currentUser = session.user;
    if (session.admin) currentAdmin = session.admin;
    if (userRole === 'student' && currentUser) {
      // Verify account is still active
      try {
        const students = await dbSelect('students', { eq: { id: currentUser.id } });
        if (students.length === 0 || students[0].status === 'disabled') {
          showToast('账号已被禁用，请联系管理员', 'error');
          clearLogin();
          userRole = null;
          currentUser = null;
          renderLogin();
          return;
        }
        if (students[0].status === 'expired' || (students[0].expires_at && new Date(students[0].expires_at) < new Date())) {
          showToast('账号已过期，请联系管理员续期', 'error');
          clearLogin();
          userRole = null;
          currentUser = null;
          renderLogin();
          return;
        }
        // Update current user data
        currentUser = students[0];
        if (!currentUser.study_level || currentUser.study_level < 1) {
          currentUser.study_level = levelFromXp(currentUser.xp || 0);
        }
      } catch(e) {}
    }
    if (userRole === 'admin') { renderAdmin(); startSessionCheck(); }
    else { renderStudent(); startSessionCheck(); }
  } else {
    renderLogin();
  }
}

// ===== Enrollment Page (Student) =====
async function renderEnrollmentPage(configId) {
  const app = document.getElementById('app');
  app.innerHTML = `<div class="login-page"><div class="login-card" style="text-align:center;padding:40px"><div style="font-size:2rem;margin-bottom:12px">⏳</div><h3>加载中...</h3></div></div>`;
  
  try {
    const response = await fetch(`/api/enroll-config/get?id=${configId}`, {
      headers: { 'X-API-Token': API_TOKEN }
    });
    const config = await response.json();
    
    if (!config || !config.id) {
      app.innerHTML = `<div class="login-page"><div class="login-card" style="text-align:center;padding:40px"><div style="font-size:2rem;margin-bottom:12px">❌</div><h3>报名不存在</h3><p style="color:var(--text2);margin-top:8px">该报名可能已被删除或关闭</p></div></div>`;
      return;
    }
    
    if (config.status !== 'active') {
      app.innerHTML = `<div class="login-page"><div class="login-card" style="text-align:center;padding:40px"><div style="font-size:2rem;margin-bottom:12px">🔒</div><h3>报名已关闭</h3><p style="color:var(--text2);margin-top:8px">该报名已停止，请联系管理员</p></div></div>`;
      return;
    }
    
    const now = Date.now();
    if (config.start_time && new Date(config.start_time).getTime() > now) {
      app.innerHTML = `<div class="login-page"><div class="login-card" style="text-align:center;padding:40px"><div style="font-size:2rem;margin-bottom:12px">⏳</div><h3>报名尚未开始</h3><p style="color:var(--text2);margin-top:8px">开始时间：${escHtml(fmtLocal(config.start_time))}</p></div></div>`;
      return;
    }
    if (config.end_time && new Date(config.end_time).getTime() < now) {
      app.innerHTML = `<div class="login-page"><div class="login-card" style="text-align:center;padding:40px"><div style="font-size:2rem;margin-bottom:12px">⏰</div><h3>报名已截止</h3><p style="color:var(--text2);margin-top:8px">截止时间：${escHtml(fmtLocal(config.end_time))}</p></div></div>`;
      return;

async function enterQuickExam(examId) {
  const btn = document.getElementById('guestStartBtn');
  if (btn.disabled) return;
  const name = document.getElementById('guestName').value.trim();
  const phone = document.getElementById('guestPhone').value.trim();
  if (!name) { showToast('请输入姓名', 'error'); return; }
  if (!/^1[3-9]\d{9}$/.test(phone)) { showToast('请输入正确的11位手机号', 'error'); return; }

  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>';
  try {
    const exams = await dbSelect('exams', { eq: { id: examId } });
    if (!exams.length) { showToast('考试不存在', 'error'); return; }
    const exam = exams[0];

    // Re-check exam time validity
    const nowTs = Date.now();
    if (nowTs < new Date(exam.start_time).getTime()) { showToast('考试尚未开始', 'error'); return; }
    if (nowTs > new Date(exam.end_time).getTime()) { showToast('考试已结束', 'error'); return; }

    // Check if this phone already took this exam
    const existRecords = await dbSelect('records', { eq: { student_id: phone, exam_id: Number(examId) } });
    if (existRecords.length > 0) {
      showToast('该手机号已参加过本次考试', 'info');
      return;
    }

    // Save guest info
    quickExamGuest = { name, phone };
    examData = exam;
    currentExamId = exam.id ? Number(exam.id) : null;
    currentExamIsMock = false;
    currentExamIsQuick = true;
    currentExamPassRate = exam.pass_rate || 60;
    examAnswers = {};
    fullscreenExitCount = 0;
    examRemaining = exam.duration * 60;

    // Anti-cheat: disable right-click, text selection, and detect tab switching
    document.addEventListener('contextmenu', preventContextMenu);
    document.body.style.userSelect = 'none';
    document.body.style.webkitUserSelect = 'none';
    document.addEventListener('visibilitychange', handleVisibilityChange);

    // Load exam questions
    const allQ = await dbSelect('questions', { order: ['id', false] });
    practiceQuestions = (exam.question_ids || []).map(id => allQ.find(q => q.id == id)).filter(Boolean);

    renderExamTaking();
  } catch(e) {
    showToast('进入考试失败', 'error');
  } finally {
    btn.disabled = false;
    btn.textContent = '进入考试';
  }
}

// === Archive functions ===
async function showArchiveDialog() {
  // Count expired students and their records
  const expiredStudents = await dbSelect('students', { eq: { status: 'expired' }, select: ['id', 'nickname', 'username', 'expires_at'] });
  const disabledStudents = await dbSelect('students', { eq: { status: 'disabled' }, select: ['id', 'nickname', 'username', 'expires_at'] });
  const archivable = [...expiredStudents, ...disabledStudents];
  
  if (archivable.length === 0) {
    showToast('当前没有过期或禁用的学生，无需归档', 'info');
    return;
  }
  
  // Count records for these students
  const studentIds = archivable.map(s => s.id);
  let recordCount = 0;
  // Use count API for efficiency
  for (const sid of studentIds) {
    const cnt = await dbCount('records', { student_id: sid });
    recordCount += cnt;
  }
  
  const sizeEst = (recordCount * 189 / 1024 / 1024).toFixed(2);
  
  openModal('📦 归档过期学生数据', `
    <div style="padding:2px 0">
      <div style="background:var(--bg);border-radius:8px;padding:12px;margin-bottom:12px">
        <div style="font-size:0.85rem;font-weight:600;margin-bottom:8px">归档预览</div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:0.8rem">
          <div>过期/禁用学生: <strong>${archivable.length}</strong> 人</div>
          <div>关联答题记录: <strong>${recordCount}</strong> 条</div>
          <div>预计释放空间: <strong>${sizeEst} MB</strong></div>
          <div>归档方式: <strong>删除记录</strong></div>
        </div>
      </div>
      <div style="font-size:0.78rem;color:var(--text2);margin-bottom:12px">
        ⚠️ 归档将删除这些学生的答题记录，学生账号保留。错题本、学情统计中的相关数据将受影响。此操作不可恢复！
      </div>
      <div class="form-group">
        <label>请输入 "确认归档" 以继续</label>
        <input id="archiveConfirmInput" class="form-input" placeholder="确认归档" autocomplete="off">
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:8px" onclick="doArchive()">执行归档</button>
    </div>
  `);
}

async function doArchive() {
  const input = document.getElementById('archiveConfirmInput').value.trim();
  if (input !== '确认归档') {
    showToast('请输入"确认归档"以确认操作', 'error');
    return;
  }
  
  try {
    const expiredStudents = await dbSelect('students', { eq: { status: 'expired' }, select: ['id'] });
    const disabledStudents = await dbSelect('students', { eq: { status: 'disabled' }, select: ['id'] });
    const studentIds = [...expiredStudents, ...disabledStudents].map(s => s.id);
    
    if (studentIds.length === 0) {
      showToast('没有需要归档的学生', 'info');
      return;
    }
    
    let deletedCount = 0;
    // Delete records in batches of 50 to avoid timeout
    const batchSize = 50;
    for (let i = 0; i < studentIds.length; i += batchSize) {
      const batch = studentIds.slice(i, i + batchSize);
      for (const sid of batch) {
        await dbDelete('records', { student_id: sid });
      }
      deletedCount += batch.length;
      // Update progress
      const pct = Math.round((i + batchSize) / studentIds.length * 100);
      document.getElementById('archiveConfirmInput') && (document.getElementById('archiveConfirmInput').placeholder = `正在归档... ${Math.min(pct, 100)}%`);
    }
    
    // Clear all caches - use cacheClearTable for proper table cache clearing
    cacheClearTable('records');
    cacheClearTable('students');
    closeModal();
    showToast(`归档完成！已清理 ${studentIds.length} 名学生的答题记录`, 'success');
  } catch(e) {
    console.error('Archive failed:', e);
    showToast('归档失败: ' + (e.message || '未知错误'), 'error');
  }
}
